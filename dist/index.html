.att-f:hover { box-shadow: inset 0 0 0 2px var(--a-blue); }
.att-f > span { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.att-f strong { font-size: 15px; }
.att-f em { font-style: normal; font-size: 14px; color: var(--a-dim); }
.att-f > b { font: 400 9px/1 var(--px); color: #A9C7FF; white-space: nowrap; padding: 6px; }
.att-f.on { box-shadow: inset 0 0 0 3px var(--a-blue); }
.att-f.on > b { color: #fff; background: var(--a-blue); }
.att-f .fnum { flex: none; width: 26px; height: 26px; background: var(--a-yellow); color: var(--a-bg); font: 400 10px/26px var(--px); font-style: normal; text-align: center; }

/* findings */
.fr-src { font: 600 12px/1.3 var(--disp); color: var(--a-dim); text-transform: uppercase; letter-spacing: .05em; }
.fr-att { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.fr-att li { display: inline-flex; align-items: center; gap: 6px; padding: 4px 4px 4px 10px; background: rgba(77, 141, 255, .14); box-shadow: inset 0 0 0 2px var(--a-blue); font-size: 13px; }
.chip.x { padding: 5px 6px 4px; font-size: 8px; }
.tray-open { box-shadow: inset 0 0 0 2px var(--a-line); padding: 8px 12px; }
.tray-open:hover { box-shadow: inset 0 0 0 2px var(--a-yellow); }
.open-lbl { font: 400 9px/1 var(--px); color: var(--a-dim); }

@media (max-width: 760px) {
  :is(.round1, .round2) .panel { top: calc(48px + env(safe-area-inset-top, 0px)); left: 0; right: 0; bottom: 80px; padding-top: 0; }
  .panel-head { flex-wrap: wrap; gap: 10px; padding: 10px 12px; }
  .ph-title .sys { display: none; }
  .pclock { font-size: 22px; }
  .btn.back-desk { padding: 12px 12px 11px; font-size: 10px; }
  .reader { padding-inline: 12px; }
  .answers { grid-template-columns: minmax(0, 1fr); }
  .calv { grid-template-columns: minmax(0, 1fr); padding: 14px; }
  .wk-grid { grid-template-columns: minmax(0, 1fr); }
  .wk-day { min-height: 0; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .docp { padding: 18px 14px; }
  .pin strong { font-size: 7px; }
  .pin em { display: none; }
  .pin span { padding: 5px 6px 4px; }
  .pdl { grid-template-columns: minmax(0, 1fr); gap: 2px 0; }
  .pdl dd { margin-bottom: 8px; }
  .cx { max-width: 100%; }
  .tray-open { padding: 6px 8px; gap: 10px; }
  .open-lbl { display: none; }
  .cmap { height: clamp(300px, 60vh, 520px); }
}

/* documents read clean: no scanlines while the workspace is open */
.wx.arcade:has(:is(.round1, .round2) .panel:not([hidden]))::after { opacity: 0; }
@media (max-width: 760px) {
  .finding-row { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px 12px; }
  .finding-row .row-tools { grid-column: 1 / -1; justify-content: flex-end; }
  .round1 ~ .a-mute, .a-mute { top: calc(8px + env(safe-area-inset-top, 0px)); padding: 7px 8px; }
}

/* documents use the plain system face real business software uses */
.wx { --doc: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
.docp, .docp h3, .docp-sys, .dblock h4, .dtable th, .kpi strong, .k-l, .sc-note b, .calv, .cal-col h3, .tab, .wk-day > b, .calpop .pop-body, .calpop h3, .pp-kind, .now-line span { font-family: var(--doc) !important; }
@media (min-width: 761px) {
  :is(.round1, .round2) .panel { top: calc(10px + env(safe-area-inset-top, 0px)); }
  .panel-head { padding-right: 130px; }
}

/* ================================================================ ROUND 2: WITH WAKE
   Same desk, same type, cyan for Wake. The insight list is the one busy surface, and even
   it starts short: headline, what it was built from, what to do, who. Depth is one click in. */

/* stage complete, and the reset */
.stage-done { min-height: 86vh; justify-content: center; align-items: center; text-align: center; }
.center-card { display: flex; flex-direction: column; align-items: center; gap: 18px; max-width: 760px; margin: 0 auto; }
.stage-k { font: 400 12px/1 var(--px); color: var(--a-dim); letter-spacing: .14em; }
.stage-k.cy { color: var(--a-cyan); }
.screen h1.stage-h { font: 400 clamp(34px, 7vw, 64px)/1 var(--px); color: var(--a-yellow); text-shadow: 4px 4px 0 var(--a-pink); }
.center-card .lede { text-align: center; }
.center-card .lede.dim { color: var(--a-dim); }
.cstats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: 100%; margin: 6px 0; }
.cstat { display: flex; flex-direction: column; gap: 6px; padding: 16px 10px; background: var(--a-panel); box-shadow: inset 0 0 0 3px var(--a-line); }
.cstat b { font: 400 34px/1 var(--term); color: var(--a-yellow); }
.cstat span { font: 400 9px/1.4 var(--px); color: var(--a-dim); text-transform: uppercase; }
.btn.big { font-size: 14px; padding: 18px 26px 17px; }
.reset .big-clock { color: var(--a-cyan); }
.typed.center { display: flex; flex-direction: column; gap: 12px; min-height: 6em; max-width: 36em; }
.typed.center p { font-size: 20px; line-height: 1.5; text-align: center; }
.typed.center .stamp-px { font: 400 14px/1.5 var(--px); color: var(--a-cyan); }
.scan h1 { color: var(--a-cyan); }

/* the ghost layer: Wake loading into the computer */
.ghost-layer { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 45; pointer-events: none; }

/* desk details */
.wake-spot .tag { box-shadow: inset 0 0 0 2px var(--a-cyan); color: var(--a-cyan); }
.wake-spot:hover .tag { background: var(--a-cyan); color: var(--a-bg); box-shadow: inset 0 0 0 2px var(--a-cyan); }
.round2 .spot:hover, .round2 .spot:focus-visible { background: rgba(57, 229, 224, .1); box-shadow: inset 0 0 0 3px var(--a-cyan); }
.round2 .spot:hover .tag { background: var(--a-cyan); color: var(--a-bg); box-shadow: inset 0 0 0 2px var(--a-cyan); }
.round2 .pclock, .round2 .ph-title h2 { color: var(--a-cyan); }
.round2 .btn.back-desk { background: var(--a-cyan); box-shadow: inset 0 0 0 3px var(--a-cyan), 4px 4px 0 var(--a-pink); }
.wake-tray { box-shadow: 0 -3px 0 var(--a-line), 0 -6px 0 var(--a-bg), 0 -9px 0 var(--a-cyan) !important; }
.wake-tray .tray-open b, .wake-tray .tcount.ok { color: var(--a-cyan); }
.wake-tray .slots i.on { background: var(--a-cyan); }
.toast.cy { box-shadow: inset 0 0 0 2px var(--a-cyan); }
.toast.note.cy { max-width: 420px; }
.item em.wtag, .wtag { align-self: flex-start; margin-top: 4px; font: 400 8px/1.4 var(--px); font-style: normal; background: var(--a-cyan); color: var(--a-bg); padding: 4px 6px; }
.item em.wtag.dim, .wtag.dim { background: transparent; color: var(--a-dim); box-shadow: inset 0 0 0 1px var(--a-line); }
.wk-dot { width: 10px; height: 10px; flex: none; margin-top: 7px; background: var(--a-cyan); }
.wake-note { display: flex; gap: 10px; align-items: baseline; padding: 10px 12px; background: rgba(57, 229, 224, .1); box-shadow: inset 3px 0 0 var(--a-cyan); font-size: 15px; line-height: 1.45; }
.wake-note b { font: 400 9px/1 var(--px); color: var(--a-cyan); flex: none; }
.wake-note.dim { background: transparent; color: var(--a-dim); box-shadow: inset 3px 0 0 var(--a-line); }
.calpop .wake-note { background: #E2FAF9; color: #0B4A48; box-shadow: inset 3px 0 0 #1FB5B0; }
.calpop .wake-note b { color: #0B7F7B; }
.sent-tag { font: 400 9px/1 var(--px); color: var(--a-cyan); padding: 8px 0; }
.btn.send-btn { color: var(--a-bg); background: var(--a-cyan); box-shadow: inset 0 0 0 3px var(--a-cyan), 4px 4px 0 #1B6E6B; font-size: 9px; padding: 10px 12px 9px; margin-top: 4px; }

/* the computer: insights */
.wk-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 10px 20px; max-width: 1080px; width: 100%; }
.wk-k { font: 400 10px/1.4 var(--px); color: var(--a-cyan); letter-spacing: .06em; }
.wk-sum { font-size: 16px; color: var(--a-dim); margin-top: 6px; }
.wk-pick { font-size: 15px; color: var(--a-dim); }
.wk-pick b { font: 400 30px/1 var(--term); color: var(--a-ink); margin-right: 6px; }
.wk-pick.ok b { color: var(--a-cyan); }
.ins-list { display: flex; flex-direction: column; gap: 10px; max-width: 1080px; width: 100%; }
.ins { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 14px; align-items: start; padding: 16px 18px; background: var(--a-panel); box-shadow: inset 0 0 0 2px var(--a-line); }
.ins.urgent { box-shadow: inset 0 0 0 2px var(--a-pink); }
.ins.picked { box-shadow: inset 0 0 0 3px var(--a-cyan); background: #12223A; }
.ins.routine { opacity: .92; }
.ins.routine .ins-rank { color: var(--a-dim); }
.ins-rank { font: 400 26px/1 var(--px); color: var(--a-cyan); padding-top: 2px; }
.ins-main { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
.ins-place { font: 400 9px/1.4 var(--px); color: var(--a-dim); letter-spacing: .05em; }
.ins h3 { font: 600 21px/1.25 var(--disp); }
.built { display: flex; flex-direction: column; gap: 6px; }
.b-l, .mono-l { font: 400 8px/1.4 var(--px); color: var(--a-dim); letter-spacing: .06em; }
.src-row { display: flex; flex-wrap: wrap; gap: 6px; }
.src-chip { display: flex; flex-direction: column; gap: 2px; text-align: left; padding: 7px 10px; background: var(--a-panel2); border: 0; box-shadow: inset 0 0 0 2px var(--a-line); max-width: 300px; min-width: 0; color: var(--a-ink); }
.src-chip:hover, .src-chip:focus-visible { box-shadow: inset 0 0 0 2px var(--a-cyan); outline: none; }
.sc-sys { font: 400 7px/1.4 var(--px); color: var(--a-cyan); text-transform: uppercase; }
.sc-l { font-size: 13.5px; line-height: 1.3; }
.src-chip.seen-r1 { box-shadow: inset 0 0 0 2px rgba(255, 210, 63, .55); }
.src-chip.flagged-r1 { box-shadow: inset 0 0 0 2px var(--a-yellow); }
.src-more { border: 0; background: none; color: var(--a-cyan); font: 400 8px/1 var(--px); padding: 8px 6px; }
.ins .do { align-items: baseline; }
.ins .do p { font-size: 17px; }
.ins-foot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 14px; }
.ins-foot .owner { font-size: 14px; }
.ins-foot .owner em { font-style: normal; color: var(--a-dim); }
.link.more { font: 400 9px/1 var(--px); text-decoration: none; color: var(--a-cyan); padding: 6px 0; }
.ins-more { display: flex; flex-direction: column; gap: 10px; padding-top: 10px; border-top: 1px solid var(--a-line); }
.ins-more .why { font-size: 16px; line-height: 1.55; }
.btn.pick { align-self: start; white-space: nowrap; font-size: 10px; padding: 12px 14px 11px; box-shadow: inset 0 0 0 3px var(--a-cyan); color: var(--a-cyan); }
.btn.pick.on { background: var(--a-cyan); color: var(--a-bg); box-shadow: inset 0 0 0 3px var(--a-cyan), 4px 4px 0 var(--a-pink); }
.cleared { max-width: 1080px; width: 100%; padding: 12px 16px; background: var(--a-panel); box-shadow: inset 0 0 0 2px var(--a-line); }
.cleared summary { cursor: pointer; font: 400 9px/1.6 var(--px); color: var(--a-dim); }
.cleared ul { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.cleared li { display: flex; flex-direction: column; gap: 2px; font-size: 14px; color: var(--a-dim); }
.cleared li strong { color: var(--a-ink); text-decoration: line-through; text-decoration-color: var(--a-pink); }

/* trace: where a line came from */
.pop.trace .pop-body { width: min(760px, 100%); }
.pop.trace .pop-body > h3 { font: 700 22px/1.25 var(--doc, var(--read)); }
.tr-val { font: 700 18px/1.3 var(--doc, var(--read)); color: var(--p-ink); }
.tr-src { font-size: 13px; color: var(--p-dim); }
.docp.mini { box-shadow: 0 0 0 1px var(--p-line); padding: 14px 16px; max-width: none; background: #FBFBFD; }
.mini-h { font: 700 12px/1.3 var(--doc, var(--read)); text-transform: uppercase; letter-spacing: .05em; margin-top: 6px; }
.dtable td.tr-hl { background: #FFE98A; font-weight: 700; box-shadow: inset 0 0 0 2px var(--a-yellow); }
.quote-src { padding: 12px 14px; background: #F7F6FA; box-shadow: inset 3px 0 0 #5B4C99; display: flex; flex-direction: column; gap: 6px; }
.quote-src.message { box-shadow: inset 3px 0 0 #3B82F6; }
.q-h { font: 700 11px/1.3 var(--doc, var(--read)) !important; color: var(--p-dim); letter-spacing: .05em; }
.tr-r1 { font-size: 14px; padding: 8px 10px; background: #F3F2F7; color: var(--p-dim); }
.tr-r1.seen { background: #FFF6CC; color: #5A4500; }
.tr-sec { display: flex; flex-direction: column; gap: 6px; padding-top: 10px; border-top: 1px solid var(--p-line); }
.tr-sec > b { font: 700 11px/1.3 var(--doc, var(--read)); letter-spacing: .06em; color: #0B7F7B; }
.tr-sec .src-chip { background: #F3F2F7; color: var(--p-ink); box-shadow: inset 0 0 0 1px var(--p-line); }
.tr-sec .src-chip:hover { box-shadow: inset 0 0 0 2px #1FB5B0; }
.tr-sec .sc-sys { color: #0B7F7B; }
.tr-do { font-weight: 700; }
.pop.trace .coach-inline { margin-bottom: 4px; }

/* executive documents */
.docp.memo { max-width: 820px; gap: 10px; }
.memo-ask { padding: 10px 14px; font-family: var(--doc); background: var(--p-soft); box-shadow: inset 3px 0 0 var(--a-yellow); font-size: 15px; }
.memo-p { font-size: 16px; line-height: 1.6; }
.dtable td.pos { color: #1B7A3A; }
.dtable td.neg { color: #C62828; }

/* calendar, annotated */
.cev.k-wake { background: #DFF8F7; color: #0B4A48; box-shadow: inset 3px 0 0 #1FB5B0; outline: 1px dashed #1FB5B0; outline-offset: -3px; }
.cev.wk::after, .wk-ev.wk::after { content: ''; position: absolute; top: 5px; right: 5px; width: 8px; height: 8px; background: #1FB5B0; }
.cev.wk, .wk-ev.wk { position: relative; }
.round2 .cal-day .cev { position: absolute; }

/* team */
.tcard.has { box-shadow: inset 0 0 0 2px var(--a-cyan); }
.tcard small.asg { color: var(--a-cyan); }
.fnum.cy { background: var(--a-cyan) !important; }

@media (max-width: 760px) {
  .cstats { grid-template-columns: minmax(0, 1fr); }
  .ins { grid-template-columns: 30px minmax(0, 1fr); padding: 12px; gap: 10px; }
  .ins .btn.pick { grid-column: 1 / -1; justify-self: stretch; }
  .ins-rank { font-size: 18px; }
  .ins h3 { font-size: 18px; }
  .src-chip { max-width: 100%; }
}

.round2 .when .clock { color: var(--a-cyan); }
.pop.trace .pp-people { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px 12px; }

/* THE FINALE
   The meeting twice, the result, the week as a two-player match, the final score.
   Every class here starts with fx- or fs- so nothing leaks into the arcade front end.
   Yellow is Player 1, on your own. Cyan is Player 2, with Wake. Pink is a follow-up owed. */

.fx-meet, .fx-result, .fx-week, .fx-final { max-width: 1280px; padding-block: 52px 32px; gap: 14px; }
.fx-h { font: 600 clamp(26px, 3.4vw, 38px)/1.15 var(--disp) !important; color: var(--a-ink) !important; text-transform: none !important; text-align: center; }
.fx-h2 { font: 600 clamp(19px, 2.2vw, 24px)/1.2 var(--disp) !important; color: var(--a-ink) !important; text-transform: none !important; }

/* ---------------------------------------------------------------- the meeting */
.fx-meet .when .fx-clock { font: 400 34px/1 var(--term); color: var(--acc); min-width: 4.6em; letter-spacing: 0; }
.fx-meet .when .fx-el { font: 400 10px/1 var(--px); color: var(--a-dim); }
.fx-hud { display: grid; grid-template-columns: minmax(0, 1.4fr) repeat(3, minmax(0, 1fr)); gap: 8px; }
.fx-hud > * { background: var(--a-panel); box-shadow: inset 0 0 0 2px var(--a-line); padding: 10px 12px; display: flex; align-items: center; gap: 10px; min-width: 0; }
.fx-agenda > span { font: 400 8px/1 var(--px); color: var(--a-dim); letter-spacing: .06em; }
.fx-pips { display: flex; gap: 6px; flex-wrap: wrap; }
.fx-pips i { width: 26px; height: 26px; display: grid; place-items: center; font: 400 9px/1 var(--px); font-style: normal; color: var(--a-dim); box-shadow: inset 0 0 0 2px var(--a-line); }
.fx-pips i.on { color: var(--a-bg); background: var(--acc); box-shadow: none; animation: fxpulse 1s steps(2) infinite; }
.fx-pips i.done { color: var(--a-ink); background: var(--a-line); box-shadow: none; }
.fx-cnt b { font: 400 34px/1 var(--term); min-width: 1.2em; }
.fx-cnt span { font: 400 8px/1.5 var(--px); color: var(--a-dim); letter-spacing: .04em; }
.fx-cnt.ans b { color: var(--acc); }
.fx-cnt.owed b { color: var(--a-pink); }
.fx-cnt.dec b { color: #5BD66B; }
.fx-cnt.bump { animation: fxbump .45s steps(3); }
@keyframes fxbump { 40% { transform: translateY(-4px) scale(1.04); } }
@keyframes fxpulse { 50% { opacity: .55; } }

.fx-mgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 14px; align-items: start; }
.fx-roomcol { display: flex; flex-direction: column; gap: 12px; position: sticky; top: 12px; }
.fx-table { display: flex; flex-direction: column; gap: 8px; padding: 16px 14px; background: repeating-conic-gradient(#3E3466 0% 25%, #463A73 0% 50%) 0 0 / 24px 24px; box-shadow: inset 0 0 0 3px var(--a-line); }
.fx-row { display: flex; justify-content: space-around; gap: 4px; }
.fx-board { height: 54px; background: #8B5A2B; box-shadow: inset 0 6px 0 #A86E37, inset 0 -5px 0 #6E4520, 0 5px 0 rgba(0, 0, 0, .35); display: flex; align-items: center; padding-left: 8px; }
.fx-seat { display: flex; flex-direction: column; align-items: center; gap: 4px; font: 400 7px/1 var(--px); color: var(--a-ink); transition: transform .15s steps(2); position: relative; min-width: 0; }
.fx-seat .avwrap { box-shadow: 0 0 0 2px #1B1733; }
.fx-seat span { max-width: 9ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-shadow: 1px 1px 0 #000; }
.fx-head .fx-seat span { color: var(--a-yellow); }
.fx-seat.talk { transform: translateY(-5px); }
.fx-seat.out { opacity: .25; filter: grayscale(1); }
.fx-seat.talk .avwrap { box-shadow: 0 0 0 3px var(--acc), 0 0 14px var(--acc); }
.fx-seat.talk::before { content: '▼'; position: absolute; top: -14px; font: 400 9px/1 var(--px); color: var(--acc); animation: fxpulse .6s steps(2) infinite; }
.fx-screen { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 8px; min-height: 170px; }
.fx-screen.you { background: #FFF5CF; color: #2A2410; box-shadow: 6px 6px 0 rgba(0, 0, 0, .35); }
.fx-screen.wake { background: #0E1D2A; box-shadow: inset 0 0 0 3px var(--a-cyan), 0 0 22px rgba(57, 229, 224, .18); position: relative; overflow: hidden; }
.fx-screen.wake::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(57, 229, 224, .05) 0 2px, transparent 2px 4px); }
.fx-scr-k { font: 400 9px/1 var(--px); letter-spacing: .08em; }
.fx-screen.you .fx-scr-k { color: #8A6A00; }
.fx-screen.wake .fx-scr-k { color: var(--a-cyan); }
.fx-scr-body { display: flex; flex-direction: column; gap: 8px; animation: boot .3s steps(3) both; }
.fx-scr-n { font: 400 8px/1.4 var(--px); opacity: .7; }
.fx-scr-t { font: 600 21px/1.25 var(--disp); }
.fx-scr-s { font-size: 16px; line-height: 1.45; }
.fx-screen.you .fx-scr-s { font-style: italic; }
.fx-scr-meta { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; opacity: .8; }
.fx-scr-src { font: 400 8px/1.4 var(--px); color: var(--a-cyan); }

.fx-talk { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.fx-log { display: flex; flex-direction: column; gap: 8px; max-height: max(260px, calc(100vh - 420px)); overflow-y: auto; padding: 4px 6px 4px 2px; scrollbar-width: thin; }
.fx-line { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; align-items: start; padding: 10px 12px; background: var(--a-panel); box-shadow: inset 3px 0 0 var(--a-line); animation: boot .25s steps(3) both; }
.fx-line b { display: block; font: 400 8px/1.4 var(--px); color: var(--a-dim); letter-spacing: .04em; margin-bottom: 4px; }
.fx-line p { font-size: 16px; line-height: 1.45; }
.fx-line.me { box-shadow: inset 3px 0 0 var(--a-yellow); }
.fx-line.me b { color: var(--a-yellow); }
.fx-line.pres p { font-style: italic; }
.fx-meet.wake .fx-line.pres p { font-style: normal; font-weight: 600; }
.fx-line.q { box-shadow: inset 3px 0 0 var(--a-pink); }
.fx-line.q b { color: var(--a-pink); }
.fx-line.ok { box-shadow: inset 3px 0 0 #5BD66B; }
.fx-line.wake { background: #0E1D2A; box-shadow: inset 0 0 0 2px var(--a-cyan); }
.fx-line.wake b { color: var(--a-cyan); }
.fx-wk { width: 28px; height: 28px; display: grid; place-items: center; background: var(--a-cyan); color: var(--a-bg); font: 400 11px/1 var(--px); }
.fx-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.fx-chips span { font-size: 12.5px; padding: 4px 7px; background: #13283A; box-shadow: inset 0 0 0 1px #24506A; }
.fx-chips span b { display: inline; font: 400 7px/1 var(--px); color: var(--a-cyan); margin: 0 4px 0 0; }
.fx-hint { font-size: 14px; color: var(--a-dim); padding: 0 4px; }
.fx-iou { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: #2A1020; box-shadow: inset 0 0 0 2px var(--a-pink); animation: boot .3s steps(3) both; }
.fx-iou b { font: 400 8px/1 var(--px); color: var(--a-pink); white-space: nowrap; }
.fx-iou span { font-size: 14.5px; }
.fx-stamp { align-self: center; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 18px; margin: 4px 0 6px; transform: rotate(-2deg); animation: fxstampin .35s steps(4) both; text-align: center; }
.fx-stamp b { font: 400 12px/1 var(--px); letter-spacing: .06em; }
.fx-stamp span { font-size: 13.5px; color: var(--a-ink); }
.fx-stamp.s-decided { box-shadow: inset 0 0 0 3px #5BD66B; color: #5BD66B; }
.fx-stamp.s-agreed { box-shadow: inset 0 0 0 3px #5BD66B, 4px 4px 0 var(--a-pink); color: #5BD66B; }
.fx-stamp.s-guess { box-shadow: inset 0 0 0 3px var(--a-yellow); color: var(--a-yellow); }
.fx-stamp.s-parked, .fx-stamp.s-next { box-shadow: inset 0 0 0 3px var(--a-pink); color: var(--a-pink); }
.fx-stamp.s-dropped, .fx-stamp.s-busy { box-shadow: inset 0 0 0 3px var(--a-dim); color: var(--a-dim); }
@keyframes fxstampin { 0% { transform: rotate(-2deg) scale(1.6); opacity: 0; } 100% { transform: rotate(-2deg) scale(1); opacity: 1; } }

.fx-choices { display: flex; flex-direction: column; gap: 8px; }
.fx-ask { font: 400 8px/1 var(--px); color: var(--a-yellow); letter-spacing: .06em; padding: 4px 2px 0; }
.fx-opt { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 12px; align-items: center; text-align: left; padding: 12px 14px; border: 0; background: var(--a-panel2); color: var(--a-ink); box-shadow: inset 0 0 0 3px var(--a-line); transition: transform .1s steps(2); }
.fx-opt i { width: 30px; height: 30px; display: grid; place-items: center; font: 400 11px/1 var(--px); font-style: normal; background: var(--a-line); color: var(--a-ink); }
.fx-opt span { font-size: 16.5px; line-height: 1.35; }
.fx-opt em { font: 400 7px/1.4 var(--px); font-style: normal; color: var(--a-dim); text-transform: uppercase; text-align: right; max-width: 12ch; }
.fx-opt:hover, .fx-opt:focus-visible { box-shadow: inset 0 0 0 3px var(--a-yellow), 4px 4px 0 var(--a-pink); transform: translate(-2px, -2px); outline: none; }
.fx-opt:hover i, .fx-opt:focus-visible i { background: var(--a-yellow); color: var(--a-bg); }
.fx-opt.ev em { color: var(--a-yellow); }
.fx-ctl { display: flex; gap: 8px; flex-wrap: wrap; }
.fx-done { display: flex; flex-direction: column; gap: 12px; padding: 18px; background: var(--a-panel); box-shadow: inset 0 0 0 3px var(--a-yellow), 6px 6px 0 var(--a-pink); animation: boot .3s steps(3) both; }
.fx-done-k { font: 400 10px/1 var(--px); color: var(--a-yellow); letter-spacing: .06em; }
.fx-done-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.fx-done-row div { display: flex; flex-direction: column; gap: 4px; padding: 10px; background: var(--a-bg); }
.fx-done-row b { font: 400 34px/1 var(--term); color: var(--a-yellow); }
.fx-done-row span { font: 400 7px/1.5 var(--px); color: var(--a-dim); }
.fx-done .btn { align-self: flex-start; }

/* ---------------------------------------------------------------- the result */
.fx-tls { display: flex; flex-direction: column; gap: 8px; padding: 18px 20px; background: var(--a-panel); box-shadow: inset 0 0 0 3px var(--a-line); }
.fx-tlrow { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 14px; align-items: center; }
.fx-tlk { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font: 400 9px/1 var(--px); white-space: nowrap; }
.fx-tlk b { font: 400 30px/1 var(--term); color: var(--a-ink); }
.fx-tlk.y { color: var(--a-yellow); }
.fx-tlk.w { color: var(--a-cyan); }
.fx-tl { display: flex; gap: 3px; height: 34px; }
.fx-tl .seg { display: grid; place-items: center; height: 100%; min-width: 3px; background: var(--a-line); font: 400 9px/1 var(--px); font-style: normal; color: var(--a-bg); overflow: hidden; animation: fxgrow .6s steps(6) both; transform-origin: left; }
.fx-tl .seg.decided, .fx-tl .seg.pilot { background: #5BD66B; }
.fx-tl .seg.pilot { opacity: .7; }
.fx-tl .seg.guess { background: repeating-linear-gradient(45deg, #5BD66B 0 5px, #2E6A35 5px 10px); }
.fx-tl .seg.agreed { background: repeating-linear-gradient(45deg, #5BD66B 0 5px, #2A1020 5px 10px); box-shadow: inset 0 0 0 3px var(--a-pink); }
.fx-tl .seg.parked, .fx-tl .seg.next { background: #2A1020; box-shadow: inset 0 0 0 3px var(--a-pink); color: var(--a-pink); }
.fx-tl .seg.dropped, .fx-tl .seg.busy { background: #4A437A; color: var(--a-ink); }
.fx-tl.w .seg { animation-delay: .5s; }
@keyframes fxgrow { from { transform: scaleX(0); } }
.fx-axis { position: relative; height: 16px; }
.fx-axis span { position: absolute; transform: translateX(-50%); font: 400 13px/1 var(--read); color: var(--a-dim); }
.fx-legend, .fx-legend2 { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13.5px; color: var(--a-dim); margin-left: 234px; }
.fx-legend i { display: inline-block; width: 13px; height: 13px; margin-right: 6px; vertical-align: -2px; }
.fx-legend .decided i { background: #5BD66B; }
.fx-legend .guess i { background: repeating-linear-gradient(45deg, #5BD66B 0 3px, #2E6A35 3px 6px); }
.fx-legend .parked i { box-shadow: inset 0 0 0 2px var(--a-pink); }
.fx-legend .agreed i { background: repeating-linear-gradient(45deg, #5BD66B 0 3px, #2A1020 3px 6px); box-shadow: inset 0 0 0 2px var(--a-pink); }
.fx-legend .dropped i { background: #4A437A; }
.fx-duels { display: flex; flex-direction: column; gap: 6px; }
.fx-duel { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr) minmax(0, 1fr); gap: 8px; }
.fx-duel > * { background: var(--a-panel); padding: 12px 16px; display: flex; align-items: center; }
.fx-duel > span { justify-content: center; text-align: center; font-size: 15.5px; color: var(--a-ink); flex-direction: column; gap: 3px; }
.fx-duel > span small { font-size: 12.5px; color: var(--a-dim); }
.fx-duel > b { font: 400 34px/1 var(--term); }
.fx-duel .y { color: var(--a-yellow); }
.fx-duel .w { color: var(--a-cyan); justify-content: flex-end; }
.fx-duel .y.win { box-shadow: inset 0 0 0 3px var(--a-yellow); }
.fx-duel .w.win { box-shadow: inset 0 0 0 3px var(--a-cyan); background: #11283A; }
.fx-duel.head > * { background: transparent; padding: 0 4px; }
.fx-duel.head b { font: 400 9px/1 var(--px); }
.fx-after { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
.fx-acol { padding: 18px; background: var(--a-panel); display: flex; flex-direction: column; gap: 10px; }
.fx-acol.y { box-shadow: inset 0 0 0 3px var(--a-yellow); }
.fx-acol.w { box-shadow: inset 0 0 0 3px var(--a-cyan); }
.fx-acol h2 { font: 600 22px/1.2 var(--disp) !important; text-transform: none !important; }
.fx-acol.y h2 { color: var(--a-yellow) !important; }
.fx-acol.w h2 { color: var(--a-cyan) !important; }
.fx-asub { font-size: 14.5px; color: var(--a-dim); }
.fx-tasks, .fx-done-list { display: flex; flex-direction: column; gap: 6px; }
.fx-tasks li { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; background: var(--a-bg); animation: boot .3s steps(3) both; }
.fx-tasks b, .fx-done-list b { font: 400 7px/1.4 var(--px); color: var(--a-dim); display: block; }
.fx-tasks p, .fx-done-list p { font-size: 14.5px; line-height: 1.35; }
.fx-tasks em { font: 400 22px/1 var(--term); font-style: normal; color: var(--a-pink); white-space: nowrap; }
.fx-done-list li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; align-items: center; padding: 8px 10px; background: #0E1D2A; }
.fx-done-list i { width: 26px; height: 26px; display: grid; place-items: center; font-style: normal; background: var(--a-cyan); color: var(--a-bg); font-weight: 700; }

/* ---------------------------------------------------------------- the week */
.fx-whud { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 10px; align-items: stretch; }
.fx-whud .p { display: flex; flex-direction: column; gap: 6px; padding: 12px 16px; background: var(--a-panel); }
.fx-whud .p > span { font: 400 9px/1.3 var(--px); letter-spacing: .04em; }
.fx-whud .p small { font: 400 7px/1 var(--px); color: var(--a-dim); }
.fx-whud .p.y { box-shadow: inset 0 -4px 0 var(--a-yellow); color: var(--a-yellow); }
.fx-whud .p.w { box-shadow: inset 0 -4px 0 var(--a-cyan); color: var(--a-cyan); align-items: flex-end; text-align: right; }
.fx-rec { font: 400 8px/1.4 var(--px) !important; color: #5BD66B !important; min-height: 11px; }
.fx-big { font: 400 clamp(40px, 5vw, 58px)/.9 var(--term); color: var(--a-ink); }
.fx-whud .mid { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 8px 12px; }
.fx-whud .mid p { font: 400 9px/1 var(--px); color: var(--a-dim); letter-spacing: .08em; }
.fx-days { display: flex; gap: 4px; }
.fx-days span { font: 400 9px/1 var(--px); padding: 8px 7px 7px; color: var(--a-dim); box-shadow: inset 0 0 0 2px var(--a-line); }
.fx-days span.past { color: var(--a-ink); background: var(--a-line); box-shadow: none; }
.fx-days span.on { color: var(--a-bg); background: var(--a-ink); box-shadow: none; animation: fxpulse 1s steps(2) infinite; }
.fx-tug { --p: 50%; position: relative; height: 12px; display: flex; box-shadow: 0 0 0 2px var(--a-line); }
.fx-tug .ty { width: var(--p); background: var(--a-yellow); transition: width .8s steps(10); }
.fx-tug .tw { flex: 1; background: var(--a-cyan); }
.fx-tug .mk { position: absolute; left: var(--p); top: -6px; width: 6px; height: 24px; margin-left: -3px; background: var(--a-ink); box-shadow: 0 0 0 2px var(--a-bg); transition: left .8s steps(10); }
.fx-tug-l { text-align: center; font: 400 8px/1 var(--px); color: var(--a-dim); letter-spacing: .06em; margin-top: -4px; }
.fx-tug-l.w { color: var(--a-cyan); }
.fx-tug-l.y { color: var(--a-yellow); }
.fx-maps { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
.fx-side { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.fx-map { position: relative; aspect-ratio: 10 / 4.8; background: #15122B; overflow: hidden; }
.fx-map.y { box-shadow: 0 0 0 3px var(--a-yellow); }
.fx-map.w { box-shadow: 0 0 0 3px var(--a-cyan); }
.fx-map-art, .fx-map-art svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.fx-pin { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 3px; }
.fx-pin .dot { width: 10px; height: 10px; background: #4A437A; box-shadow: 0 0 0 2px var(--a-bg); }
.fx-pin.has .dot { background: var(--a-ink); }
.fx-pin.hq .dot { background: var(--a-violet); width: 12px; height: 12px; }
.fx-pin .nm { font: 400 6.5px/1.2 var(--px); color: var(--a-ink); background: rgba(7, 6, 15, .78); padding: 3px 4px; white-space: nowrap; }
.fx-pin:not(.has) .nm { color: var(--a-dim); }
.fx-stack { display: flex; gap: 2px; order: -1; position: relative; }
.fx-bdg { width: 22px; height: 22px; display: inline-grid; place-items: center; font: 400 10px/1 var(--px); font-style: normal; color: var(--a-bg); box-shadow: 0 0 0 2px var(--a-bg); transition: background .2s steps(2); }
.fx-bdg.open { background: #77748A; }
.fx-bdg.waiting { background: #C9A0FF; }
.fx-bdg.working { background: var(--a-yellow); }
.fx-bdg.fixed { background: #5BD66B; }
.fx-bdg.worse { background: var(--a-pink); color: var(--a-ink); animation: fxpulse .7s steps(2) infinite; }
.fx-pop { position: absolute; left: 50%; bottom: 100%; transform: translateX(-50%); font: 400 18px/1 var(--term); white-space: nowrap; pointer-events: none; animation: fxrise 1.4s steps(10) both; text-shadow: 1px 1px 0 #000; }
.fx-pop.y { color: var(--a-yellow); }
.fx-pop.w { color: var(--a-cyan); }
@keyframes fxrise { from { opacity: 1; transform: translate(-50%, 0); } to { opacity: 0; transform: translate(-50%, -26px); } }
.fx-wlog { display: flex; flex-direction: column; gap: 4px; min-height: 96px; padding: 10px 12px; background: var(--a-panel); font-size: 14px; line-height: 1.4; }
.fx-wlog li { padding-left: 14px; position: relative; animation: boot .3s steps(3) both; }
.fx-wlog li::before { content: '■'; position: absolute; left: 0; top: 1px; font-size: 9px; color: var(--a-dim); }
.fx-wlog li.dk { padding: 0 0 4px; font: 400 8px/1 var(--px); color: var(--a-dim); }
.fx-wlog li.dk::before { content: none; }
.fx-wlog li.good::before { color: #5BD66B; }
.fx-wlog li.bad::before { color: var(--a-pink); }
.fx-wlog li.act::before { color: var(--a-yellow); }
.fx-side.w .fx-wlog li.act::before { color: var(--a-cyan); }
.fx-wlog li.wait::before { color: #C9A0FF; }
.fx-legend2 { margin: 0; justify-content: center; text-transform: capitalize; }
.fx-legend2 .fx-bdg { width: 16px; height: 16px; font-size: 8px; margin-right: 6px; vertical-align: -1px; box-shadow: none; animation: none; }
.fx-score { display: flex; flex-direction: column; gap: 5px; padding: 16px 18px; background: var(--a-panel); box-shadow: inset 0 0 0 3px var(--a-line); }
.fx-bf { display: grid; grid-template-columns: minmax(0, 1fr) minmax(150px, .7fr) minmax(0, 1fr); gap: 12px; align-items: center; }
.fx-bf > p { text-align: center; font-size: 14.5px; color: var(--a-dim); line-height: 1.25; }
.fx-bf .l, .fx-bf .r { display: flex; align-items: center; gap: 10px; min-width: 0; }
.fx-bf .l { flex-direction: row-reverse; }
.fx-bf .v { font: 400 26px/1 var(--term); white-space: nowrap; color: var(--a-dim); min-width: 4.4em; }
.fx-bf .l .v { text-align: right; }
.fx-bf .bar { flex: 1; height: 14px; background: var(--a-bg); display: flex; }
.fx-bf .l .bar { justify-content: flex-end; }
.fx-bf .bar i { display: block; height: 100%; width: 0; transition: width .7s steps(8); opacity: .45; }
.fx-bf .l .bar i { background: var(--a-yellow); }
.fx-bf .r .bar i { background: var(--a-cyan); }
.fx-bf.yw .l .v { color: var(--a-yellow); }
.fx-bf.ww .r .v { color: var(--a-cyan); }
.fx-bf.yw .l .bar i, .fx-bf.ww .r .bar i { opacity: 1; }
.fx-bf.head { margin-bottom: 4px; }
.fx-bf.head b { font: 400 9px/1 var(--px); }
.fx-bf.head .y { color: var(--a-yellow); text-align: right; }
.fx-bf.head .w { color: var(--a-cyan); }
.fx-bf.head p { font: 400 9px/1 var(--px); color: var(--a-ink); letter-spacing: .08em; }
.fx-probs { display: flex; flex-direction: column; gap: 6px; }
.fx-probs .fx-h2 { margin-bottom: 4px; }
.fx-pr { display: grid; grid-template-columns: minmax(0, 1fr) minmax(150px, .7fr) minmax(0, 1fr); gap: 8px; }
.fx-pl { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 3px; padding: 6px; }
.fx-pl b { font: 600 15.5px/1.25 var(--disp); }
.fx-pl span { font-size: 12.5px; color: var(--a-dim); }
.fx-pc { display: grid; grid-template-columns: auto auto minmax(0, 1fr) 76px; gap: 10px; align-items: center; padding: 10px 12px; background: var(--a-panel); min-width: 0; }
.fx-pc.y { box-shadow: inset 3px 0 0 var(--a-yellow); }
.fx-pc.w { box-shadow: inset -3px 0 0 var(--a-cyan); }
.fx-pc.flip { animation: fxflip .3s steps(3); }
@keyframes fxflip { 50% { transform: scaleY(.85); } }
.fx-pc .st { font: 400 7px/1 var(--px); padding: 5px 6px 4px; white-space: nowrap; box-shadow: inset 0 0 0 2px currentColor; }
.fx-pc .st.open { color: #9A97B4; }
.fx-pc .st.waiting { color: #C9A0FF; }
.fx-pc .st.working { color: var(--a-yellow); }
.fx-pc .st.fixed { color: #5BD66B; }
.fx-pc .st.worse { color: var(--a-pink); }
.fx-pc .mv { font: 400 26px/1 var(--term); white-space: nowrap; }
.fx-pc .pm { font: 400 19px/1 var(--term); color: var(--a-dim); text-align: right; white-space: nowrap; }
.fx-pc .pm.pos { color: #5BD66B; }
.fx-pc .pm small { display: block; font: 400 7px/1.6 var(--px); color: var(--a-cyan); }
.fx-pc .pm.neg { color: var(--a-pink); }
.fx-spark { display: block; width: 76px; height: 26px; }
.fx-spark svg { width: 100%; height: 100%; display: block; }
.fx-pc.y .fx-spark { color: var(--a-yellow); }
.fx-pc.w .fx-spark { color: var(--a-cyan); }
.fx-small { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
.fx-small > p { font: 400 8px/1 var(--px); color: var(--a-dim); padding: 6px 0; text-align: center; }
.fx-sm { display: grid; grid-template-columns: minmax(0, 1fr) minmax(150px, .7fr) minmax(0, 1fr); gap: 8px; font-size: 13.5px; }
.fx-sm > * { padding: 8px 12px; background: var(--a-panel); }
.fx-sm b { font-weight: 500; text-align: center; color: var(--a-dim); background: transparent; }
.fx-sm .w { color: var(--a-cyan); text-align: right; }
.fx-banner { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 22px; text-align: center; background: var(--a-panel); box-shadow: inset 0 0 0 3px var(--a-cyan), 6px 6px 0 var(--a-pink); animation: boot .35s steps(4) both; }
.fx-banner .k { font: 400 10px/1 var(--px); color: var(--a-cyan); letter-spacing: .08em; }
.fx-banner h2 { font: 600 clamp(19px, 2.4vw, 26px)/1.3 var(--disp) !important; text-transform: none !important; color: var(--a-ink) !important; }
.fx-banner p { color: var(--a-dim); font-size: 16px; }
.fx-note { font-size: 13px; color: var(--a-dim); text-align: center; max-width: 60em; margin: 0 auto; }
.fx-wctl { justify-content: center; }

/* ---------------------------------------------------------------- the final score */
.fx-final { max-width: 1000px; align-items: stretch; }
.fs-k { text-align: center; font: 400 10px/1 var(--px); color: var(--a-pink); letter-spacing: .1em; animation: fxpulse 1s steps(2) infinite; }
.fs-title { font: 400 clamp(30px, 6vw, 56px)/1 var(--px) !important; color: var(--a-yellow) !important; text-shadow: 4px 4px 0 var(--a-pink); text-align: center; }
.fs-sub { text-align: center; font: 500 17px/1.4 var(--disp); color: var(--a-dim); }
.fs-head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr) minmax(0, 1fr); gap: 8px; margin-top: 8px; }
.fs-head span { display: flex; flex-direction: column; gap: 6px; font: 400 9px/1 var(--px); padding: 12px; background: var(--a-panel); }
.fs-head span:nth-child(2) { background: transparent; }
.fs-head span b { font: 400 13px/1.3 var(--px); }
.fs-head .y { color: var(--a-yellow); box-shadow: inset 0 -3px 0 var(--a-yellow); }
.fs-head .w { color: var(--a-cyan); box-shadow: inset 0 -3px 0 var(--a-cyan); text-align: right; align-items: flex-end; }
.fs-rows { display: flex; flex-direction: column; gap: 6px; }
.fs-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr) minmax(0, 1fr); gap: 8px; animation: boot .3s steps(4) both; }
.fs-row > div { display: flex; align-items: center; gap: 10px; padding: 11px 14px; background: var(--a-panel); min-width: 0; }
.fs-y b, .fs-w b { font: 400 clamp(22px, 3.2vw, 32px)/1 var(--term); }
.fs-y b { color: var(--a-yellow); }
.fs-w { justify-content: flex-end; }
.fs-w b { color: var(--a-cyan); }
.fs-l { justify-content: center; text-align: center; font: 500 15.5px/1.3 var(--disp); color: var(--a-dim); }
.fs-row.ww .fs-w { box-shadow: inset 0 0 0 3px var(--a-cyan); background: #11283A; }
.fs-row.yw .fs-y { box-shadow: inset 0 0 0 3px var(--a-yellow); background: #2A2410; }
.fs-row .star { font-style: normal; font-size: 20px; }
.fs-y .star { color: var(--a-yellow); }
.fs-w .star { color: var(--a-cyan); }
.fs-verdict { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 24px; text-align: center; background: var(--a-panel); box-shadow: inset 0 0 0 3px var(--a-cyan), 6px 6px 0 var(--a-pink); animation: boot .35s steps(4) both; }
.fs-wins { display: flex; align-items: center; gap: 22px; }
.fs-wins b { font: 400 clamp(16px, 3vw, 28px)/1.2 var(--px); color: var(--a-cyan); text-shadow: 3px 3px 0 var(--a-pink); }
.fs-wins span { font: 400 clamp(46px, 7vw, 72px)/1 var(--term); }
.fs-wins .y { color: var(--a-yellow); }
.fs-wins .w { color: var(--a-cyan); }
.fs-v { font: 600 20px/1.35 var(--disp); color: var(--a-ink); }
.fs-rest { display: flex; flex-direction: column; gap: 20px; }
.fs-q { display: flex; flex-direction: column; gap: 12px; }
.fs-q h2 { font: 600 clamp(19px, 2.2vw, 24px)/1.2 var(--disp) !important; text-transform: none !important; color: var(--a-ink) !important; text-align: center; }
.fs-qrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.fs-qrow div { display: flex; flex-direction: column; gap: 8px; padding: 16px; background: #0E1D2A; box-shadow: inset 0 0 0 3px var(--a-cyan); }
.fs-qrow b { font: 400 clamp(36px, 4.6vw, 50px)/1 var(--term); color: var(--a-cyan); }
.fs-qrow span { font-size: 14.5px; color: var(--a-dim); line-height: 1.35; }
.fs-qrow em { font-style: normal; font: 400 20px/1.1 var(--term); color: var(--a-yellow); margin-top: auto; padding-top: 6px; box-shadow: 0 -2px 0 #1E3A4E; }
.fs-credit { font-size: 16px; line-height: 1.5; color: var(--a-dim); max-width: 46em; }
.moment2 { display: flex; flex-direction: column; gap: 12px; }
.moment2 .fx-h2 { text-align: center; }
.mo-grid { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 14px; align-items: stretch; }
.mo-arrow { align-self: center; font: 400 20px/1 var(--px); color: var(--a-cyan); }
.mo-card { display: flex; flex-direction: column; gap: 10px; padding: 18px; min-width: 0; }
.mo-card.saw { background: #fff; color: var(--p-ink); box-shadow: inset 0 0 0 3px var(--a-yellow); align-self: start; }
.mo-card.meant { background: var(--a-panel); box-shadow: inset 0 0 0 3px var(--a-cyan); }
.mo-k { font: 400 9px/1.4 var(--px); letter-spacing: .06em; }
.mo-card.saw .mo-k { color: #8A6A00; }
.mo-card.meant .mo-k { color: var(--a-cyan); }
.mo-src { font-size: 13px; color: var(--p-dim); }
.mo-card h3 { font: 600 20px/1.3 var(--disp); }
.mo-cap { font-size: 15px; font-weight: 600; }
.mo-card.saw .mo-cap { color: #8A6A00; }
.mo-cap.w { color: var(--a-cyan); }
.mo-stake { font: 400 22px/1 var(--term); color: var(--a-cyan); }
.mo-card .src-chip { max-width: 100%; }
.mo-card.saw .dtable { font-size: 13px; }
.fx-final .closer { text-transform: none; font: 500 17px/1.5 var(--disp); color: var(--a-ink); text-align: center; max-width: 46em; margin: 0 auto; }
.fs-actions { justify-content: center; }
.report-wrap { margin-top: 6px; }
.report-paper { box-shadow: 8px 8px 0 rgba(0, 0, 0, .45); }
.wx.arcade:has(.report-wrap:not([hidden]))::after, .wx.arcade:has(.fx-week)::after { opacity: 0; }

/* ---------------------------------------------------------------- narrow screens */
@media (max-width: 900px) {
  .fx-mgrid { grid-template-columns: minmax(0, 1fr); }
  .fx-roomcol { position: static; }
  .fx-log { max-height: none; overflow: visible; }
  .fx-hud { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .fx-agenda { grid-column: 1 / -1; }
  .fx-after { grid-template-columns: minmax(0, 1fr); }
  .fx-legend, .fx-legend2 { margin-left: 0; }
}
@media (max-width: 640px) {
  .fx-meet, .fx-result, .fx-week, .fx-final { padding-block: 46px 24px; gap: 12px; }
  .fx-seat .avwrap svg { width: 24px; height: 24px; }
  .fx-seat span { font-size: 6px; }
  .fx-table { padding: 10px 6px; }
  .fx-board { height: 44px; }
  .fx-screen { min-height: 0; padding: 12px 14px; }
  .fx-scr-t { font-size: 18px; }
  .fx-cnt { flex-direction: column; align-items: flex-start !important; gap: 4px !important; }
  .fx-cnt b { font-size: 28px; }
  .fx-line p, .fx-opt span { font-size: 15px; }
  .fx-opt { grid-template-columns: 26px minmax(0, 1fr); }
  .fx-opt em { grid-column: 2; text-align: left; max-width: none; }
  .fx-done-row b { font-size: 26px; }
  .fx-tlrow { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .fx-tlrow > span:empty { display: none; }
  .fx-duel { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .fx-duel > span { grid-column: 1 / -1; grid-row: 1; padding: 6px 4px 0; background: transparent; }
  .fx-duel.head > span { display: none; }
  .fx-duel > b { font-size: 28px; }
  .fx-whud { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .fx-whud .mid { grid-column: 1 / -1; grid-row: 1; padding: 0; }
  .fx-whud .p > span { font-size: 7px; }
  .fx-big { font-size: 36px; }
  .fx-maps { gap: 8px; }
  .fx-pin .nm { display: none; }
  .fx-bdg { width: 15px; height: 15px; font-size: 7px; }
  .fx-wlog { font-size: 12.5px; padding: 8px; min-height: 120px; }
  .fx-bf { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 4px 8px; }
  .fx-bf > p { grid-column: 1 / -1; grid-row: 1; font-size: 13.5px; }
  .fx-bf .v { font-size: 21px; min-width: 0; }
  .fx-bf.head p { display: none; }
  .fx-pr, .fx-sm { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .fx-pl, .fx-sm b { grid-column: 1 / -1; grid-row: 1; }
  .fx-pc { grid-template-columns: minmax(0, 1fr) auto; gap: 6px; padding: 8px; }
  .fx-pc .st { grid-column: 1 / -1; justify-self: start; }
  .fx-pc .mv { font-size: 22px; }
  .fx-pc .sp { display: none; }
  .fs-head, .fs-row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .fs-head > span:nth-child(2) { display: none; }
  .fs-l { grid-column: 1 / -1; grid-row: 1; padding: 6px !important; background: transparent !important; }
  .fs-qrow, .mo-grid { grid-template-columns: minmax(0, 1fr); }
  .mo-arrow { justify-self: center; transform: rotate(90deg); }
  .fs-wins { gap: 12px; }
}
