/* NETSUITE
   A A suite-style ERP: dark navy header, a row of top tabs, a light gray page of white portlets,
   dense grids. Dense on purpose: on a Monday it's all there and none of it is explained. */

.ns { --ns-navy: #1F2A3C; --ns-tab: #2C3A52; --ns-tab-on: #F2F4F7; --ns-line: #D5DAE1; --ns-ink: #232A35; --ns-dim: #66707F; --ns-link: #1C5AA8; --ns-pt: #E9EDF2;
  height: 100%; display: flex; flex-direction: column; background: #F2F4F7; color: var(--ns-ink); font: 400 13px/1.4 var(--ui); min-height: 0; }
.ns-head { flex: none; height: 46px; display: flex; align-items: center; gap: 18px; padding: 0 14px; background: var(--ns-navy); color: #fff; }
.ns-brand { display: inline-flex; align-items: center; gap: 8px; font-size: 16px; letter-spacing: -.01em; white-space: nowrap; }
.ns-brand b { font-weight: 700; }
.os-screen .ns-mark { width: 24px; height: 24px; }
.ns-search { flex: 1; max-width: 460px; display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; border-radius: 4px; background: #33415A; color: #AEB8C8; font-size: 13px; cursor: default; }
.os-screen .ns-search .gl { width: 16px; height: 16px; color: #AEB8C8; }
.ns-hr { margin-left: auto; display: inline-flex; align-items: center; gap: 14px; }
.ns-help { font-size: 12.5px; color: #C9D1DD; }
.ns-role { display: flex; flex-direction: column; line-height: 1.15; text-align: right; }
.ns-role b { font-size: 12.5px; font-weight: 600; }
.ns-role em { font-style: normal; font-size: 11px; color: #AEB8C8; }

.ns-tabs { flex: none; display: flex; align-items: stretch; gap: 1px; padding: 0 8px; background: var(--ns-tab); overflow-x: auto; scrollbar-width: none; }
.ns-tab { position: relative; display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border: 0; background: transparent; color: #DCE3EE !important; font-size: 13px; font-weight: 500; white-space: nowrap; }
.os-screen .ns-tab .gl { width: 17px; height: 17px; color: #DCE3EE; }
.ns-tab:hover { background: #3A4A66; }
.ns-tab.on { background: var(--ns-tab-on); color: var(--ns-ink) !important; border-radius: 4px 4px 0 0; margin-top: 4px; height: 32px; font-weight: 600; }
.os-screen .ns-tab.on .gl { color: var(--ns-ink); }
.ns-tab.dead { color: #97A3B6 !important; }
.ns-tab.wk { color: #A5F3FC !important; font-weight: 600; }
.ns-tab.wk.on { color: var(--wk-ink) !important; box-shadow: inset 0 3px 0 var(--wk); }
.os-screen .ns-wk-ico { width: 16px; height: 16px; }
.ns-badge { min-width: 17px; height: 17px; padding: 0 5px; border-radius: 9px; background: #E5484D; color: #fff; font: 700 10.5px/17px var(--ui); font-style: normal; text-align: center; }
.ns-page { flex: 1; min-height: 0; overflow: auto; padding: 14px 16px 40px; }

/* portlets */
.ns-pt { background: #fff; border: 1px solid var(--ns-line); border-radius: 3px; margin: 0 0 12px; min-width: 0; }
.ns-pth { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; background: var(--ns-pt); border-bottom: 1px solid var(--ns-line); font-size: 12.5px; }
.ns-pth b { font-weight: 700; color: #34404F; text-transform: uppercase !important; letter-spacing: .03em; font-size: 11.5px; }
.ns-pts { color: var(--ns-dim); font-size: 11.5px; }
.ns-ptt { margin-left: auto; display: inline-flex; gap: 6px; }
.os-screen .ns-ptt .gl { width: 15px; height: 15px; color: #8E99A8; }
.ns-ptb { padding: 8px 10px; }

.ns-dh { display: flex; align-items: baseline; gap: 14px; margin: 0 0 12px; }
.ns-dh h1 { font-size: 20px !important; font-weight: 600 !important; }
.ns-dh p { color: var(--ns-dim); font-size: 12.5px; }
.ns-cols { display: grid; grid-template-columns: minmax(200px, 240px) minmax(0, 1fr) minmax(200px, 250px); gap: 12px; align-items: start; }
@media (max-width: 1180px) { .ns-cols { grid-template-columns: minmax(190px, 230px) minmax(0, 1fr); } .ns-cols > .ns-side:last-child { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; } .ns-cols > .ns-side:last-child .ns-pt { margin: 0; } }
/* with Wake the indicator table carries a Wake column, so the right-hand portlets move below it
   and the table gets the room it needs instead of being cut off */
.ns-cols.wk { grid-template-columns: minmax(190px, 230px) minmax(0, 1fr); }
.ns-cols.wk > .ns-side:last-child { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.ns-cols.wk > .ns-side:last-child .ns-pt { margin: 0; }
@media (max-width: 760px) { .ns-cols, .ns-cols.wk { grid-template-columns: 1fr; } }

.ns-rem li { display: flex; align-items: center; gap: 10px; padding: 4px 0; border-bottom: 1px dotted #E3E7EC; }
.ns-rem li:last-child { border: 0; }
.ns-rem b { min-width: 26px; text-align: right; color: var(--ns-link); font-weight: 700; font-variant-numeric: tabular-nums; }
.ns-rem .dead { color: var(--ns-ink); }
.ns-list li { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
.ns-list li em { margin-left: auto; font-style: normal; color: var(--ns-dim); font-size: 11.5px; white-space: nowrap; }
.ns-link { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 0; color: var(--ns-link) !important; font-size: 13px; text-align: left; }
button.ns-link:hover { text-decoration: underline; }
.os-screen .ns-link .gl { width: 15px; height: 15px; color: #7A8799; }
.ns-link.unread { font-weight: 700; }
.ns-link.dead { color: #4A6A93 !important; }
.ns-new { font-style: normal; font: 700 9.5px/1 var(--ui); padding: 3px 5px; border-radius: 3px; background: #E5484D; color: #fff; letter-spacing: .03em; }

.ns-meters { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.ns-meter { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; border: 1px solid #E3E7EC; border-radius: 3px; min-width: 0; }
.ns-meter > span { font-size: 11.5px; color: var(--ns-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ns-meter em { font-style: normal; font-size: 12px; }
.os-screen .ns .figbtn { position: relative; display: inline; width: auto; min-height: 0; border: 0; background: transparent; padding: 1px 4px; margin: -1px -4px; color: inherit; border-radius: 3px; font: inherit; font-variant-numeric: tabular-nums; }
.os-screen .ns .figbtn.big { font-size: 20px; font-weight: 600; align-self: flex-start; }
.os-screen .ns .figbtn:hover { background: #FEF7E0; box-shadow: inset 0 0 0 1px #F9AB00; }
.os-screen .ns .figbtn.is-flag, .os-screen .ns td.is-flag .figbtn { background: #FEEFC3; box-shadow: inset 0 0 0 1.5px #F9AB00; }
.os-screen .ns .figbtn .fnum { position: absolute; top: -9px; left: -10px; transform: none; width: auto; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: #E37400; color: #fff; font: 700 10px/16px var(--ui); }
.up { color: #1E7B34; }
.dn { color: #B42318; }
.ns-dim { color: var(--ns-dim); }

/* grids */
.ns-grid { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.ns-grid th { text-align: left; font-weight: 600; font-size: 11.5px; color: #4A5565; background: #F5F7FA; padding: 6px 8px; border-bottom: 1px solid var(--ns-line); white-space: nowrap; }
.ns-grid td { padding: 5px 8px; border-bottom: 1px solid #EDF0F3; vertical-align: top; }
.ns-grid tbody tr:nth-child(even) td { background: #FAFBFC; }
.ns-grid tbody tr:hover td { background: #F0F5FC; }
.ns-grid .n { text-align: right; white-space: nowrap; }
.ns-grid tr.total td, .ns-grid tr.grand td { font-weight: 700; border-top: 1px solid #B9C1CC; }
.ns-grid tr.head td { font-weight: 700; background: #F5F7FA !important; }
.ns-grid tr.indent td:first-child { padding-left: 22px; }
.ns-grid tr.unread td { font-weight: 600; }
.ns-kpi td:first-child { white-space: nowrap; }

.ns-chart { display: flex; align-items: flex-end; gap: 6px; height: 120px; padding: 6px 2px 18px; }
.ns-chart span { position: relative; flex: 1; background: #5B7DB1; border-radius: 2px 2px 0 0; }
.ns-chart span:last-child { background: #2E5A9A; }
.ns-chart em { position: absolute; bottom: -16px; left: 50%; transform: translateX(-50%); font-style: normal; font-size: 10px; color: var(--ns-dim); }
.ns-ann { font-size: 12.5px; color: var(--ns-ink); }

/* page head, filters, reports */
.ns-ph { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 16px; margin: 0 0 10px; }
/* Back is a real button, easy to spot above the page title */
.os-screen .ns-back { align-self: flex-start; display: inline-flex; align-items: center; gap: 4px; margin-bottom: 4px; padding: 7px 14px 7px 9px; border-radius: 8px; border: 1px solid #C9D3E0; background: #fff; color: #1F3A5C !important; font-size: 13.5px; font-weight: 600; box-shadow: 0 1px 2px rgba(15,23,42,.08); cursor: pointer; }
.os-screen .ns-back:hover { background: #EEF3F9; border-color: #9FB2C9; }
.os-screen .ns-back .gl { width: 18px; height: 18px; color: #1F3A5C; }
.ns-pht h1 { font-size: 20px !important; font-weight: 600 !important; }
.ns-pht p { color: var(--ns-dim); font-size: 12.5px; }
.ns-pha { margin-left: auto; display: inline-flex; gap: 6px; }
.ns-btn { display: inline-flex; align-items: center; height: 28px; padding: 0 12px; border: 1px solid #B9C1CC; border-radius: 3px; background: linear-gradient(#fff, #EEF1F5); font-size: 12.5px; font-weight: 600; color: #34404F; white-space: nowrap; }
.ns-flt { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; padding: 10px 12px; background: #fff; border: 1px solid var(--ns-line); border-radius: 3px; margin: 0 0 10px; }
.ns-fl { display: flex; flex-direction: column; gap: 3px; }
.ns-fl label { font-size: 10.5px; font-weight: 700; color: var(--ns-dim); text-transform: uppercase !important; letter-spacing: .04em; }
.ns-sel { display: inline-flex; align-items: center; justify-content: space-between; gap: 18px; height: 28px; min-width: 140px; padding: 0 6px 0 8px; border: 1px solid #B9C1CC; border-radius: 3px; background: #fff; font-size: 12.5px; }
.os-screen .ns-sel .gl { width: 15px; height: 15px; }
.ns-refresh { margin-left: auto; }
.ns-rep > .cx-crumb, .ns-rep > .cx-bar { margin: 0 0 10px; }
.ns-rep > .flag-hint { margin: 0 0 10px; }
.ns-intro { color: var(--ns-dim); font-size: 12.5px; margin: 0 0 10px; }
.ns-blocks { display: flex; flex-direction: column; gap: 12px; }
.ns-block { background: #fff; border: 1px solid var(--ns-line); border-radius: 3px; padding: 0 0 4px; }
.ns-block h3 { font-size: 12.5px !important; font-weight: 700 !important; padding: 8px 10px; background: var(--ns-pt); border-bottom: 1px solid var(--ns-line); }
.ns-bnote { font-size: 12px; color: var(--ns-dim); padding: 6px 10px 0; }
.ns-foot { margin-top: 12px; font-size: 11.5px; color: var(--ns-dim); }

.ns-rlg { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.ns-rlc { background: #fff; border: 1px solid var(--ns-line); border-radius: 3px; }
.ns-rlc h2 { font-size: 11.5px !important; font-weight: 700 !important; text-transform: uppercase !important; letter-spacing: .03em; color: #34404F; padding: 8px 10px; background: var(--ns-pt); border-bottom: 1px solid var(--ns-line); }
.ns-rlc ul { padding: 6px 10px 8px; }
.ns-rlc li { padding: 3px 0; }
.ns-rli { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
button.ns-rli { border: 0; background: none; padding: 0; color: var(--ns-link) !important; text-align: left; }
button.ns-rli:hover span { text-decoration: underline; }
.ns-rli.unread { font-weight: 700; }
.ns-rli.dead { color: #4A6A93; }
.ns-tag { font-style: normal; font-size: 10.5px; font-weight: 600; padding: 2px 6px; border-radius: 3px; background: var(--wk-soft); color: var(--wk-ink); }

.ns-sub { display: flex; flex-wrap: wrap; gap: 2px; border-bottom: 1px solid var(--ns-line); margin: 0 0 10px; }
.ns-subt { border: 1px solid transparent; border-bottom: 0; background: none; padding: 6px 12px; font-size: 12.5px; color: var(--ns-link) !important; border-radius: 3px 3px 0 0; }
.ns-subt.on { background: #fff; border-color: var(--ns-line); color: var(--ns-ink) !important; font-weight: 700; margin-bottom: -1px; }

/* file cabinet and documents */
.ns-fcb { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 12px; align-items: start; }
@media (max-width: 760px) { .ns-fcb { grid-template-columns: 1fr; } }
.ns-fct { background: #fff; border: 1px solid var(--ns-line); border-radius: 3px; padding: 6px 0; }
.ns-fct li { display: flex; align-items: center; gap: 8px; padding: 5px 10px; font-size: 12.5px; }
.os-screen .ns-fct .gl { width: 15px; height: 15px; color: #C08A1E; }
.ns-fct li.on { background: #E6EEF9; font-weight: 700; }
.ns-fcb > .ns-grid { background: #fff; border: 1px solid var(--ns-line); }
.ns-docb { display: flex; gap: 12px; align-items: flex-start; }
.ns-doc { flex: 1; max-width: 760px; background: #fff; border: 1px solid var(--ns-line); border-radius: 3px; padding: 26px 32px; font-size: 14px; line-height: 1.6; }
.ns-doc h2 { font-size: 18px !important; font-weight: 600 !important; margin: 4px 0 10px; }
.ns-doc p, .ns-doc ul { margin: 0 0 10px; }
.ns-doc ul { padding-left: 20px; list-style: disc; }
.ns-doc .doc-meta { color: var(--ns-dim); font-size: 12.5px; }
.ns-col { display: flex; flex-direction: column; min-width: 0; }
.ns-rem li span { line-height: 1.3; }

/* Round 2: Wake built in */
.ns-page.flush { padding: 0; overflow: hidden; display: flex; }
.ns-page.flush > .wkapp { flex: 1; min-height: 0; }
.ns-page.flush .wk-nav, .ns-page.flush .wk-main { overflow: auto; }
.wk-nsub { margin: 10px 8px 2px; font-size: 11px; font-weight: 600; color: #64748B; text-transform: uppercase !important; letter-spacing: .05em; }
.wk-nfoot { margin: 14px 8px 0; font-size: 12px; line-height: 1.45; color: #64748B; }
.ns-wth { white-space: nowrap; color: var(--wk-ink) !important; background: var(--wk-soft) !important; }
.ns-wth .ns-wk-ico { width: 14px; height: 14px; vertical-align: -2px; margin-right: 5px; }
.ns-grid td.ns-wcell { background: #F4FCFD !important; max-width: 300px; }
.ns-wnote { display: inline-flex; align-items: flex-start; gap: 6px; font-size: 12px; line-height: 1.35; text-align: left; border: 0; background: none; padding: 0; color: var(--ns-dim) !important; }
.ns-wnote.hit { color: var(--wk-ink) !important; }
.ns-wnote.hit b { flex: none; padding: 1px 6px; border-radius: 9px; background: var(--wk); color: #fff; font-size: 11px; }
.ns-wnote.hit:hover span { text-decoration: underline; }
.ns-wnote.ok { color: #1E6B3A !important; }
.os-screen .ns-wnote .gl { width: 14px; height: 14px; color: #1E7B34; flex: none; }
.ns-grid tr.wk-row td:first-child { box-shadow: inset 3px 0 0 var(--wk); }
.ns-wm { display: inline-flex; align-items: center; gap: 4px; margin-top: 4px; font-size: 11px; color: var(--ns-dim); }
.ns-wm.hit { color: var(--wk-ink); font-weight: 600; }
.ns-wm .ns-wk-ico { width: 13px; height: 13px; }
.os-screen .ns .figbtn.wk-fig { padding-right: 4px; }
.os-screen .ns .wk-fig:hover { background: var(--wk-soft); box-shadow: inset 0 0 0 1px var(--wk); }
.wnum { font-style: normal; display: inline-block; margin-left: 6px; padding: 0 5px; border-radius: 8px; background: var(--wk); color: #fff; font: 700 10px/16px var(--ui); vertical-align: 1px; }
.ns-grid td.wk-hit { background: #EAF8FB !important; }
.ns-fig.big { font-size: 20px; font-weight: 600; }
.ns-wkp { border-color: #8FD3E0; }
.ns-wkp > .ns-pth { background: var(--wk-soft); border-color: #B2E4EE; }
.ns-wkp > .ns-pth b { color: var(--wk-ink); }
.ns-wks { font-size: 12.5px; color: var(--ns-dim); margin: 2px 0 8px; }
.ns-wkl li { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid #EDF0F3; }
.ns-wkl li.picked { background: #F4FCFD; }
.ns-wkr { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--wk); color: #fff; font-size: 11.5px; font-weight: 700; }
.ns-wkh { flex: 1; min-width: 0; display: flex; flex-direction: column; border: 0; background: none; padding: 0; text-align: left; }
.ns-wkh em { font-style: normal; font-size: 11px; color: var(--ns-dim); }
.ns-wkh b { font-size: 13px; font-weight: 600; color: var(--ns-ink); }
.ns-wkh:hover b { text-decoration: underline; }
.ns-wko { display: inline-flex; gap: 2px; }
.ns-wkall { margin-top: 8px; font-weight: 600; }
.ns-rl > .wk-banner, .ns-rep > .wk-banner { margin: 0 0 10px; }
.ns-docb > .wk-banner { flex: 0 1 300px; margin: 0; align-items: flex-start; }
.ns-cmt { flex: 0 1 280px; background: #fff; border: 1px solid var(--ns-line); border-radius: 3px; padding: 12px 14px; font-size: 13px; }
.ns-cmt p:first-child { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
.ns-cmt p:first-child span { color: var(--ns-dim); font-size: 12px; margin-left: auto; }
.ns-doc blockquote { border-left: 3px solid var(--wk); padding: 4px 12px; margin: 0 0 12px; color: #334155; }
.ns-exec { margin: 10px 0; }
.ns-kpi td.ns-wcell { min-width: 240px; }
.ns-wnote.hit span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ns-rli .ns-tag { white-space: nowrap; }
@media (max-width: 600px) {
  .ns-head { gap: 10px; padding: 0 10px; }
  .ns-search { flex: 0 0 auto; max-width: none; }
  .ns-search span, .ns-help, .ns-role { display: none; }
  .ns-page { padding: 10px 10px 30px; }
  .ns-kpi td:first-child { white-space: normal; min-width: 130px; }
  .ns-kpi td.ns-wcell { min-width: 200px; }
  .ns-dh { flex-direction: column; gap: 2px; }
  .ns-pha { display: none; }
}

/* Round 1: whole rows are clickable */
.os-screen .ns-grid tr.flagrow { cursor: pointer; }
.os-screen .ns-grid tr.flagrow:hover td { background: #FEF7E0 !important; }
.os-screen .ns-grid tr.flagrow:hover td:first-child { box-shadow: inset 3px 0 0 #F9AB00; }

/* THE CLEAN SCREENS
   Everything outside the two desks: the intro, the cards between scenes, the meeting as a
   video call, the result, the week (a dashboard with each plan's Slack channel) and the final
   score. Light, quiet, product-like. Amber is "on your own"; cyan is "with Wake". */

.wx.cl-root { background: #F6F7F9; color: #0F172A; color-scheme: light; font: 400 15px/1.5 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
.wx.cl-root.wake, .wx.cl-root.day { background: #F6F7F9; }
.wx .cl-screen, .wx .screen.cl-screen { --ink: #0F172A; --dim: #64748B; --line: #E2E8F0; --card: #fff; --y: #D97706; --y-soft: #FEF3C7; --y-ink: #92400E; --w: #0891B2; --w-soft: #CFFAFE; --w-ink: #155E75; --acc: #4F46E5;
  max-width: none; margin: 0; padding: 0; gap: 0; animation: none; display: block; min-height: 100vh; min-height: 100dvh; font: 400 15px/1.5 'Inter', system-ui, -apple-system, sans-serif; color: var(--ink); }
.wx .cl-screen * { text-transform: none; }
.wx .cl-screen :where(h1, h2, h3, p) { margin: 0; font: inherit; color: inherit; }
.wx .cl-screen button { font: inherit; cursor: pointer; }
.cl-mark { display: inline-block; flex: none; }
.cl-mark svg, .fm svg { width: 100%; height: 100%; display: block; }
.cl-muted { color: var(--dim); font-size: 13.5px; }
.cl-link { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 4px 0; color: var(--acc); font-weight: 500; font-size: 14px; text-decoration: none; }
.cl-link .gl { width: 16px; height: 16px; color: currentColor; display: inline-grid; }
.cl-link .gl svg { width: 100%; height: 100%; }

/* buttons */
.wx .cl-screen .cb { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 18px; border-radius: 10px; border: 1px solid var(--line); background: #fff; color: var(--ink); font: 600 14px/1.2 'Inter', system-ui, sans-serif; transition: background .12s, transform .08s, box-shadow .12s; }
.wx .cl-screen .cb:hover { background: #F1F5F9; }
.wx .cl-screen .cb:active { transform: translateY(1px); }
.wx .cl-screen .cb:disabled { opacity: .45; cursor: default; }
.wx .cl-screen .cb > span { display: inline-flex; align-items: center; gap: 6px; }
.wx .cl-screen .cb .gl { width: 18px; height: 18px; display: inline-grid; color: currentColor; }
.wx .cl-screen .cb .gl svg { width: 100%; height: 100%; }
.wx .cl-screen .cb.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
.wx .cl-screen .cb.primary:hover { background: #1E293B; }
.wx .cl-screen .cb.wake { background: var(--w); border-color: var(--w); color: #fff; }

.mt-p { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 4px; border-radius: 999px; background: #24262C; font-size: 12.5px; color: #C9CDD6; transition: background .15s, box-shadow .15s, opacity .2s; }

@media (max-width: 900px) { .mt-paper { position: static; width: auto; transform: none; max-height: 40%; } .mt-roomv { display: flex; flex-direction: column; } .mt-map { position: relative; flex: 1; min-height: 180px; } }

/* ------------------------------------------------------------ before the meeting: the agenda */
.wx .cl-screen.mi { background: #F4F1EA !important; color: #1C1B19; min-height: 100vh; min-height: 100dvh; overflow: auto; font-family: 'Inter', system-ui, sans-serif; }
.mi-page { max-width: 980px; margin: 0 auto; padding: 48px 24px 56px; display: flex; flex-direction: column; gap: 18px; }
.mi-k { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase !important; color: #7A6F5C; }
.mi-page h1 { font: 700 clamp(30px, 4vw, 44px)/1.1 'Space Grotesk', 'Inter', sans-serif !important; letter-spacing: -.02em; color: #1C1B19; }
.mi-lead { font-size: 18px; line-height: 1.55; color: #3D3A33; max-width: 60ch; }

.mi-cols { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 18px; }
@media (max-width: 760px) { .mi-cols { grid-template-columns: 1fr; } }
.mi-cols section { background: #fff; border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.mi-l { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase !important; color: #7A6F5C; }
.mi-ag { display: flex; flex-direction: column; gap: 10px; padding-left: 20px; list-style: decimal; }
.mi-ag li b { display: block; font-size: 15px; color: #1C1B19; }
.mi-ag li span { font-size: 14px; color: #5A554A; }
.mi-ppl { display: flex; flex-wrap: wrap; gap: 8px 14px; }
.mi-ppl span { display: inline-flex; align-items: center; gap: 8px; }

.mi-ppl i { font-style: normal; font-size: 11.5px; color: #7A6F5C; }
.mi-watch { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: #3D3A33; }
.mi-watch b { color: #1C1B19; }
.mi-watch b.dec { color: #137333; } .mi-watch b.owed { color: #B06000; }
.mi-note { font-size: 14px; color: #5A554A; }
.mi-go { display: flex; }
.mt-sum { font-size: 12.5px; color: #5F6368; padding: 6px 10px; border-radius: 8px; background: #F1F3F4; font-style: italic; }

/* final score: Wake is not just for meetings */
.fs2-lives { background: #0F172A !important; color: #E2E8F0; border: 0 !important; display: flex; flex-direction: column; gap: 10px; }
.fs2-lives h2 { color: #fff !important; font-size: clamp(20px, 2.4vw, 26px) !important; }
.lv-k { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase !important; color: #67E8F9; }
.lv-m { width: 20px; height: 20px; display: inline-block; }
.lv-m svg { width: 100%; height: 100%; }
.lv-sub { color: #CBD5E1; font-size: 15px; line-height: 1.55; max-width: 70ch; }
.lv-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 6px; }
@media (max-width: 900px) { .lv-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .lv-grid { grid-template-columns: 1fr; } }
.lv-t { padding: 14px; border-radius: 12px; background: rgba(255,255,255,.05); border: 1px solid rgba(103,232,249,.18); display: flex; flex-direction: column; gap: 6px; }
.lv-t b { color: #fff; font-size: 15px; }
.lv-t p { color: #CBD5E1; font-size: 13.5px; line-height: 1.5; }
.lv-i { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: rgba(34,211,238,.14); }
.lv-i .gl { width: 17px; height: 17px; display: inline-grid; color: #67E8F9; }
.lv-i .gl svg { width: 100%; height: 100%; }

/* the first meeting is a good meeting with loose ends, not a failure: green for decided, yellow for
   anything still open, soft grey for set aside; never red */
.mt-stamp.s-guess, .mt-stamp.s-pilot { border-color: #34A853; background: #E6F4EA; } .mt-stamp.s-guess b, .mt-stamp.s-pilot b { color: #137333; }
.mt-stamp.s-agreed, .mt-stamp.s-parked, .mt-stamp.s-next, .mt-stamp.s-busy { border-color: #F9AB00; background: #FEF7E0; } .mt-stamp.s-agreed b, .mt-stamp.s-parked b, .mt-stamp.s-next b, .mt-stamp.s-busy b { color: #B06000; }
.mt-stamp.s-dropped { border-color: #BDC1C6; background: #F1F3F4; } .mt-stamp.s-dropped b { color: #5F6368; }
.seg.guess, .seg.pilot { background: #4ADE80; } .seg.agreed, .seg.parked, .seg.next, .seg.busy { background: #F59E0B; } .seg.dropped { background: #CBD5E1; color: #475569; }
.rs-legend .guess i { background: #4ADE80; } .rs-legend .parked i { background: #F59E0B; } .rs-legend .dropped i { background: #CBD5E1; }

/* ---------------------------------------------------------------- the call with your lender */
.wx .cl-screen.mt.call { background: #14151A; }
.mt.call .mt-bar { display: flex; justify-content: space-between; gap: 16px; }
.mt.call .mt-bc { margin-left: auto; }
.cv { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(260px, 340px) minmax(0, 1fr); gap: 12px; }
.cv-card { display: flex; flex-direction: column; gap: 18px; padding: 18px; border-radius: 12px; background: linear-gradient(160deg, #1E2A3A 0%, #121821 100%); border: 1px solid rgba(255,255,255,.06); }
.cv-top { display: flex; justify-content: space-between; align-items: center; }
.cv-live { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; color: #8AB4F8; letter-spacing: .02em; }
.cv-live i { width: 8px; height: 8px; border-radius: 50%; background: #34A853; box-shadow: 0 0 0 0 rgba(52,168,83,.6); animation: cvPulse 1.8s ease-out infinite; }
@keyframes cvPulse { to { box-shadow: 0 0 0 8px rgba(52,168,83,0); } }
.cv-time { font: 600 15px/1 'Roboto Mono', ui-monospace, monospace; color: #E8EAED; font-variant-numeric: tabular-nums; }
.cv-main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; }
.cv-main .face { box-shadow: 0 0 0 6px rgba(138,180,248,.12); transition: box-shadow .2s; }
.cv-card.talk .cv-main .face { box-shadow: 0 0 0 6px rgba(138,180,248,.35), 0 0 0 14px rgba(138,180,248,.12); }
.cv-main b { display: block; font: 600 20px/1.2 'Inter', system-ui, sans-serif; color: #fff; }
.cv-main span { font-size: 13px; color: #9AA0A6; }

.cv-btns { display: flex; justify-content: center; gap: 14px; }

.cv-btns i.end { background: #EA4335; color: #fff; }
.cv-btns svg { width: 22px; height: 22px; }
.mt-paper.call { position: static; width: auto; max-height: none; transform: none; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
.mt-paper.call .mt-scr-body { padding: 22px 26px; }
@media (max-width: 900px) { .cv { grid-template-columns: 1fr; } .cv-main { flex-direction: row; text-align: left; justify-content: flex-start; } .cv-btns { display: none; } }

/* THE WORLD
   The title screen, the setup questions, the office scenes and the step cards. Quiet on purpose:
   one dark neutral, one text color, a single white button for the next step, no glows. */

.wx.sc-root { background: #0B0C0F; color: #E8EAED; color-scheme: dark; font: 400 16px/1.5 'Inter', system-ui, sans-serif; }
.wx .sc-screen { --bg: #0B0C0F; --surface: #141519; --line: #26282E; --line2: #3A3D45; --ink: #E8EAED; --dim: #9AA0A6; --faint: #6B7078;
  --cy: #22D3EE; --ind: #6366F1; --px: 'Press Start 2P', 'Courier New', monospace; --disp: 'Space Grotesk', 'Inter', system-ui, sans-serif;
  position: relative; width: 100%; height: 100vh; height: 100dvh; overflow: hidden; margin: 0; padding: 0; color: var(--ink); }
.wx .sc-screen * { text-transform: none; }
:where(.wx .sc-screen) :where(h1, h2, p, dl, dd) { margin: 0; font: inherit; color: inherit; }
.wx .sc-screen button { font: inherit; cursor: pointer; }

.sc-layer { position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: flex-start; padding: 32px; pointer-events: none; }
.sc-layer.dim::before { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(8,9,12,.7) 0%, rgba(8,9,12,.3) 40%, rgba(8,9,12,0) 62%); opacity: 0; transition: opacity .5s; }
.sc-layer.show::before { opacity: 1; }
.sc-layer > .mc { pointer-events: auto; position: relative; }

/* ------------------------------------------------------------ the pixel office */
.px-scene { background: #0B0A14; opacity: 0; transition: opacity .5s ease; }
.px-scene.in { opacity: 1; }
.px-map { position: absolute; inset: 0; }
.px-canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
.px-map::after { content: ''; position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 140px rgba(5,4,14,.55); }
.px-hud { position: absolute; top: 16px; left: 16px; right: 16px; display: flex; align-items: center; gap: 8px; pointer-events: none; }
.px-chip { padding: 7px 12px; border-radius: 8px; background: rgba(11,12,15,.86); border: 1px solid var(--line); font: 500 13px/1 'Inter', sans-serif; color: var(--dim); }
.px-chip b { color: var(--ink); font-weight: 600; }
.px-chip.co { color: var(--ink); }
.wx .sc-screen .px-skip { margin-left: auto; pointer-events: auto; padding: 7px 12px; border-radius: 8px; background: rgba(11,12,15,.86); border: 1px solid var(--line); font: 500 13px/1 'Inter', sans-serif; color: var(--ink); }

/* ------------------------------------------------------------ the step card */
.mc { width: min(520px, 100%); padding: 22px 24px 20px; border-radius: 14px; background: rgba(20,21,25,.97); border: 1px solid var(--line); box-shadow: 0 24px 60px rgba(0,0,0,.45);
  display: flex; flex-direction: column; gap: 14px; animation: mcIn .4s cubic-bezier(.2,.8,.2,1) both; }
@keyframes mcIn { from { opacity: 0; transform: translateY(10px); } }
.mc-steps { display: flex; gap: 4px; }
.mc-steps span { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.mc-steps span::before { content: ''; height: 2px; border-radius: 1px; background: var(--line2); }
.mc-steps span.done::before { background: var(--dim); }
.mc-steps span.on::before { background: var(--ink); }
.mc-steps i { display: none; }
.mc-steps b { font: 500 11px/1.2 'Inter', sans-serif; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mc-steps .on b { color: var(--ink); } .mc-steps .done b { color: var(--dim); }
.mc-k { font: 500 12.5px/1.4 'Inter', sans-serif; color: var(--dim); }
.mc h1 { font: 650 26px/1.2 'Inter', sans-serif; letter-spacing: -.015em; color: #fff; }
.mc-row { display: flex; flex-direction: column; gap: 3px; }
.mc-l { font: 600 11px/1.3 'Inter', sans-serif; letter-spacing: .06em; text-transform: uppercase !important; color: var(--faint); }
.mc-row p:last-child { font-size: 15px; line-height: 1.55; color: #D4D7DC; }
.mc-note { margin-top: -4px; padding: 8px 12px; border-radius: 8px; background: rgba(255,255,255,.05); font-size: 13px; line-height: 1.5; color: var(--dim); }
.mc-box { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.03); }
.mc-box > p:not(.mc-l) { font-size: 14px; line-height: 1.5; color: #D4D7DC; }
.mc-box .mc-l + * { margin-top: -2px; }
.mc-watch { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; font-size: 14px; color: #D4D7DC; }
.mc-watch b { color: #fff; } .mc-watch b.dec { color: #4ADE80; } .mc-watch b.owed { color: #FBBF24; }
.mc-wake { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(34,211,238,.25); background: rgba(34,211,238,.06); }
.mc-wake .mc-wk { flex: none; width: 30px; height: 30px; margin-top: 1px; }
.mc-wake .mc-wk svg { width: 100%; height: 100%; display: block; }
.mc-wake p:last-child { font-size: 15px; line-height: 1.55; color: #D4D7DC; }
.mc-go { display: flex; align-items: center; gap: 12px; margin-top: 4px; }
.mc-key { font: 500 12px/1 'Inter', sans-serif; color: var(--faint); padding: 4px 7px; border-radius: 5px; border: 1px solid var(--line2); }
.mc-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.mc-stat { padding: 10px 12px; border-radius: 10px; background: rgba(255,255,255,.03); border: 1px solid var(--line); display: flex; flex-direction: column; }
.mc-stat b { font: 650 20px/1.25 'Inter', sans-serif; color: #fff; }
.mc-stat span { font-size: 12px; color: var(--dim); }
.mc-clock { font: 650 56px/1 'Inter', sans-serif; letter-spacing: -.03em; color: #fff; font-variant-numeric: tabular-nums; }

/* buttons: one white button for the next step, quiet outlines for the rest */
.wx .sc-screen .ab { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 20px; border-radius: 10px; border: 1px solid var(--line2); background: transparent; color: var(--ink); font: 600 15px/1 'Inter', sans-serif; transition: background .12s, transform .08s; }
.wx .sc-screen .ab:hover { background: rgba(255,255,255,.06); }
.wx .sc-screen .ab:active { transform: translateY(1px); }
.wx .sc-screen .ab:disabled { opacity: .4; cursor: default; }
.wx .sc-screen .ab.primary { border-color: #fff; background: #fff; color: #0B0C0F; }
.wx .sc-screen .ab.primary:hover { background: #E3E5E8; }
.wx .sc-screen .ab.ghost { background: transparent; }
.wx .sc-screen .ab.small { padding: 8px 12px; font-size: 13px; }
.wx .sc-screen .ab.big { padding: 14px 24px; font-size: 16px; }
.wx .sc-screen .ab:focus-visible, .wx .sc-screen .su-row:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

/* ------------------------------------------------------------ the title screen */
.ti { background: #0B0A14; opacity: 0; transition: opacity .6s ease; }
.ti.in { opacity: 1; }
.ti .px-map::after { background: radial-gradient(ellipse 60% 70% at 50% 50%, rgba(11,12,15,.95) 0%, rgba(11,12,15,.88) 45%, rgba(11,12,15,.55) 100%); box-shadow: none; }
/* the title sits centered over the office */
.ti-body { position: absolute; inset: 0; padding: 0 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; }
.ti-body h1 { max-width: 16ch; }
.ti-brand { font: 700 18px/1 'Inter', sans-serif; letter-spacing: -.01em; color: #fff; margin-bottom: 8px; }
.ti-body h1 { font: 650 44px/1.1 'Inter', sans-serif; letter-spacing: -.025em; color: #fff; }
.ti-body p { font-size: 17px; line-height: 1.55; color: var(--dim); max-width: 40ch; }
.ti-body .su-go { justify-content: center; }
.ti-body .su-go .mc-key { display: none; }
.ti-body .su-go { margin-top: 12px; }
@media (max-width: 820px) {
  .ti .px-map::after { background: rgba(11,12,15,.88); }
  .ti-body { padding: 0 16px; }
  .ti-body h1 { font-size: 32px; }
}

/* ------------------------------------------------------------ setup: three short questions */
.su { display: flex; flex-direction: column; overflow: auto !important; background: var(--bg); animation: suIn .3s ease both; }
@keyframes suIn { from { opacity: 0; } }
.su-top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; padding: 20px 28px; border-bottom: 1px solid var(--line); }
.su-brand { font: 700 17px/1 'Inter', sans-serif; letter-spacing: -.01em; }
.su-prog { display: flex; flex-direction: column; align-items: center; gap: 7px; font-size: 12.5px; color: var(--dim); }
.su-prog i { display: flex; gap: 4px; }
.su-prog em { width: 44px; height: 3px; border-radius: 2px; background: var(--line2); }
.su-prog em.on { background: var(--ink); }
.wx .sc-screen .su-back { justify-self: end; border: 0; background: none; color: var(--dim); font-size: 14px; padding: 6px 4px; }
.wx .sc-screen .su-back:hover { color: var(--ink); }
.su-body { width: 100%; max-width: 620px; margin: 0 auto; padding: 8vh 24px 64px; display: flex; flex-direction: column; gap: 14px; }
.su-body h1 { font: 650 32px/1.2 'Inter', sans-serif; letter-spacing: -.02em; color: #fff; }
.su-sub { font-size: 16px; line-height: 1.55; color: var(--dim); margin-bottom: 12px; }
.su-list { display: flex; flex-direction: column; gap: 8px; }
.wx .sc-screen .su-row { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 16px 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); transition: border-color .12s, background .12s; }
.wx .sc-screen .su-row:hover, .wx .sc-screen .su-row:focus-visible { border-color: var(--line2); background: #191A1F; }
.su-rt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.su-rt b { font-size: 16px; font-weight: 600; color: #fff; display: flex; align-items: center; gap: 8px; }
.su-rt b small { font-size: 11.5px; font-weight: 600; color: var(--ink); padding: 2px 7px; border-radius: 999px; border: 1px solid var(--line2); }
.su-rt > span { font-size: 14px; color: var(--dim); line-height: 1.45; }
.su-row em { font-style: normal; font-size: 13.5px; color: var(--dim); white-space: nowrap; }
.su-row > i { font-style: normal; color: var(--faint); transition: transform .12s, color .12s; }
.su-row:hover > i { color: var(--ink); transform: translateX(2px); }
.su-card { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
.su-co { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.su-co b { font: 650 22px/1.25 'Inter', sans-serif; color: #fff; }
.wx .sc-screen .su-link { border: 0; background: none; padding: 0; color: var(--dim); font-size: 13.5px; text-decoration: underline; text-underline-offset: 3px; }
.wx .sc-screen .su-link:hover { color: var(--ink); }
.su-card dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 24px; font-size: 14.5px; }
.su-card dt { color: var(--dim); }
.su-card dd { color: var(--ink); }
.su-q { font-size: 15px; font-weight: 600; color: #fff; margin-top: 14px; }
.su-how { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 15px; color: var(--dim); }
.su-how li::marker { color: var(--faint); }
.su-go { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
/* the moment picker: icons, and the moments that are coming */
.su-ic { flex: none; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: rgba(255,255,255,.06); color: #fff; }
.su-ic svg { width: 20px; height: 20px; }
.wx .sc-screen .su-row.soon { cursor: default; opacity: .55; border-style: dashed; background: transparent; }
.su-row.soon:hover { border-color: var(--line); }
.su-soon { font-style: normal; font-size: 11.5px !important; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 4px 8px; border-radius: 999px; border: 1px solid var(--line2); color: var(--dim); }
.su-note { font-size: 13.5px; color: var(--faint); margin-top: 4px; }
@media (max-width: 560px) { .su-row > em:not(.su-soon) { display: none; } .su-ic { width: 30px; height: 30px; } }
/* who's playing: name, email, phone */
.sg-form { display: flex; flex-direction: column; gap: 14px; }
