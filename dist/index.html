.src-chip { display: flex; flex-direction: column; gap: 2px; text-align: left; padding: 7px 10px; background: var(--a-panel2); border: 0; box-shadow: inset 0 0 0 2px var(--a-line); max-width: 300px; min-width: 0; color: var(--a-ink); }
.src-chip:hover, .src-chip:focus-visible { box-shadow: inset 0 0 0 2px var(--a-cyan); outline: none; }
.sc-sys { font: 400 7px/1.4 var(--px); color: var(--a-cyan); text-transform: uppercase; }
.sc-l { font-size: 13.5px; line-height: 1.3; }
.src-chip.seen-r1 { box-shadow: inset 0 0 0 2px rgba(255, 210, 63, .55); }
.src-chip.flagged-r1 { box-shadow: inset 0 0 0 2px var(--a-yellow); }
.src-more { border: 0; background: none; color: var(--a-cyan); font: 400 8px/1 var(--px); padding: 8px 6px; }
.ins .do { align-items: baseline; }
.ins .do p { font-size: 17px; }
.ins-foot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 14px; }
.ins-foot .owner { font-size: 14px; }
.ins-foot .owner em { font-style: normal; color: var(--a-dim); }
.link.more { font: 400 9px/1 var(--px); text-decoration: none; color: var(--a-cyan); padding: 6px 0; }
.ins-more { display: flex; flex-direction: column; gap: 10px; padding-top: 10px; border-top: 1px solid var(--a-line); }
.ins-more .why { font-size: 16px; line-height: 1.55; }
.btn.pick { align-self: start; white-space: nowrap; font-size: 10px; padding: 12px 14px 11px; box-shadow: inset 0 0 0 3px var(--a-cyan); color: var(--a-cyan); }
.btn.pick.on { background: var(--a-cyan); color: var(--a-bg); box-shadow: inset 0 0 0 3px var(--a-cyan), 4px 4px 0 var(--a-pink); }
.cleared { max-width: 1080px; width: 100%; padding: 12px 16px; background: var(--a-panel); box-shadow: inset 0 0 0 2px var(--a-line); }
.cleared summary { cursor: pointer; font: 400 9px/1.6 var(--px); color: var(--a-dim); }
.cleared ul { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.cleared li { display: flex; flex-direction: column; gap: 2px; font-size: 14px; color: var(--a-dim); }
.cleared li strong { color: var(--a-ink); text-decoration: line-through; text-decoration-color: var(--a-pink); }

/* trace: where a line came from */
.pop.trace .pop-body { width: min(760px, 100%); }
.pop.trace .pop-body > h3 { font: 700 22px/1.25 var(--doc, var(--read)); }
.tr-val { font: 700 18px/1.3 var(--doc, var(--read)); color: var(--p-ink); }
.tr-src { font-size: 13px; color: var(--p-dim); }
.docp.mini { box-shadow: 0 0 0 1px var(--p-line); padding: 14px 16px; max-width: none; background: #FBFBFD; }
.mini-h { font: 700 12px/1.3 var(--doc, var(--read)); text-transform: uppercase; letter-spacing: .05em; margin-top: 6px; }
.dtable td.tr-hl { background: #FFE98A; font-weight: 700; box-shadow: inset 0 0 0 2px var(--a-yellow); }
.quote-src { padding: 12px 14px; background: #F7F6FA; box-shadow: inset 3px 0 0 #5B4C99; display: flex; flex-direction: column; gap: 6px; }
.quote-src.message { box-shadow: inset 3px 0 0 #3B82F6; }
.q-h { font: 700 11px/1.3 var(--doc, var(--read)) !important; color: var(--p-dim); letter-spacing: .05em; }
.tr-r1 { font-size: 14px; padding: 8px 10px; background: #F3F2F7; color: var(--p-dim); }
.tr-r1.seen { background: #FFF6CC; color: #5A4500; }
.tr-sec { display: flex; flex-direction: column; gap: 6px; padding-top: 10px; border-top: 1px solid var(--p-line); }
.tr-sec > b { font: 700 11px/1.3 var(--doc, var(--read)); letter-spacing: .06em; color: #0B7F7B; }
.tr-sec .src-chip { background: #F3F2F7; color: var(--p-ink); box-shadow: inset 0 0 0 1px var(--p-line); }
.tr-sec .src-chip:hover { box-shadow: inset 0 0 0 2px #1FB5B0; }
.tr-sec .sc-sys { color: #0B7F7B; }
.tr-do { font-weight: 700; }
.pop.trace .coach-inline { margin-bottom: 4px; }

/* executive documents */
.docp.memo { max-width: 820px; gap: 10px; }
.memo-ask { padding: 10px 14px; font-family: var(--doc); background: var(--p-soft); box-shadow: inset 3px 0 0 var(--a-yellow); font-size: 15px; }
.memo-p { font-size: 16px; line-height: 1.6; }
.dtable td.pos { color: #1B7A3A; }
.dtable td.neg { color: #C62828; }

/* calendar, annotated */
.cev.k-wake { background: #DFF8F7; color: #0B4A48; box-shadow: inset 3px 0 0 #1FB5B0; outline: 1px dashed #1FB5B0; outline-offset: -3px; }
.cev.wk::after, .wk-ev.wk::after { content: ''; position: absolute; top: 5px; right: 5px; width: 8px; height: 8px; background: #1FB5B0; }
.cev.wk, .wk-ev.wk { position: relative; }
.round2 .cal-day .cev { position: absolute; }

/* team */
.tcard.has { box-shadow: inset 0 0 0 2px var(--a-cyan); }
.tcard small.asg { color: var(--a-cyan); }
.fnum.cy { background: var(--a-cyan) !important; }

@media (max-width: 760px) {
  .cstats { grid-template-columns: minmax(0, 1fr); }
  .ins { grid-template-columns: 30px minmax(0, 1fr); padding: 12px; gap: 10px; }
  .ins .btn.pick { grid-column: 1 / -1; justify-self: stretch; }
  .ins-rank { font-size: 18px; }
  .ins h3 { font-size: 18px; }
  .src-chip { max-width: 100%; }
}

.round2 .when .clock { color: var(--a-cyan); }
.pop.trace .pp-people { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px 12px; }

/* ---------------------------------------------------------------- executive library */
.brief-intro { margin: 2px 0 10px; padding: 12px 14px; background: rgba(57, 229, 224, .08); box-shadow: inset 3px 0 0 var(--a-cyan); display: flex; flex-direction: column; gap: 7px; font-size: 14px; line-height: 1.5; color: var(--a-ink, #E9E6F5); }
.brief-intro .bi-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.brief-intro .bi-top b { font: 400 9px/1 var(--px); color: var(--a-cyan); }
.brief-intro .bi-top span { font: 400 15px/1 var(--term); color: var(--a-dim); }
.exec-group { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
.exec-group .eg-h { font: 400 8px/1.4 var(--px); color: var(--a-dim); letter-spacing: .06em; padding: 6px 2px 2px; }
.exec-item .item-text strong { font-size: 15px; }

.docp.fin-doc { max-width: 980px; padding: 30px 34px 22px; gap: 0; }
.fd-head { text-align: center; padding-bottom: 14px; border-bottom: 3px double #1E2533; }
.fd-head .fd-co { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: #3E4757; font-weight: 600; }
.docp.fin-doc .fd-head h3 { font: 400 26px/1.2 Georgia, 'Times New Roman', serif !important; color: #111827; margin: 6px 0 4px; letter-spacing: .01em; }
.fd-head .fd-per { font-size: 13.5px; color: #4B5563; font-style: italic; font-family: Georgia, 'Times New Roman', serif; }
.fd-meta { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 16px; font-size: 11.5px; color: #6B7280; padding: 8px 0 2px; }
.fin-doc .docp-intro { font-size: 13px; color: #4B5563; margin-top: 6px; }
.fd-foot { display: flex; justify-content: space-between; gap: 10px; margin-top: 22px; padding-top: 8px; border-top: 1px solid #D1D5DB; font-size: 11px; color: #9CA3AF; text-transform: uppercase; letter-spacing: .08em; }

.kpis-x { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; margin-top: 18px; border-top: 2px solid #1E2533; border-bottom: 1px solid #D1D5DB; }
.kx { display: flex; flex-direction: column; gap: 3px; padding: 11px 14px 12px; border-left: 1px solid #E5E7EB; min-width: 0; }
.kx:first-child { border-left: 0; padding-left: 0; }
.kx-l { font-size: 11px; color: #6B7280; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
.kx strong { font-size: 22px; line-height: 1.15; color: #111827; font-variant-numeric: tabular-nums; font-weight: 600; }
.kx-s { font-size: 12px; color: #6B7280; }
.kx.neg .kx-s { color: #B91C1C; }
.kx.pos .kx-s { color: #15803D; }

.fin-doc .dblock { margin-top: 22px; }
.fin-doc .dblock h4 { font-size: 12px; letter-spacing: .1em; color: #1E2533; padding-bottom: 6px; border-bottom: 1px solid #1E2533; }
.dtable.fin { font-size: 14px; }
.dtable.fin th { color: #4B5563; border-bottom: 1px solid #9CA3AF; font-size: 11px; white-space: nowrap; }
.dtable.fin td { border-bottom: 1px solid #F0F1F4; white-space: nowrap; }
.dtable.fin td:first-child { white-space: normal; min-width: 180px; }
.dtable.fin tr.head td { font-weight: 700; color: #111827; padding-top: 14px; border-bottom: 0; }
.dtable.fin tr.indent td:first-child { padding-left: 26px; color: #374151; }
.dtable.fin tr.total td { font-weight: 700; border-top: 1px solid #1E2533; border-bottom: 0; }
.dtable.fin tr.grand td { font-weight: 800; border-top: 1px solid #1E2533; border-bottom: 3px double #1E2533; background: #F7F8FA; }
.dtable.fin td.neg { color: #B91C1C; }
.dtable.fin td.pos { color: #15803D; }
.dtable .sp { display: inline-flex; align-items: center; gap: 8px; justify-content: flex-end; }
.spark polyline { stroke: #374151; }
.spark circle { fill: #374151; }
.spark.neg polyline { stroke: #B91C1C; }
.spark.neg circle { fill: #B91C1C; }
.dtext ul { margin: 4px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.dtext li, .dtext p { font-size: 14.5px; line-height: 1.55; color: #1F2937; }
@media (max-width: 760px) {
  .docp.fin-doc { padding: 20px 14px 16px; }
  .kpis-x { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kx:nth-child(3) { border-left: 0; padding-left: 0; }
  .kx:nth-child(n+3) { border-top: 1px solid #E5E7EB; }
  .kx strong { font-size: 19px; }
  .docp.fin-doc .fd-head h3 { font-size: 21px; }
}

/* THE COMPUTER
   The desks are a real-looking laptop: menu bar, dock, one browser window, and the apps a team
   uses (Gmail, QuickBooks, Google Calendar, Messages, Drive with Sheets and Docs, Contacts).
   Everything here is scoped to .os-screen so the arcade around it keeps its own look. */

.wx .screen.os-screen { max-width: none; margin: 0; padding: 0; gap: 0; height: 100vh; height: 100dvh; animation: none; display: flex; flex-direction: column;
  --g-font: 'Roboto', 'Helvetica Neue', Arial, sans-serif; --ui: 'Inter', 'Roboto', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --g-ink: #1F1F1F; --g-dim: #5F6368; --g-line: #E0E3E7; --g-blue: #0B57D0; --g-blue-soft: #D3E3FD; --g-hover: #F2F6FC; --g-bg: #F8FAFD;
  --wk: #0891B2; --wk-soft: #E0F7FA; --wk-ink: #0E4F5C;
  font: 400 14px/1.45 var(--ui); color: var(--g-ink); color-scheme: light; background: #0B0D12; }
.wx.arcade:has(.os-screen)::after { display: none; }
:where(.os-screen) button { font: inherit; color: inherit; cursor: pointer; }
:where(.os-screen) :where(h1, h2, h3, h4) { font: inherit; color: inherit; }
.wx .screen.os-screen * { text-transform: none; }
:where(.os-screen) .ico, :where(.os-screen) .gl { display: inline-grid; place-items: center; flex: none; }
:where(.os-screen) .ico svg, :where(.os-screen) .gl svg { width: 100%; height: 100%; display: block; }
:where(.os-screen) .gl { width: 20px; height: 20px; color: #444746; }
.wx .face { display: inline-grid; place-items: center; flex: none; border-radius: 50%; color: #fff; font-family: var(--g-font); font-weight: 500; letter-spacing: .01em; line-height: 1; }

/* buttons in the game layer */
.os-screen .ob { font: 500 14px/1 var(--ui); padding: 10px 18px; border-radius: 999px; border: 1px solid #C4C7C5; background: #fff; color: var(--g-blue); display: inline-flex; align-items: center; gap: 6px; }
.os-screen .ob > span { display: inline-flex; align-items: center; gap: 6px; }
.os-screen .ob .gl { width: 18px; height: 18px; color: currentColor; }
.os-screen .ob:hover { background: var(--g-hover); }
.os-screen .ob.primary { background: var(--g-blue); border-color: var(--g-blue); color: #fff; }
.os-screen .ob.primary:hover { background: #0842A0; }
.os-screen .ob.quiet { color: #C9CDD6; background: transparent; border-color: #3A3F4B; }
.os-screen .ob.tonal { background: var(--g-blue-soft); border-color: transparent; color: #041E49; }
.os-screen .ob.small { padding: 7px 12px; font-size: 13px; }
.os-screen .link { font: 400 14px/1.2 var(--ui); color: var(--g-dim); }
.os-screen .chip { font: 500 12px/1 var(--ui); letter-spacing: 0; padding: 7px 10px; border-radius: 8px; background: #fff; color: var(--g-ink); box-shadow: inset 0 0 0 1px #C4C7C5; }
.os-screen .chip:hover { box-shadow: inset 0 0 0 1px var(--g-ink); }
.os-screen .quiet { color: var(--g-dim); font-size: 13px; }

/* ------------------------------------------------------------ game strip */
.game-strip { flex: none; display: flex; align-items: center; gap: 16px; padding: 8px 16px; background: #0B0D12; color: #E8EAED; border-bottom: 1px solid #23262E; min-height: 54px; position: relative; z-index: 6; }
.gs-left { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
.gs-round { font: 600 11px/1 var(--ui); letter-spacing: .08em; text-transform: uppercase; padding: 6px 9px; border-radius: 6px; background: #FFD23F; color: #1B1500; white-space: nowrap; }
.game-strip.wake .gs-round { background: #22D3EE; color: #042F36; }
.gs-task { font-size: 13.5px; color: #C9CDD6; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.gs-right { display: flex; align-items: center; gap: 10px; flex: none; }
.gs-findings { display: inline-flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 10px; background: #1A1D24; border: 1px solid #2D313B; color: #E8EAED; font-size: 13px; }
.gs-findings:hover { border-color: #5F6368; }
.gs-findings b { font-weight: 600; color: #FFD23F; }
.game-strip.wake .gs-findings b { color: #22D3EE; }
.gs-findings b.ok { color: #6DD58C; }
.gs-findings .slots { display: inline-flex; gap: 4px; }
.gs-findings .slots i { width: 9px; height: 9px; border-radius: 50%; background: #2D313B; }
.gs-findings .slots i.need { box-shadow: inset 0 0 0 1.5px #8A8F99; background: transparent; }
.gs-findings .slots i.on { background: #FFD23F; }
.game-strip.wake .gs-findings .slots i.on { background: #22D3EE; }
.gs-help { width: 30px; height: 30px; border-radius: 50%; border: 1px solid #3A3F4B; background: transparent; color: #C9CDD6 !important; font-weight: 600; }
.gs-alert { position: absolute; left: 50%; top: 100%; transform: translate(-50%, 8px); background: #FFD23F; color: #1B1500; padding: 8px 14px; border-radius: 10px; font-size: 13.5px; box-shadow: 0 6px 24px rgba(0,0,0,.35); white-space: nowrap; z-index: 40; }
.game-strip.wake .gs-alert { background: #22D3EE; color: #042F36; }

/* ------------------------------------------------------------ the machine */
.os-computer { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; overflow: hidden; }
.os-menubar { flex: none; height: 28px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; background: rgba(28, 30, 38, .72); backdrop-filter: blur(20px); color: #F2F2F2; font: 500 13px/1 -apple-system, 'SF Pro Text', var(--ui); z-index: 5; }
.mb-left, .mb-right { display: flex; align-items: center; gap: 18px; white-space: nowrap; }
.mb-left span { font-weight: 400; }
.mb-logo { font-size: 13px; opacity: .9; }
.mb-app { font-weight: 700; }
.os-screen .mb-g { width: 16px; height: 16px; color: #F2F2F2; }
.mb-clock { font-variant-numeric: tabular-nums; }
.os-desktop { flex: 1; min-height: 0; position: relative; }
.os-wall { position: absolute; inset: 0; background: radial-gradient(1200px 600px at 20% 10%, #3A4E86 0%, transparent 60%), radial-gradient(900px 600px at 85% 90%, #7B4D86 0%, transparent 60%), linear-gradient(160deg, #1E2A4A, #2C2147 60%, #171A2C); }
.wall-co { position: absolute; left: 28px; top: 24px; display: flex; flex-direction: column; gap: 4px; color: rgba(255,255,255,.82); }
.wall-co b { font: 600 22px/1.2 var(--ui); }
.wall-co span { font-size: 13px; color: rgba(255,255,255,.55); }

.os-window { position: absolute; left: 1.6%; right: 1.6%; top: 10px; bottom: 84px; display: flex; flex-direction: column; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 .5px rgba(0,0,0,.4), 0 22px 70px rgba(0,0,0,.5); z-index: 2; animation: winIn .18s ease-out; }
@keyframes winIn { from { transform: scale(.985); opacity: 0; } }
.br-chrome { flex: none; background: #DFE3EB; }
.br-top { display: flex; align-items: flex-end; gap: 10px; padding: 8px 10px 0; height: 40px; }
.lights { display: inline-flex; gap: 8px; padding: 0 6px 12px 4px; }
.lights i { width: 12px; height: 12px; border-radius: 50%; display: block; cursor: pointer; }
.l-r { background: #FF5F57; } .l-y { background: #FEBC2E; } .l-g { background: #28C840; }
.br-tabs { display: flex; gap: 2px; min-width: 0; overflow: hidden; }
.br-tab { display: flex; align-items: center; gap: 8px; height: 32px; min-width: 60px; max-width: 220px; padding: 0 14px; border: 0; border-radius: 10px 10px 0 0; background: transparent; font: 400 12.5px/1 var(--g-font); color: #3C4043; }
.br-tab:hover { background: rgba(255,255,255,.4); }
.br-tab.on { background: #fff; }
.tab-ico { width: 16px; height: 16px; }
.tab-t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.br-bar { display: flex; align-items: center; gap: 10px; padding: 6px 10px; background: #fff; border-bottom: 1px solid var(--g-line); }
.br-nav { display: inline-flex; gap: 6px; }
.br-nav .gl { width: 18px; height: 18px; color: #5F6368; }
.br-url { flex: 1; display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px; background: #EDF0F5; border-radius: 15px; font: 400 13.5px/1 var(--g-font); color: #5F6368; min-width: 0; overflow: hidden; white-space: nowrap; }
.os-screen .br-lock { width: 13px; height: 13px; color: #5F6368; }
.u-host { color: #1F1F1F; }
.nat-chrome { flex: none; height: 38px; display: flex; align-items: center; gap: 10px; padding: 0 12px; background: #ECECEC; border-bottom: 1px solid #D6D6D6; }
.nat-chrome .lights { padding: 0; }
.nat-title { flex: 1; text-align: center; font: 600 13px/1 -apple-system, 'SF Pro Text', var(--ui); color: #333; margin-right: 60px; }
.win-body { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; overflow: hidden; }
.win-body > * { flex: 1; min-height: 0; }

.os-dock { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); display: flex; gap: 6px; padding: 7px 9px; border-radius: 20px; background: rgba(255,255,255,.22); border: 1px solid rgba(255,255,255,.28); backdrop-filter: blur(24px); z-index: 4; }
.dock-app { position: relative; width: 56px; height: 56px; padding: 4px; border: 0; background: transparent; border-radius: 14px; transition: transform .14s ease; }
.dock-app:hover { transform: translateY(-6px) scale(1.06); }
.dock-ico { width: 48px; height: 48px; filter: drop-shadow(0 2px 4px rgba(0,0,0,.25)); }
.dock-app .dock-ico svg { border-radius: 11px; }
.dock-app[data-app="gmail"] .dock-ico, .dock-app[data-app="drive"] .dock-ico, .dock-app[data-app="calendar"] .dock-ico { background: #fff; border-radius: 11px; padding: 6px; }
.dock-badge { position: absolute; top: -2px; right: -2px; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: #FF3B30; color: #fff; font: 600 12px/20px -apple-system, var(--ui); font-style: normal; text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.dock-dot { position: absolute; left: 50%; bottom: -5px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: transparent; }
.dock-app.on .dock-dot { background: rgba(255,255,255,.9); }
.dock-tip { position: absolute; bottom: calc(100% + 10px); left: 50%; transform: translateX(-50%); padding: 4px 10px; border-radius: 6px; background: rgba(30,30,30,.86); color: #fff; font: 400 12.5px/1.3 -apple-system, var(--ui); white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .1s; }
.dock-app:hover .dock-tip { opacity: 1; }
.dock-app.hero { margin-right: 10px; }
.dock-app.hero::after { content: ''; position: absolute; right: -9px; top: 10px; bottom: 10px; width: 1px; background: rgba(255,255,255,.35); }

.os-notes { position: absolute; right: 14px; top: 10px; z-index: 30; display: flex; flex-direction: column; gap: 8px; width: min(360px, calc(100% - 28px)); pointer-events: none; }
.os-note { pointer-events: auto; display: flex; gap: 10px; align-items: flex-start; text-align: left; padding: 12px 14px; border: 0; border-radius: 16px; background: rgba(246,246,248,.9); backdrop-filter: blur(30px); box-shadow: 0 0 0 .5px rgba(0,0,0,.12), 0 10px 30px rgba(0,0,0,.28); color: #1D1D1F; font-family: -apple-system, 'SF Pro Text', var(--ui); animation: noteIn .28s cubic-bezier(.2,.9,.3,1.2); }
@keyframes noteIn { from { transform: translateX(110%); } }
.note-ico { width: 34px; height: 34px; }
.note-ico svg { border-radius: 8px; }
.note-main { display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1; }
.note-top { display: flex; justify-content: space-between; font-size: 11px; color: #6E6E73; letter-spacing: .02em; }
.note-top b { font-weight: 500; }
.note-main strong { font-size: 13.5px; font-weight: 600; }
.note-text { font-size: 13px; color: #3A3A3C; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.os-note.wkn { box-shadow: 0 0 0 1.5px #22D3EE, 0 10px 30px rgba(0,0,0,.28); }
.os-tip { position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 31; max-width: min(520px, 90%); padding: 12px 16px; border-radius: 10px; background: #303134; color: #fff; font-size: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.35); animation: noteIn2 .2s ease-out; }
@keyframes noteIn2 { from { opacity: 0; transform: translate(-50%, 8px); } }

/* ------------------------------------------------------------ Google header & nav (Gmail, Drive, Calendar, Contacts) */
.gm, .gd, .gc, .gco { display: flex; flex-direction: column; background: var(--g-bg); font-family: var(--g-font); color: var(--g-ink); }
.gm-head { flex: none; display: flex; align-items: center; gap: 8px; height: 60px; padding: 0 12px 0 8px; }
.gm-burger { width: 44px; height: 44px; display: grid; place-items: center; }
.gm-logo { display: inline-flex; align-items: center; gap: 6px; width: 220px; flex: none; font: 400 22px/1 'Product Sans', var(--g-font); color: #444746; }
.gm-mark { width: 34px; height: 34px; }
.gm-search { flex: 1; max-width: 720px; height: 46px; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-radius: 24px; background: #E9EEF6; color: #444746; font-size: 15.5px; }
.gm-hright { margin-left: auto; display: inline-flex; align-items: center; gap: 14px; padding-left: 12px; }
.gm-main { flex: 1; min-height: 0; display: flex; }
.gm-nav { flex: none; width: 250px; padding: 4px 12px 16px 8px; display: flex; flex-direction: column; overflow: auto; }
.gm-compose { display: inline-flex; align-items: center; gap: 12px; align-self: flex-start; height: 56px; padding: 0 22px 0 16px; margin: 4px 0 14px; border-radius: 16px; background: #C2E7FF; font-weight: 500; font-size: 14px; color: #001D35; }
.gm-ni { display: flex; align-items: center; gap: 16px; height: 32px; padding: 0 12px 0 22px; border-radius: 0 16px 16px 0; font-size: 14px; color: #202124; }
.gm-ni .gl { width: 18px; height: 18px; }
.gm-ni b { margin-left: auto; font-size: 12.5px; font-weight: 700; }
.gm-ni.on { background: #D3E3FD; font-weight: 700; color: #001D35; }
.gm-lh { margin: 16px 0 6px 22px; font-size: 16px; font-weight: 500; }
.gm-ldot { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.gm-pane { flex: 1; min-width: 0; margin: 0 16px 16px 0; background: #fff; border-radius: 16px; overflow: auto; position: relative; }
.gm-tools { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 18px; height: 48px; padding: 0 16px; background: #fff; }
.gm-count { margin-left: auto; font-size: 12.5px; color: var(--g-dim); }
.gm-cb { width: 16px; height: 16px; border: 2px solid #8E918F; border-radius: 2px; flex: none; }
.gm-ib { width: 36px; height: 36px; display: grid; place-items: center; border: 0; background: transparent; border-radius: 50%; color: #444746; }
.gm-ib:hover { background: #EEF0F2; }
.gm-tabs { display: flex; border-bottom: 1px solid var(--g-line); }
.gm-tabs span { display: inline-flex; align-items: center; gap: 14px; width: 250px; padding: 16px; font-size: 14px; color: var(--g-dim); }
.gm-tabs span.on { color: var(--g-blue); box-shadow: inset 0 -3px 0 var(--g-blue); font-weight: 500; }
.gm-tabs span.on .gl { color: var(--g-blue); }
.gm-list { display: flex; flex-direction: column; }
.gm-row { display: flex; align-items: center; gap: 12px; height: 42px; padding: 0 16px; border: 0; border-bottom: 1px solid #F1F3F4; background: #F2F6FC; text-align: left; font-size: 14px; color: #202124; }
.gm-row.unread { background: #fff; font-weight: 700; }
.gm-row:hover { box-shadow: inset 1px 0 0 #DADCE0, inset -1px 0 0 #DADCE0, 0 1px 2px rgba(60,64,67,.3), 0 1px 3px 1px rgba(60,64,67,.15); position: relative; z-index: 1; }
.gm-row .gm-star { width: 18px; height: 18px; color: #C4C7C5; }
.gm-from { width: 180px; flex: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gm-subj { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gm-subj b { font-weight: inherit; }
.gm-row:not(.unread) .gm-subj b { font-weight: 400; }
.gm-snip { color: var(--g-dim); font-weight: 400; }
.gm-row time { flex: none; font-size: 12.5px; width: 64px; text-align: right; }
.gm-row:not(.unread) time { font-weight: 400; color: var(--g-dim); }
.gm-chip { font-style: normal; display: inline-block; padding: 1px 6px; margin-right: 6px; border-radius: 4px; background: #DDDDDD; color: #444; font-size: 12px; font-weight: 500; vertical-align: 1px; }
.gm-chip.warn { background: #FCE8E6; color: #A50E0E; }
.gm-chip.inbox { margin-left: 10px; vertical-align: 4px; }
.gm-chip.wkc { background: var(--wk-soft); color: var(--wk-ink); }
.gm-chip.dim { background: #F1F3F4; color: #5F6368; }
.gm-msg { padding: 0 0 40px; }
.gm-msg > :not(.gm-tools) { margin-left: 72px; margin-right: 32px; }
.gm-msubj { font: 400 22px/1.3 var(--g-font); margin: 12px 0 16px; }
.gm-mfrom { display: flex; align-items: flex-start; gap: 12px; margin-left: 16px !important; }
.gm-mwho { flex: 1; min-width: 0; }
.gm-mwho p { font-size: 14px; }
.gm-mwho p span { color: var(--g-dim); font-size: 12.5px; }
.gm-to { color: var(--g-dim); font-size: 12.5px !important; }
.gm-mwhen { display: inline-flex; align-items: center; gap: 14px; font-size: 12.5px; color: var(--g-dim); white-space: nowrap; }
.gm-body { margin-top: 18px; font: 400 14px/1.6 Arial, sans-serif; color: #222; display: flex; flex-direction: column; gap: 12px; }
.gm-sig { color: #777; }
.gm-reply { display: flex; gap: 12px; margin-top: 28px; }
.gm-rb { display: inline-flex; align-items: center; gap: 8px; padding: 9px 22px 9px 16px; border-radius: 18px; border: 1px solid #747775; font-weight: 500; font-size: 14px; color: #444746; }

/* the game layer inside apps: connected data, attaching, flag hint */
.cx-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 12px; margin: 4px 0 14px; border-radius: 12px; background: #F0F4F9; font-family: var(--g-font); }
.cx-l { font-size: 12px; font-weight: 500; letter-spacing: .02em; color: var(--g-dim); margin-right: 4px; }
.cx-chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 8px; border-radius: 8px; border: 1px solid #C4C7C5; background: #fff; font-size: 13px; color: #1F1F1F; }
.cx-chip:hover { background: #E8F0FE; border-color: #A8C7FA; }
.cx-chip.seen { color: var(--g-dim); }
.cx-ico { width: 18px; height: 18px; }
.os-screen .cx-seen { width: 16px; height: 16px; color: #188038; }
.cx-crumb { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 8px 0; font-size: 13px; color: var(--g-dim); font-family: var(--g-font); }
.attach-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 18px; }
.os-screen .attach-btn { font-size: 13.5px; padding: 8px 14px; background: #E8F0FE; color: #0B57D0; border-color: transparent; }
.os-screen .attach-btn.on { background: #E6F4EA; color: #137333; }
.flag-hint { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #8A5300; background: #FEF7E0; padding: 8px 12px; border-radius: 8px; margin: 0 0 12px; font-family: var(--g-font); }
.os-screen .flag-hint .gl { width: 16px; height: 16px; color: #B06000; }

/* figures you can flag, in any table */
.os-screen .figbtn { position: relative; border: 0; background: transparent; padding: 2px 4px; margin: -2px -4px; font: inherit; color: inherit; border-radius: 3px; text-align: inherit; font-variant-numeric: tabular-nums; }
.os-screen .figbtn:hover { background: #FEF7E0; box-shadow: inset 0 0 0 1px #F9AB00; }
.os-screen td.is-flag .figbtn { background: #FEEFC3; box-shadow: inset 0 0 0 1.5px #F9AB00; }
.os-screen td.hl { background: #FFF3BF !important; }
.os-screen td.hl .figbtn { box-shadow: inset 0 0 0 2px #F29900; }
.os-screen .fnum { position: absolute; top: -9px; left: -10px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: #E37400; color: #fff; font: 700 10px/16px var(--ui); font-style: normal; text-align: center; }

/* ------------------------------------------------------------ QuickBooks Online */
.qb { display: flex; background: #F4F5F8; font-family: 'Avenir Next', 'Avenir', 'Helvetica Neue', var(--ui); color: #393A3D; }
.qb-nav { flex: none; width: 210px; background: #393A3D; color: #fff; display: flex; flex-direction: column; padding-bottom: 12px; overflow: auto; }
.qb-brand { display: flex; align-items: center; gap: 8px; height: 60px; padding: 0 16px; font: 600 19px/1 'Avenir Next', var(--ui); letter-spacing: -.01em; }
.qb-mark { width: 28px; height: 28px; }
.qb-new { display: inline-flex; align-items: center; justify-content: center; gap: 6px; margin: 4px 16px 14px; height: 36px; border-radius: 18px; border: 1px solid #8D9096; font-weight: 600; font-size: 14px; }
.os-screen .qb-new .gl { width: 18px; height: 18px; color: #fff; }
.qb-ni { display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 18px; border: 0; background: transparent; color: #fff !important; font-size: 14px; text-align: left; }
.os-screen .qb-ni .gl { width: 19px; height: 19px; color: #C9CBCF; }
.qb-ni:hover { background: #4B4C50; }
.qb-ni.on { background: #212124; box-shadow: inset 4px 0 0 #2CA01C; font-weight: 600; }
.qb-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.qb-head { flex: none; height: 60px; display: flex; align-items: center; gap: 20px; padding: 0 20px; background: #fff; border-bottom: 1px solid #DCDDE0; }
.qb-co { font-size: 15px; font-weight: 600; white-space: nowrap; }
.qb-search { flex: 1; max-width: 560px; display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 12px; border: 1px solid #BABEC5; border-radius: 4px; color: #8D9096; font-size: 13.5px; white-space: nowrap; overflow: hidden; }
.qb-hr { margin-left: auto; display: inline-flex; align-items: center; gap: 14px; }
.qb-banner { display: flex; align-items: center; gap: 10px; padding: 10px 20px; background: var(--wk-soft); color: var(--wk-ink); font-size: 13.5px; border-bottom: 1px solid #B2EBF2; }
.qb-content { flex: 1; min-height: 0; overflow: auto; padding: 22px 28px 40px; }
.qb-rl h1 { font: 600 26px/1.2 'Avenir Next', var(--ui); color: #393A3D; margin-bottom: 14px; }
.qb-rtabs { display: flex; gap: 26px; border-bottom: 1px solid #DCDDE0; margin-bottom: 18px; }
.qb-rtabs span { padding: 10px 0; font-size: 14px; color: #6B6C72; }
.qb-rtabs span.on { color: #393A3D; font-weight: 600; box-shadow: inset 0 -3px 0 #2CA01C; }
.qb-rg { margin-bottom: 22px; }
.qb-rg h2 { display: flex; align-items: center; gap: 6px; font-size: 17px; font-weight: 600; margin-bottom: 10px; }
.qb-rgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 0 32px; background: #fff; border: 1px solid #DCDDE0; border-radius: 6px; padding: 6px 16px; }
.qb-ritem { position: relative; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 12px 0; border: 0; border-bottom: 1px solid #ECEDEF; background: transparent; text-align: left; }
.qb-ritem:hover .qb-rname { text-decoration: underline; }
.qb-rname { color: #0077C5; font-size: 14.5px; font-weight: 500; }
.qb-rsub { grid-column: 1; font-size: 12.5px; color: #6B6C72; }
.os-screen .qb-rstar { grid-column: 2; grid-row: 1 / 3; width: 18px; height: 18px; color: #2CA01C; }
.qb-new-dot { font-style: normal; font-size: 11px; font-weight: 600; color: #fff; background: #2CA01C; border-radius: 9px; padding: 2px 8px; position: absolute; right: 32px; top: 12px; }
.qb-back { display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; color: #0077C5 !important; font-size: 14px; padding: 0 0 10px; }
.os-screen .qb-back .gl { color: #0077C5; width: 18px; height: 18px; }
.qb-rbar { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 18px; padding: 14px 18px; background: #fff; border: 1px solid #DCDDE0; border-radius: 6px 6px 0 0; }
.qb-field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.qb-field label { font-size: 12px; color: #6B6C72; }
.qb-sel { display: inline-flex; align-items: center; justify-content: space-between; gap: 20px; height: 34px; padding: 0 8px 0 12px; border: 1px solid #8D9096; border-radius: 4px; min-width: 160px; }
.qb-radio { display: inline-flex; align-items: center; gap: 6px; margin-right: 12px; height: 34px; }
.qb-radio i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #8D9096; }
.qb-radio.on i { border: 5px solid #2CA01C; }
.qb-run { height: 34px; padding: 0 16px; display: inline-flex; align-items: center; border-radius: 4px; border: 1px solid #8D9096; font-weight: 600; font-size: 14px; }
.qb-rtools { margin-left: auto; display: inline-flex; align-items: center; gap: 14px; font-size: 14px; }
.qb-cust { padding: 0 14px; height: 34px; display: inline-flex; align-items: center; border: 1px solid #8D9096; border-radius: 4px; font-weight: 600; }
.qb-save { padding: 0 14px; height: 34px; display: inline-flex; align-items: center; background: #2CA01C; color: #fff; border-radius: 4px; font-weight: 600; }
.qb-rep > .cx-crumb, .qb-rep > .cx-bar, .qb-rep > .flag-hint { margin: 12px 0 0; }
.qb-paper { background: #fff; border: 1px solid #DCDDE0; border-top: 0; padding: 30px 36px 26px; border-radius: 0 0 6px 6px; margin-top: 0; }
.qb-rep > .flag-hint + .qb-paper, .qb-rep > .cx-bar + .qb-paper { margin-top: 12px; border-top: 1px solid #DCDDE0; border-radius: 6px; }
.qb-ph { text-align: center; margin-bottom: 18px; }
.qb-pco { font-size: 17px; color: #393A3D; }
.qb-ph h1 { font: 600 20px/1.3 'Avenir Next', var(--ui); margin: 2px 0; }
.qb-ph p:last-child { font-size: 14px; color: #6B6C72; }
.qb-intro { text-align: center; font-size: 13px; color: #6B6C72; margin: -8px 0 18px; }
.qb-block { margin: 0 0 26px; }
.qb-block h3 { font-size: 14.5px; font-weight: 600; margin: 0 0 6px; }
.qb-bnote { font-size: 12.5px; color: #6B6C72; margin-bottom: 6px; }
.qb-pfoot { margin-top: 18px; font-size: 12px; color: #8D9096; text-align: center; }
.os-screen .dscroll { overflow-x: auto; }
.dt { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.dt th { text-align: left; font-weight: 600; font-size: 12px; color: #393A3D; padding: 8px 10px; border-bottom: 1px solid #393A3D; white-space: nowrap; }
.dt td { padding: 7px 10px; border-bottom: 1px solid #ECEDEF; vertical-align: top; }
.dt .n { text-align: right; }
.dt tr.total td { font-weight: 600; border-top: 1px solid #393A3D; border-bottom: 3px double #393A3D; }
.dt tr.head td { font-weight: 600; padding-top: 14px; }
.dt tr.indent td:first-child { padding-left: 26px; }
.dt tr.grand td { font-weight: 700; border-top: 2px solid #393A3D; }
.dt td.bad, .dt td.neg { color: #D52B1E; }
.dt td.good, .dt td.pos { color: #108000; }
.dt.mini { font-size: 12.5px; margin: 6px 0; }

/* ------------------------------------------------------------ Drive, Sheets, Docs */
.gd-pane { padding: 6px 20px 30px; }
.gd-crumbs { display: flex; align-items: center; gap: 4px; font: 400 22px/1.3 var(--g-font); padding: 12px 0 14px; }
.gd-crumbs span:not(.gl) { padding: 2px 6px; border-radius: 6px; }
.gd-chips { display: flex; gap: 8px; margin-bottom: 12px; }
.gd-chips span { display: inline-flex; align-items: center; gap: 6px; padding: 5px 8px 5px 14px; border-radius: 8px; border: 1px solid #747775; font-size: 13.5px; font-weight: 500; color: #444746; }
.gd-chips .gl { width: 18px; height: 18px; }
.gd-table { display: flex; flex-direction: column; }
.gd-th, .gd-row { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 1.6fr) 1fr .7fr; gap: 12px; align-items: center; }
.gd-th { padding: 0 12px 10px; font-size: 13.5px; font-weight: 500; color: #444746; border-bottom: 1px solid var(--g-line); }
.gd-row { height: 48px; padding: 0 12px; border: 0; border-bottom: 1px solid var(--g-line); background: transparent; text-align: left; font-size: 13.5px; color: #444746; }
.gd-row:hover { background: #F0F4F9; }
.gd-row.on { background: #C2E7FF; }
.gd-name { display: flex; align-items: center; gap: 14px; min-width: 0; }
.gd-name b { font-weight: 500; color: #1F1F1F; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gd-row.unread .gd-name b { font-weight: 700; }
.gd-ico { width: 22px; height: 22px; }
.gd-owner { display: flex; align-items: center; gap: 8px; min-width: 0; white-space: nowrap; overflow: hidden; }
.gd-group { padding: 18px 12px 8px; font-size: 13.5px; font-weight: 500; color: var(--g-dim); }
.gd-note { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 12px; background: var(--wk-soft); color: var(--wk-ink); margin-bottom: 14px; font-size: 13.5px; }

.gs, .gdoc { display: flex; flex-direction: column; background: #F9FBFD; font-family: var(--g-font); }
.ed-head { flex: none; display: flex; align-items: center; gap: 10px; padding: 8px 16px 2px 10px; background: #F9FBFD; }
.ed-home { border: 0; background: transparent; padding: 2px; border-radius: 6px; }
.ed-home:hover { background: #E8EAED; }
.ed-ico { width: 32px; height: 40px; }
.ed-tm { flex: 1; min-width: 0; }
.ed-title { display: flex; align-items: center; gap: 8px; font-size: 18px; color: #1F1F1F; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.os-screen .ed-star { width: 18px; height: 18px; color: #444746; }
.ed-menus { display: flex; gap: 2px; font-size: 14px; color: #1F1F1F; white-space: nowrap; overflow: hidden; }
.ed-menus span { padding: 2px 7px; border-radius: 4px; }
.ed-by { color: var(--g-dim); text-decoration: underline; margin-left: 10px; font-size: 13px; }
.ed-share { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 22px 0 16px; border-radius: 20px; background: #C2E7FF; font-weight: 500; font-size: 14px; color: #001D35; }
.os-screen .ed-share .gl { width: 18px; height: 18px; color: #001D35; }
.gs-toolbar { flex: none; display: flex; gap: 4px; align-items: center; margin: 6px 12px; padding: 4px 12px; border-radius: 24px; background: #EDF2FA; font-size: 13px; color: #444746; overflow: hidden; white-space: nowrap; }
.gs-toolbar span { padding: 4px 8px; }
.gs-fx { flex: none; display: flex; align-items: center; gap: 0; border-top: 1px solid #E1E3E1; border-bottom: 1px solid #E1E3E1; background: #fff; height: 28px; font-size: 13px; }
.gs-name { width: 92px; padding: 0 10px; border-right: 1px solid #E1E3E1; color: #444746; }
.gs-fxl { padding: 0 10px; color: #A0A0A0; font-style: italic; border-right: 1px solid #E1E3E1; }
.gs-fx-v { padding: 0 10px; white-space: nowrap; overflow: hidden; }
.gs .gd-note, .gs .gs-note { margin: 0; border-radius: 0; }
.gs-note { padding: 8px 14px 0; background: #fff; border-bottom: 1px solid #E1E3E1; }
.gs-note .cx-bar, .gs-note .flag-hint, .gs-note .cx-crumb { margin: 0 0 8px; }
.gs-scroll { flex: 1; min-height: 0; overflow: auto; background: #fff; }
.gs-grid { border-collapse: collapse; font: 400 13px/1.2 Arial, sans-serif; color: #000; table-layout: auto; }
.gs-grid th { position: sticky; top: 0; z-index: 1; background: #F8F9FA; color: #575A5C; font-weight: 400; font-size: 11px; height: 21px; border: 1px solid #E1E3E1; min-width: 96px; }
.gs-grid th.gs-corner { left: 0; z-index: 2; min-width: 46px; }
.gs-grid th.gs-rn { position: sticky; left: 0; z-index: 1; min-width: 46px; width: 46px; }
.gs-grid tbody th { top: auto; }
.gs-grid td { height: 23px; padding: 2px 6px; border: 1px solid #E1E3E1; white-space: nowrap; max-width: 380px; overflow: hidden; text-overflow: ellipsis; }
.gs-grid td:first-of-type { min-width: 230px; }
.gs-grid td.n { text-align: right; }
.gs-grid td.sel { box-shadow: inset 0 0 0 2px #1A73E8; }
.gs-grid .gs-btitle { font-weight: 700; font-size: 14px; }
.gs-grid .gs-bnote, .gs-grid .gs-intro { color: #5F6368; font-style: italic; }
.gs-grid .gs-hdr { background: #F3F3F3; font-weight: 700; }
.gs-grid tr.total td { font-weight: 700; border-top: 1px solid #000; }
.gs-grid td.fig { cursor: pointer; }
.gs-grid td.bad, .gs-grid td.neg { color: #C5221F; }
.gs-grid td.good, .gs-grid td.pos { color: #137333; }
.gs-tabs { flex: none; display: flex; align-items: center; gap: 4px; padding: 4px 8px; background: #F9FBFD; border-top: 1px solid #E1E3E1; overflow-x: auto; }
.gs-tplus { width: 30px; text-align: center; color: #444746; font-size: 16px; }
.gs-tab { border: 0; background: transparent; padding: 7px 16px; border-radius: 6px 6px 0 0; font-size: 13.5px; font-weight: 500; color: #444746; white-space: nowrap; }
.gs-tab:hover { background: #E8EAED; }
.gs-tab.on { background: #E1E9F7; color: #0B57D0; box-shadow: inset 0 -2px 0 #0B57D0; }
.gdoc-canvas { flex: 1; min-height: 0; overflow: auto; padding: 18px 16px 40px; background: #F9FBFD; display: flex; justify-content: center; gap: 20px; align-items: flex-start; }
.gdoc-page { width: min(816px, 100%); min-height: 900px; background: #fff; box-shadow: 0 1px 3px rgba(60,64,67,.2); border: 1px solid #E1E3E1; padding: 72px 84px; font: 400 15px/1.6 Arial, sans-serif; color: #000; display: flex; flex-direction: column; gap: 12px; }
.gdoc-page h1 { font: 400 26px/1.3 Arial, sans-serif; }
.gdoc-page h2 { font: 400 19px/1.3 Arial, sans-serif; margin-top: 10px; }
.gdoc-page h3 { font: 700 15px/1.3 Arial, sans-serif; margin-top: 8px; }
.gdoc-page ul { list-style: disc; padding-left: 28px; display: flex; flex-direction: column; gap: 6px; }
.gdoc-page .doc-meta { color: #5F6368; font-size: 13px; }
.gdoc-page blockquote { padding: 8px 14px; border-left: 3px solid #DADCE0; color: #444; }
.gdoc-page .dt { font: 400 13px/1.35 Arial, sans-serif; }
.gdoc-page .dt th { border-bottom-color: #000; }

/* ------------------------------------------------------------ Google Calendar */
.gc-head .gm-logo { width: auto; margin-right: 26px; }
.gc-today { height: 36px; padding: 0 18px; border-radius: 18px; border: 1px solid #747775; background: #fff; font-weight: 500; font-size: 14px; color: #1F1F1F !important; margin-right: 6px; }
.gc-month { font: 400 22px/1 var(--g-font); margin-left: 8px; white-space: nowrap; }
.gc-view { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 10px 0 16px; margin-left: auto; border-radius: 18px; border: 1px solid #747775; font-weight: 500; font-size: 14px; }
.gc-main { flex: 1; min-height: 0; display: flex; }
.gc-side { flex: none; width: 240px; padding: 4px 16px; display: flex; flex-direction: column; gap: 6px; overflow: auto; }
.gc-side .gm-compose { background: #fff; box-shadow: 0 1px 3px rgba(60,64,67,.3), 0 4px 8px 3px rgba(60,64,67,.15); color: #3C4043; margin-bottom: 18px; }
.gc-cals { font-weight: 500; font-size: 14px; margin-top: 10px; }
.gc-cal { display: flex; align-items: center; gap: 12px; font-size: 14px; padding: 4px 0; }
.gc-cal i { width: 16px; height: 16px; border-radius: 3px; }
.gc-pane { flex: 1; min-width: 0; margin: 0 16px 16px 0; background: #fff; border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; position: relative; }
.gc-days, .gc-allday { flex: none; display: grid; grid-template-columns: 56px repeat(var(--days, 5), 1fr); }
.gc-days { --days: 5; padding-top: 8px; border-bottom: 1px solid var(--g-line); }
.gc-tz { font-size: 10px; color: var(--g-dim); align-self: end; padding: 0 0 4px 8px; }
.gc-dh { display: flex; flex-direction: column; align-items: center; gap: 4px; padding-bottom: 8px; color: #444746; }
.gc-dh span { font-size: 11px; font-weight: 500; letter-spacing: .06em; }
.gc-dh b { font: 400 24px/44px var(--g-font); width: 44px; height: 44px; text-align: center; border-radius: 50%; }
.gc-dh.today span { color: var(--g-blue); }
.gc-dh.today b { background: var(--g-blue); color: #fff; }
.gc-allday { border-bottom: 1px solid var(--g-line); padding: 2px 0; }
.gc-allday > div { display: flex; flex-direction: column; gap: 2px; padding: 0 4px; border-left: 1px solid var(--g-line); }
.gc-ad { border: 0; border-radius: 4px; padding: 3px 8px; text-align: left; font-size: 12px; font-weight: 500; background: #039BE5; color: #fff !important; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gc-ad.gray { background: #E8EAED; color: #3C4043 !important; }
.gc-scroll { flex: 1; min-height: 0; overflow: auto; }
.gc-grid { position: relative; display: grid; grid-template-columns: 56px repeat(5, 1fr); height: calc(12 * 48px); }
.gc-hours { position: relative; }
.gc-hours span { position: absolute; right: 8px; transform: translateY(-50%); font-size: 10px; color: var(--g-dim); }
.gc-col { position: relative; border-left: 1px solid var(--g-line); }
.gc-line { position: absolute; left: 0; right: 0; border-top: 1px solid var(--g-line); }
.gc-ev { position: absolute; left: 2px; right: 8px; display: flex; flex-direction: column; align-items: flex-start; gap: 0; padding: 3px 8px; border: 1px solid #fff; border-radius: 6px; text-align: left; overflow: hidden; background: #039BE5; color: #fff !important; font-size: 12px; line-height: 1.3; z-index: 1; }
.gc-ev b { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.gc-ev span { opacity: .92; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.gc-ev em { position: absolute; top: 3px; right: 6px; font-style: normal; font-size: 10px; font-weight: 700; background: #FEEFC3; color: #8A5300; padding: 0 5px; border-radius: 6px; }
.gc-ev.blue { background: #039BE5; } .gc-ev.green { background: #33B679; } .gc-ev.red { background: #D50000; } .gc-ev.gray { background: #E8EAED; color: #3C4043 !important; }
.gc-ev.wake { background: var(--wk-soft); color: var(--wk-ink) !important; border: 1px dashed var(--wk); }
.gc-ev.plain { cursor: default; }
.gc-ev.short { flex-direction: row; align-items: center; gap: 6px; padding: 0 8px; }
.gc-ev.short span { opacity: .85; }
.gc-ev:not(.plain):hover { box-shadow: 0 2px 6px rgba(0,0,0,.25); z-index: 2; }
.gc-now { position: absolute; left: -6px; right: 0; height: 2px; background: #EA4335; z-index: 3; }
.gc-now::before { content: ''; position: absolute; left: 0; top: -5px; width: 12px; height: 12px; border-radius: 50%; background: #EA4335; }
.gc-pop { position: absolute; top: 90px; left: 50%; transform: translateX(-30%); width: min(448px, calc(100% - 24px)); max-height: calc(100% - 110px); overflow: auto; background: #F0F4F9; border-radius: 24px; box-shadow: 0 8px 28px rgba(0,0,0,.28); padding: 10px 18px 22px; z-index: 5; font-size: 14px; }
.gc-ptools { display: flex; justify-content: flex-end; align-items: center; gap: 10px; }
.gc-pt { display: flex; gap: 18px; align-items: flex-start; margin: 4px 0 14px; }
.gc-pt > i { width: 14px; height: 14px; border-radius: 4px; margin: 8px 2px 0; flex: none; }
.gc-pt h3 { font: 400 22px/1.3 var(--g-font); }
.gc-pt p { color: #444746; font-size: 14px; }
.gc-prow { display: flex; gap: 18px; align-items: flex-start; margin-top: 12px; }
.gc-prow ul { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
.gc-prow li { display: flex; align-items: center; gap: 10px; }
.gc-prow li em { font-style: normal; color: var(--g-dim); font-size: 12.5px; margin-left: 6px; }
.gc-plines { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1; }
.gc-plines .attach-row { margin-top: 8px; }

/* ------------------------------------------------------------ Messages */
.im { display: flex; font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', var(--ui); background: #fff; color: #1D1D1F; }
.im-side { flex: none; width: 300px; display: flex; flex-direction: column; background: #F5F5F7; border-right: 1px solid #D9D9DE; }
.im-search { display: flex; align-items: center; gap: 6px; margin: 10px 12px; height: 28px; padding: 0 8px; border-radius: 7px; background: #E4E4E9; color: #8E8E93; font-size: 13px; }
.os-screen .im-search .gl { width: 15px; height: 15px; color: #8E8E93; }
.im-list { flex: 1; overflow: auto; padding: 0 8px; }
.im-th { position: relative; display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 10px 10px 18px; border: 0; border-radius: 10px; background: transparent; text-align: left; }
.im-th.on { background: #0A84FF; color: #fff !important; }
.im-dot { position: absolute; left: 5px; top: 50%; margin-top: -4px; width: 8px; height: 8px; border-radius: 50%; background: transparent; }
.im-th.unread .im-dot { background: #0A84FF; }
.im-tt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.im-top { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.im-top time { font-size: 12.5px; color: #8E8E93; flex: none; }
.im-th.on .im-top time, .im-th.on .im-prev { color: rgba(255,255,255,.85); }
.im-prev { font-size: 13px; color: #6E6E73; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.im-pane { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.im-head { flex: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px; border-bottom: 1px solid #E5E5EA; font-size: 13px; }
.im-to { color: #8E8E93; } .im-to b { color: #1D1D1F; font-weight: 500; }
.im-sub { color: #8E8E93; font-size: 12px; }
.im-scroll { flex: 1; min-height: 0; overflow: auto; padding: 14px 22px 20px; display: flex; flex-direction: column; gap: 4px; }
.im-group { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; margin-bottom: 10px; }
.im-time { align-self: center; font-size: 11.5px; color: #8E8E93; margin: 8px 0 6px; }
.im-b { max-width: 70%; padding: 8px 13px; border-radius: 18px; font-size: 14.5px; line-height: 1.35; }
.im-b.in { background: #E9E9EB; color: #1D1D1F; }
.im-b.out { align-self: flex-end; background: #0A84FF; color: #fff; }
.im-group .attach-row { margin-top: 6px; }
.im-input { flex: none; display: flex; align-items: center; gap: 10px; padding: 10px 14px; }
.im-plus { width: 28px; height: 28px; border-radius: 50%; background: #E9E9EB; display: grid; place-items: center; color: #8E8E93; font-size: 18px; }
.im-field { flex: 1; height: 32px; padding: 0 14px; display: flex; align-items: center; border: 1px solid #D1D1D6; border-radius: 16px; color: #A1A1A6; font-size: 14px; }
.im-empty { margin: auto; color: #8E8E93; }
.im-scroll .cx-bar, .im-scroll .cx-crumb { align-self: stretch; }

/* ------------------------------------------------------------ Contacts */
.gco-pane { padding: 8px 20px 30px; }
.gco-h { font: 400 22px/1.3 var(--g-font); padding: 12px 0; }
.gco-h span { font-size: 14px; color: var(--g-dim); margin-left: 8px; }
.gco-note { font-size: 13px; color: var(--g-dim); margin-bottom: 10px; }
.gco-th, .gco-row { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1.4fr) minmax(0, 1.4fr) minmax(0, 1.6fr); gap: 14px; align-items: center; }
.gco-th { padding: 0 12px 10px; font-size: 13px; font-weight: 500; color: #444746; border-bottom: 1px solid var(--g-line); }
.gco-row { width: 100%; min-height: 54px; padding: 6px 12px; border: 0; border-bottom: 1px solid #F1F3F4; background: transparent; text-align: left; font-size: 14px; color: #1F1F1F; }
.gco-row:hover { background: #F0F4F9; }
.gco-name { display: flex; align-items: center; gap: 14px; min-width: 0; }
.gco-name b { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gco-row > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.gco-labels { display: flex; flex-wrap: wrap; gap: 4px; }
.gco-labels .gm-chip { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.gco-group { padding: 18px 12px 6px; font-size: 13px; font-weight: 500; color: var(--g-dim); text-transform: uppercase; letter-spacing: .04em; }
.gco-detail { padding: 10px 6px 30px; max-width: 760px; }
.gco-hero { display: flex; align-items: center; gap: 28px; margin: 10px 0 26px 14px; }
.gco-hero h1 { font: 400 30px/1.2 var(--g-font); }
.gco-hero p { color: #444746; margin-top: 4px; }
.gco-card { border: 1px solid var(--g-line); border-radius: 12px; padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; margin-left: 14px; }
.gco-card h2 { font: 500 16px/1.3 var(--g-font); }
.gco-f { display: flex; gap: 16px; align-items: flex-start; font-size: 14px; }
.gco-f p { font-size: 12px; color: var(--g-dim); }
.gco-f ul { list-style: disc; padding-left: 18px; }
.gco-asg { display: flex; flex-direction: column; gap: 3px; }
.gco-asg em { font-style: normal; }

/* ------------------------------------------------------------ dialogs, restyled for the computer */
.os-screen .overlay { background: rgba(9, 12, 20, .55); backdrop-filter: blur(2px); z-index: 40; }
.os-screen .dialog { background: #fff; color: var(--g-ink); border-radius: 24px; box-shadow: 0 24px 80px rgba(0,0,0,.4); padding: 26px 28px; animation: winIn .16s ease-out; font: 400 15px/1.5 var(--ui); gap: 14px; }
.os-screen .dialog h2 { font: 500 22px/1.3 var(--ui); color: var(--g-ink); }
.os-screen .dialog p { font-size: 14.5px; }
.os-screen .dialog .stamp { font: 600 12px/1 var(--ui); letter-spacing: .06em; text-transform: uppercase; color: #B06000; }
.os-screen .dialog .row { gap: 12px 16px; margin-top: 4px; }
.os-screen .composer { width: min(760px, 100%); }
/* dialogs always fit the screen: centered when they fit, scrolling inside when they don't, with
   the buttons pinned to the bottom so Add to findings is always in reach */
.os-screen .overlay { display: flex; padding: 16px; }
.os-screen .dialog { margin: auto; max-height: calc(100dvh - 32px); overflow-y: auto; overscroll-behavior: contain; }
.os-screen .dialog > .row:last-child { position: sticky; bottom: -26px; margin: 4px -28px -26px; padding: 14px 28px 18px; background: #fff; border-top: 1px solid #E8EAED; z-index: 1; }
@media (max-height: 760px) {
  .os-screen .dialog { padding: 18px 22px; gap: 10px; }
  .os-screen .dialog > .row:last-child { bottom: -18px; margin: 2px -22px -18px; padding: 12px 22px 14px; }
  .os-screen .composer .answer { padding-top: 8px; padding-bottom: 8px; }
}
.os-screen .flagged { margin: 0; padding: 12px 16px; border-radius: 12px; background: #FEF7E0; display: flex; flex-direction: column; gap: 2px; box-shadow: none; }
.os-screen .flagged .fl-src { font-size: 12px; color: #8A5300; }
.os-screen .flagged strong { font-size: 17px; font-weight: 600; font-family: var(--ui); color: var(--g-ink); }
.os-screen .flagged .fl-v { font-size: 14px; color: #5F6368; font-family: var(--ui); }
.os-screen .cprog { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.os-screen .cprog li { display: inline-flex; align-items: center; gap: 6px; font: 500 12.5px/1 var(--ui); color: var(--g-dim); letter-spacing: 0; text-transform: none; }
.os-screen .cprog li i { width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; font-style: normal; font-size: 11px; background: #E8EAED; color: #444746; }
.os-screen .cprog li.done { color: #137333; }
.os-screen .cprog li.done i { background: #137333; color: #fff; }
.os-screen .cstep2 { padding: 14px 0 0; border-top: 1px solid var(--g-line); background: none; box-shadow: none; display: flex; flex-direction: column; gap: 10px; }
.os-screen .cs-head { display: flex; gap: 12px; align-items: flex-start; }
.os-screen .cs-head > b { width: 24px; height: 24px; border-radius: 50%; background: var(--g-blue-soft); color: #041E49; display: grid; place-items: center; font: 600 12px/1 var(--ui); flex: none; }
.os-screen .cstep2 .label { font: 600 15px/1.3 var(--ui); color: var(--g-ink); letter-spacing: 0; text-transform: none; }
.os-screen .cstep2 .help { font-size: 13px; color: var(--g-dim); }
.os-screen .answers { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.os-screen .answer { position: relative; display: flex; flex-direction: column; gap: 4px; text-align: left; padding: 12px 14px 12px 40px; border-radius: 12px; border: 1px solid #C4C7C5; background: #fff; box-shadow: none; font-size: 14px; }
.os-screen .answer i { position: absolute; left: 14px; top: 14px; width: 16px; height: 16px; border-radius: 50%; border: 2px solid #747775; }
.os-screen .answer:hover { background: var(--g-hover); }
.os-screen .answer.on { border-color: var(--g-blue); background: #ECF3FE; box-shadow: inset 0 0 0 1px var(--g-blue); }
.os-screen .answer.on i { border: 5px solid var(--g-blue); }
.os-screen .a-read { font-weight: 500; color: var(--g-ink); font-family: var(--ui); font-size: 14px; }
.os-screen .a-act { font-size: 13px; color: var(--g-dim); font-family: var(--ui); }
.os-screen .shake { animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.os-screen .dialog textarea { width: 100%; font: 400 14.5px/1.45 var(--ui); padding: 12px 14px; border-radius: 12px; border: 1px solid #747775; background: #fff; color: var(--g-ink); resize: vertical; box-shadow: none; }
.os-screen .dialog textarea:focus { outline: 2px solid var(--g-blue); border-color: transparent; }
.os-screen .wcount { font-size: 12px; color: var(--g-dim); }
.os-screen .owner-pick { display: flex; flex-direction: column; gap: 10px; }
.os-screen .og { display: flex; flex-direction: column; gap: 6px; }
.os-screen .og-t { font: 600 11px/1 var(--ui); letter-spacing: .06em; text-transform: uppercase; color: var(--g-dim); }
.os-screen .og-list { display: flex; flex-wrap: wrap; gap: 6px; }
.os-screen .owner-chip { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; border-radius: 999px; border: 1px solid #C4C7C5; background: #fff; box-shadow: none; text-align: left; }
.os-screen .owner-chip span { display: flex; flex-direction: column; line-height: 1.15; }
.os-screen .owner-chip strong { font: 500 13px/1.2 var(--ui); }
.os-screen .owner-chip em { font: 400 11.5px/1.2 var(--ui); font-style: normal; color: var(--g-dim); }
.os-screen .owner-chip.on { background: var(--g-blue-soft); border-color: var(--g-blue); }
.os-screen .sure { display: flex; gap: 8px; }
.os-screen .sure-chip { padding: 8px 16px; border-radius: 8px; border: 1px solid #C4C7C5; background: #fff; font: 500 13.5px/1 var(--ui); box-shadow: none; }
.os-screen .sure-chip.on { background: var(--g-blue-soft); border-color: var(--g-blue); color: #041E49; }
.os-screen .finding-list { display: flex; flex-direction: column; gap: 10px; }
.os-screen .finding-row { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: start; padding: 14px; border-radius: 14px; border: 1px solid var(--g-line); background: #fff; box-shadow: none; }
.os-screen .finding-row .fnum, .os-screen .att-f .fnum { position: static; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; line-height: 1; background: #E37400; }
.os-screen .finding-row .fnum.cy { background: var(--wk); }
.os-screen .finding-row > div { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.os-screen .fr-src { font-size: 12px; color: var(--g-dim); font-family: var(--ui); letter-spacing: 0; text-transform: none; }
.os-screen .finding-row strong { font-size: 15px; font-weight: 600; }
.os-screen .finding-row p { font-size: 14px; color: #3C4043; }
.os-screen .fr-att { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
.os-screen .fr-att li { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #0B57D0; }
.os-screen .row-tools { display: flex; gap: 6px; }
.os-screen .att-item { padding: 10px 14px; border-radius: 10px; background: #F0F4F9; font-size: 14px; }
.os-screen .att-list { display: flex; flex-direction: column; gap: 8px; }
.os-screen .att-f { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px; border-radius: 12px; border: 1px solid #C4C7C5; background: #fff; box-shadow: none; }
.os-screen .att-f span { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.os-screen .att-f strong { font-size: 14px; }
.os-screen .att-f em { font-style: normal; font-size: 13px; color: var(--g-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.os-screen .att-f b { font: 600 13px/1 var(--ui); color: var(--g-blue); }
.os-screen .att-f.on { background: #E6F4EA; border-color: #137333; }
.os-screen .att-f.on b { color: #137333; }
.os-screen .mini-rules { display: flex; flex-direction: column; gap: 10px; list-style: disc; padding-left: 20px; font-size: 14.5px; }

/* the old desk styles stop at the computer */
.wx .os-screen .attach-row { border-top: 0; padding-top: 0; }
.wx .os-screen .flagged .fl-src { font: 500 12px/1.3 var(--ui) !important; color: #8A5300 !important; letter-spacing: 0; }
.wx .os-screen .flagged .fl-v { font: 400 14px/1.3 var(--ui) !important; color: #5F6368 !important; }

.wx .os-screen .gs-round, .wx .os-screen .og-t, .wx .os-screen .gco-group, .wx .os-screen .dialog .stamp, .wx .os-screen .gc-dh span, .wx .os-screen .wk-k { text-transform: uppercase; }

/* the guide, as a product tour */

body:has(.os-screen.round2) .coach b, body:has(.os-screen.round2) .coach-inline b { color: #0891B2; }
body:has(.os-screen) .coach .btn.primary, body:has(.os-screen) .coach-inline .btn.primary { font: 500 13.5px/1 'Inter', system-ui, sans-serif; letter-spacing: 0; padding: 10px 16px; border-radius: 999px; background: #0B57D0; color: #fff; box-shadow: none; }
body:has(.os-screen) .coach-wait { font: 500 12.5px/1.3 'Inter', system-ui, sans-serif; color: #0B57D0; text-transform: none; animation: none; }
body:has(.os-screen) .coach-ring { border-radius: 12px; box-shadow: 0 0 0 3px #4C8DF6, 0 0 0 9999px rgba(8, 12, 22, .42); animation: ringsoft 1.6s ease-in-out infinite; }
