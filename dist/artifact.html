button.ns-rli:hover span { text-decoration: underline; }
.ns-rli.unread { font-weight: 700; }
.ns-rli.dead { color: #4A6A93; }
.ns-tag { font-style: normal; font-size: 10.5px; font-weight: 600; padding: 2px 6px; border-radius: 3px; background: var(--wk-soft); color: var(--wk-ink); }

.ns-sub { display: flex; flex-wrap: wrap; gap: 2px; border-bottom: 1px solid var(--ns-line); margin: 0 0 10px; }
.ns-subt { border: 1px solid transparent; border-bottom: 0; background: none; padding: 6px 12px; font-size: 12.5px; color: var(--ns-link) !important; border-radius: 3px 3px 0 0; }
.ns-subt.on { background: #fff; border-color: var(--ns-line); color: var(--ns-ink) !important; font-weight: 700; margin-bottom: -1px; }

/* file cabinet and documents */
.ns-fcb { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 12px; align-items: start; }
@media (max-width: 760px) { .ns-fcb { grid-template-columns: 1fr; } }
.ns-fct { background: #fff; border: 1px solid var(--ns-line); border-radius: 3px; padding: 6px 0; }
.ns-fct li { display: flex; align-items: center; gap: 8px; padding: 5px 10px; font-size: 12.5px; }
.os-screen .ns-fct .gl { width: 15px; height: 15px; color: #C08A1E; }
.ns-fct li.on { background: #E6EEF9; font-weight: 700; }
.ns-fcb > .ns-grid { background: #fff; border: 1px solid var(--ns-line); }
.ns-docb { display: flex; gap: 12px; align-items: flex-start; }
.ns-doc { flex: 1; max-width: 760px; background: #fff; border: 1px solid var(--ns-line); border-radius: 3px; padding: 26px 32px; font-size: 14px; line-height: 1.6; }
.ns-doc h2 { font-size: 18px !important; font-weight: 600 !important; margin: 4px 0 10px; }
.ns-doc p, .ns-doc ul { margin: 0 0 10px; }
.ns-doc ul { padding-left: 20px; list-style: disc; }
.ns-doc .doc-meta { color: var(--ns-dim); font-size: 12.5px; }
.ns-col { display: flex; flex-direction: column; min-width: 0; }
.ns-rem li span { line-height: 1.3; }

/* Round 2: Wake built in */
.ns-page.flush { padding: 0; overflow: hidden; display: flex; }
.ns-page.flush > .wkapp { flex: 1; min-height: 0; }
.ns-page.flush .wk-nav, .ns-page.flush .wk-main { overflow: auto; }
.wk-nsub { margin: 10px 8px 2px; font-size: 11px; font-weight: 600; color: #64748B; text-transform: uppercase !important; letter-spacing: .05em; }
.wk-nfoot { margin: 14px 8px 0; font-size: 12px; line-height: 1.45; color: #64748B; }
.ns-wth { white-space: nowrap; color: var(--wk-ink) !important; background: var(--wk-soft) !important; }
.ns-wth .ns-wk-ico { width: 14px; height: 14px; vertical-align: -2px; margin-right: 5px; }
.ns-grid td.ns-wcell { background: #F4FCFD !important; max-width: 300px; }
.ns-wnote { display: inline-flex; align-items: flex-start; gap: 6px; font-size: 12px; line-height: 1.35; text-align: left; border: 0; background: none; padding: 0; color: var(--ns-dim) !important; }
.ns-wnote.hit { color: var(--wk-ink) !important; }
.ns-wnote.hit b { flex: none; padding: 1px 6px; border-radius: 9px; background: var(--wk); color: #fff; font-size: 11px; }
.ns-wnote.hit:hover span { text-decoration: underline; }
.ns-wnote.ok { color: #1E6B3A !important; }
.os-screen .ns-wnote .gl { width: 14px; height: 14px; color: #1E7B34; flex: none; }
.ns-grid tr.wk-row td:first-child { box-shadow: inset 3px 0 0 var(--wk); }
.ns-wm { display: inline-flex; align-items: center; gap: 4px; margin-top: 4px; font-size: 11px; color: var(--ns-dim); }
.ns-wm.hit { color: var(--wk-ink); font-weight: 600; }
.ns-wm .ns-wk-ico { width: 13px; height: 13px; }
.os-screen .ns .figbtn.wk-fig { padding-right: 4px; }
.os-screen .ns .wk-fig:hover { background: var(--wk-soft); box-shadow: inset 0 0 0 1px var(--wk); }
.wnum { font-style: normal; display: inline-block; margin-left: 6px; padding: 0 5px; border-radius: 8px; background: var(--wk); color: #fff; font: 700 10px/16px var(--ui); vertical-align: 1px; }
.ns-grid td.wk-hit { background: #EAF8FB !important; }
.ns-fig.big { font-size: 20px; font-weight: 600; }
.ns-wkp { border-color: #8FD3E0; }
.ns-wkp > .ns-pth { background: var(--wk-soft); border-color: #B2E4EE; }
.ns-wkp > .ns-pth b { color: var(--wk-ink); }
.ns-wks { font-size: 12.5px; color: var(--ns-dim); margin: 2px 0 8px; }
.ns-wkl li { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid #EDF0F3; }
.ns-wkl li.picked { background: #F4FCFD; }
.ns-wkr { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--wk); color: #fff; font-size: 11.5px; font-weight: 700; }
.ns-wkh { flex: 1; min-width: 0; display: flex; flex-direction: column; border: 0; background: none; padding: 0; text-align: left; }
.ns-wkh em { font-style: normal; font-size: 11px; color: var(--ns-dim); }
.ns-wkh b { font-size: 13px; font-weight: 600; color: var(--ns-ink); }
.ns-wkh:hover b { text-decoration: underline; }
.ns-wko { display: inline-flex; gap: 2px; }
.ns-wkall { margin-top: 8px; font-weight: 600; }
.ns-rl > .wk-banner, .ns-rep > .wk-banner { margin: 0 0 10px; }
.ns-docb > .wk-banner { flex: 0 1 300px; margin: 0; align-items: flex-start; }
.ns-cmt { flex: 0 1 280px; background: #fff; border: 1px solid var(--ns-line); border-radius: 3px; padding: 12px 14px; font-size: 13px; }
.ns-cmt p:first-child { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
.ns-cmt p:first-child span { color: var(--ns-dim); font-size: 12px; margin-left: auto; }
.ns-doc blockquote { border-left: 3px solid var(--wk); padding: 4px 12px; margin: 0 0 12px; color: #334155; }
.ns-exec { margin: 10px 0; }
.ns-kpi td.ns-wcell { min-width: 300px; }
.ns-wnote.hit span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ns-rli .ns-tag { white-space: nowrap; }
@media (max-width: 600px) {
  .ns-head { gap: 10px; padding: 0 10px; }
  .ns-search { flex: 0 0 auto; max-width: none; }
  .ns-search span, .ns-help, .ns-role { display: none; }
  .ns-page { padding: 10px 10px 30px; }
  .ns-kpi td:first-child { white-space: normal; min-width: 130px; }
  .ns-kpi td.ns-wcell { min-width: 200px; }
  .ns-dh { flex-direction: column; gap: 2px; }
  .ns-pha { display: none; }
}

/* THE CLEAN SCREENS
   Everything outside the two desks: the intro, the cards between scenes, the meeting as a
   video call, the result, the week (a dashboard with each plan's Slack channel) and the final
   score. Light, quiet, product-like. Amber is "on your own"; cyan is "with Wake". */

.wx.cl-root { background: #F6F7F9; color: #0F172A; color-scheme: light; font: 400 15px/1.5 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
.wx.cl-root.wake, .wx.cl-root.day { background: #F6F7F9; }
.wx .cl-screen, .wx .screen.cl-screen { --ink: #0F172A; --dim: #64748B; --line: #E2E8F0; --card: #fff; --y: #D97706; --y-soft: #FEF3C7; --y-ink: #92400E; --w: #0891B2; --w-soft: #CFFAFE; --w-ink: #155E75; --acc: #4F46E5;
  max-width: none; margin: 0; padding: 0; gap: 0; animation: none; display: block; min-height: 100vh; min-height: 100dvh; font: 400 15px/1.5 'Inter', system-ui, -apple-system, sans-serif; color: var(--ink); }
.wx .cl-screen * { text-transform: none; }
.wx .cl-screen :where(h1, h2, h3, p) { margin: 0; font: inherit; color: inherit; }
.wx .cl-screen button { font: inherit; cursor: pointer; }
.cl-mark { display: inline-block; flex: none; }
.cl-mark svg, .fm svg { width: 100%; height: 100%; display: block; }
.cl-muted { color: var(--dim); font-size: 13.5px; }
.cl-link { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 4px 0; color: var(--acc); font-weight: 500; font-size: 14px; text-decoration: none; }
.cl-link .gl { width: 16px; height: 16px; color: currentColor; display: inline-grid; }
.cl-link .gl svg { width: 100%; height: 100%; }

/* buttons */
.wx .cl-screen .cb { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 18px; border-radius: 10px; border: 1px solid var(--line); background: #fff; color: var(--ink); font: 600 14px/1.2 'Inter', system-ui, sans-serif; transition: background .12s, transform .08s, box-shadow .12s; }
.wx .cl-screen .cb:hover { background: #F1F5F9; }
.wx .cl-screen .cb:active { transform: translateY(1px); }
.wx .cl-screen .cb:disabled { opacity: .45; cursor: default; }
.wx .cl-screen .cb > span { display: inline-flex; align-items: center; gap: 6px; }
.wx .cl-screen .cb .gl { width: 18px; height: 18px; display: inline-grid; color: currentColor; }
.wx .cl-screen .cb .gl svg { width: 100%; height: 100%; }
.wx .cl-screen .cb.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
.wx .cl-screen .cb.primary:hover { background: #1E293B; }
.wx .cl-screen .cb.wake { background: var(--w); border-color: var(--w); color: #fff; }
.wx .cl-screen .cb.wake:hover { background: #0E7490; }
.wx .cl-screen .cb.meet { background: #0B57D0; border-color: #0B57D0; color: #fff; border-radius: 999px; }
.wx .cl-screen .cb.ghost { background: transparent; }
.wx .cl-screen .cb.big { padding: 14px 26px; font-size: 15.5px; border-radius: 12px; }
.wx .cl-screen .cb.small { padding: 7px 12px; font-size: 13px; }

/* ------------------------------------------------------------ intro */
.cl-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 28px; }
.cl-brand { display: inline-flex; align-items: center; gap: 10px; font-size: 15px; color: var(--dim); }
.cl-brand b { font-size: 18px; font-weight: 700; color: var(--ink); letter-spacing: -.01em; }
.cl-top-r { font-size: 13.5px; color: var(--dim); }
.cl-landing { background: radial-gradient(900px 500px at 85% -10%, #CFFAFE 0%, transparent 60%), radial-gradient(800px 500px at -10% 20%, #E0E7FF 0%, transparent 55%), #F6F7F9; display: flex !important; flex-direction: column; }
.cl-hero { max-width: 880px; margin: 0 auto; padding: 8vh 28px 40px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 18px; }
.cl-eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase !important; color: var(--w); }
.cl-hero h1 { font: 700 clamp(34px, 5.4vw, 60px)/1.06 'Inter', system-ui, sans-serif !important; letter-spacing: -.035em; color: var(--ink); }
.cl-hero h1 span { background: linear-gradient(90deg, #0891B2, #4F46E5); -webkit-background-clip: text; background-clip: text; color: transparent; }
.cl-lede { max-width: 640px; font-size: 17.5px; line-height: 1.6; color: #475569; }
.cl-cta { display: flex; align-items: center; gap: 14px; margin-top: 6px; }
.cl-steps { list-style: none; padding: 0 28px 40px; margin: 0 auto; max-width: 1100px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.cl-step { display: flex; gap: 12px; align-items: flex-start; padding: 18px; border-radius: 16px; background: rgba(255,255,255,.75); border: 1px solid var(--line); backdrop-filter: blur(8px); }
.cl-step b { font-size: 15px; }
.cl-step p { font-size: 13.5px; color: var(--dim); margin-top: 2px; }
.cl-sn { width: 28px; height: 28px; flex: none; border-radius: 8px; display: grid; place-items: center; font-weight: 700; font-size: 13px; background: #F1F5F9; color: var(--ink); }
.cl-step.y .cl-sn { background: var(--y-soft); color: var(--y-ink); }
.cl-step.w .cl-sn { background: var(--w-soft); color: var(--w-ink); }
.cl-foot { margin-top: auto; padding: 20px 28px; font-size: 13px; color: var(--dim); text-align: center; }
.cl-foot a { color: var(--dim); }

.cl-setup-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 28px; max-width: 1240px; margin: 0 auto; padding: 8px 28px 40px; align-items: start; }
.cl-choices h1 { font: 700 30px/1.2 'Inter', system-ui, sans-serif !important; letter-spacing: -.02em; margin-bottom: 18px; }
.cl-q { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; margin: 20px 0 10px; }
.cl-q span { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: #fff; font-size: 12px; }
.cl-grid.five { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.cl-opt { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; text-align: left; padding: 14px; border-radius: 14px; border: 1.5px solid var(--line); background: #fff; color: var(--ink); min-height: 132px; transition: border-color .12s, box-shadow .12s; }
.cl-opt:hover { border-color: #CBD5E1; box-shadow: 0 4px 14px rgba(15,23,42,.06); }
.cl-opt.on { border-color: var(--acc); box-shadow: 0 0 0 3px #E0E7FF; }
.cl-oi { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: #F1F5F9; color: #334155; padding: 7px; }
.cl-oi svg { width: 100%; height: 100%; }
.cl-opt.on .cl-oi { background: #EEF2FF; color: var(--acc); }
.cl-opt b { font-size: 14px; line-height: 1.25; }
.cl-opt > span:last-child { font-size: 12.5px; color: var(--dim); line-height: 1.35; }
.cl-side { position: sticky; top: 16px; display: flex; flex-direction: column; gap: 14px; }
.cl-preview { padding: 22px; border-radius: 18px; background: #fff; border: 1px solid var(--line); box-shadow: 0 10px 30px rgba(15,23,42,.06); display: flex; flex-direction: column; gap: 8px; }
.cl-pk { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase !important; color: var(--dim); }
.cl-ph { font: 700 22px/1.25 'Inter', system-ui, sans-serif; letter-spacing: -.01em; }

.cl-side .cb.big { width: 100%; }

/* the lock screen */

.ls-wall { position: absolute; inset: 0; z-index: 0; background: radial-gradient(1200px 700px at 20% 10%, #3A4E86 0%, transparent 60%), radial-gradient(900px 600px at 85% 90%, #7B4D86 0%, transparent 60%), linear-gradient(160deg, #1E2A4A, #2C2147 60%, #171A2C); }

.ls-top { display: flex; flex-direction: column; align-items: center; gap: 0; margin-top: 7vh; }

.wx .cl-screen .cb.ls-go { margin: 20px 0 40px; background: rgba(255,255,255,.95); color: #0F172A; border-color: transparent; border-radius: 999px; }

/* ------------------------------------------------------------ cards between scenes */
.cl-inter, .cl-trans { display: grid !important; place-items: center; padding: 24px; background: radial-gradient(900px 500px at 85% -10%, #CFFAFE 0%, transparent 60%), radial-gradient(800px 500px at -10% 20%, #E0E7FF 0%, transparent 55%), #F6F7F9; }
.cl-inter.night { background: radial-gradient(900px 600px at 70% 0%, #312E81 0%, transparent 60%), #0B1020; color: #E2E8F0; }
.ci-card { width: min(620px, 100%); padding: 36px; border-radius: 24px; background: #fff; border: 1px solid var(--line); box-shadow: 0 30px 80px rgba(15,23,42,.12); display: flex; flex-direction: column; align-items: flex-start; gap: 14px; }
.ci-card.wide { width: min(860px, 100%); }
.cl-inter.night .ci-card { background: rgba(15,23,42,.7); border-color: #1E293B; color: #E2E8F0; }

.cl-inter.night .ci-l { color: #CBD5E1; }
.ci-l.dim { color: var(--dim); font-size: 14.5px; }
.ci-card .cb.big { margin-top: 8px; }
.ct-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; margin: 6px 0; }
.ct-stat { padding: 14px; border-radius: 14px; background: #F8FAFC; border: 1px solid var(--line); display: flex; flex-direction: column; }
.ct-stat b { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.ct-stat span { font-size: 12.5px; color: var(--dim); }
.ct-clock { font: 700 clamp(48px, 8vw, 80px)/1 'Inter', system-ui, sans-serif; letter-spacing: -.03em; font-variant-numeric: tabular-nums; color: var(--ink); transition: color .2s; }
.rewinding .ct-clock { color: var(--w); }
.ct-lines { display: flex; flex-direction: column; gap: 10px; }
.ct-first { font-size: 18px; font-weight: 600; }
.ct-lines .ci-l { animation: lsIn .35s ease-out; }
.sc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; width: 100%; }
.sc-sys { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
.sc-sys li { display: flex; justify-content: space-between; gap: 10px; padding: 8px 12px; border-radius: 10px; background: #F8FAFC; font-size: 14px; opacity: .35; transition: opacity .2s; }

.sc-sys li b { font-weight: 500; color: var(--dim); font-variant-numeric: tabular-nums; }

.sc-f span { font-size: 14px; }

/* Google Meet: ready to join */
.cl-join { background: #fff; display: flex !important; flex-direction: column; font-family: 'Roboto', 'Inter', system-ui, sans-serif !important; }
.mj-top { display: flex; align-items: center; gap: 8px; padding: 16px 24px; font-size: 20px; color: #444746; }
.mj-logo { width: 34px; height: 34px; }
.mj-logo svg { width: 100%; height: 100%; }
.mj-top b { font-weight: 400; }
.mj-co { margin-left: auto; font-size: 14px; color: #5F6368; }
.mj-grid { flex: 1; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 40px; align-items: center; max-width: 1180px; width: 100%; margin: 0 auto; padding: 20px 28px 60px; }
.mj-cam { position: relative; aspect-ratio: 16 / 10; border-radius: 14px; background: #202124; display: grid; place-items: center; overflow: hidden; }
.mj-name { position: absolute; left: 16px; top: 14px; color: #fff; font-size: 14px; }

.mj-ps { display: flex; }
.mj-ps .face { border: 2px solid #fff; margin-left: -6px; }
.mj-title { font-weight: 500; font-size: 15px; color: #1F1F1F; }
.mj-l { font-size: 14px; color: #444746; max-width: 400px; line-height: 1.55; }

/* ------------------------------------------------------------ the meeting, as a video call */
.wx .cl-screen.mt { background: #202124; color: #E8EAED; display: flex !important; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; font-family: 'Roboto', 'Inter', system-ui, sans-serif; }
.mt-main { flex: 1; min-height: 0; display: flex; gap: 12px; padding: 12px 12px 0; }
.mt-stage { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.mt-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.mt-tag { font-size: 12.5px; font-weight: 600; padding: 5px 10px; border-radius: 999px; background: #FEF3C7; color: #92400E; }
.mt-tag.wake { background: #CFFAFE; color: #155E75; }
.mt-agenda { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: #9AA0A6; }

.mt-cnt.owed b { color: #FDD663; }
.mt-cnt.dec b { color: #81C995; }
.mt-cnt.bump { animation: bump .4s ease-out; }
@keyframes bump { 40% { transform: scale(1.12); } }
.mt-view { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(0, 1fr); gap: 10px; }
.mt-scr { display: flex; flex-direction: column; border-radius: 12px; background: #fff; color: #1F1F1F; overflow: hidden; min-height: 0; }
.mt-scr-bar { display: flex; align-items: center; gap: 8px; padding: 8px 14px; background: #F1F3F4; font-size: 12.5px; color: #5F6368; }

.mt-scr-bar span:last-child { margin-left: auto; }
.fm.sm { width: 18px; height: 18px; display: inline-block; }
.mt-scr-body { flex: 1; overflow: auto; padding: 28px 32px; display: flex; flex-direction: column; gap: 12px; }
.mt-scr-body h2 { font: 600 clamp(20px, 2.2vw, 28px)/1.25 'Inter', system-ui, sans-serif !important; letter-spacing: -.015em; color: #0F172A; }
.mt-sn { font-size: 13px; font-weight: 600; color: #64748B; }
.mt-sq { font-size: 17px; color: #334155; line-height: 1.55; }
.mt-sm, .mt-src { font-size: 13.5px; color: #64748B; }
.mt-sdo { display: flex; gap: 10px; align-items: baseline; padding: 12px 14px; border-radius: 10px; background: #ECFEFF; font-size: 16px; color: #0F172A; }
.mt-sdo b { font-size: 12px; color: #0E7490; flex: none; }
.mt-tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(84px, 1fr); gap: 8px; min-height: 0; overflow: auto; }
.mt-tile { position: relative; border-radius: 10px; background: #3C4043; display: grid; place-items: center; transition: box-shadow .15s; }
.mt-tile.me { background: #4A4D51; }
.mt-av .face { box-shadow: 0 2px 8px rgba(0,0,0,.25); }
.mt-tile .face { width: 52px !important; height: 52px !important; font-size: 20px !important; }
.mt-nm { position: absolute; left: 8px; bottom: 6px; font-size: 12px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: calc(100% - 34px); }
.mt-mic { position: absolute; right: 6px; top: 6px; width: 22px; height: 22px; border-radius: 50%; background: rgba(32,33,36,.6); font-size: 11px; display: grid; place-items: center; opacity: .6; }
.mt-tile.talk { box-shadow: inset 0 0 0 3px #8AB4F8; }
.mt-tile.talk .mt-mic { background: #1A73E8; opacity: 1; }
.mt-tile.out { opacity: .35; }
.mt-tile.out::after { content: 'Left the call'; position: absolute; top: 6px; left: 8px; font-size: 11px; color: #E8EAED; }
.mt-panel { width: 380px; flex: none; display: flex; flex-direction: column; border-radius: 12px; background: #fff; color: #1F1F1F; overflow: hidden; margin-bottom: 0; }
.mt-ph { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid #E8EAED; font-size: 13px; color: #5F6368; }
.mt-ph b { font-size: 16px; font-weight: 500; color: #1F1F1F; }
.mt-log { flex: 1; min-height: 0; overflow: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.mt-msg { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; animation: lsIn .25s ease-out; }
.mt-msg > div { min-width: 0; }
.mt-msg b { font-size: 13px; font-weight: 600; }
.mt-msg p { color: #3C4043; line-height: 1.45; }
.mt-msg .fm.wk { width: 28px; height: 28px; flex: none; display: inline-block; }
.mt-msg.q p { color: #1F1F1F; font-weight: 500; }
.mt-msg.me > div, .mt-msg.pres > div { padding: 8px 12px; border-radius: 12px; background: #F1F3F4; }
.mt-msg.ok p { color: #137333; }
.mt-msg.wake > div { padding: 8px 12px; border-radius: 12px; background: #ECFEFF; }
.mt-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.mt-chips span { font-size: 11.5px; padding: 3px 8px; border-radius: 6px; background: #fff; border: 1px solid #A5F3FC; color: #155E75; }
.mt-iou { display: flex; gap: 8px; align-items: baseline; padding: 8px 12px; border-radius: 10px; background: #FEF7E0; font-size: 13px; color: #5F4300; }
.mt-iou b { font-size: 11.5px; font-weight: 700; color: #B06000; flex: none; }
.mt-stamp { display: flex; flex-direction: column; gap: 2px; padding: 8px 12px; border-radius: 10px; border-left: 4px solid #188038; background: #E6F4EA; font-size: 13px; }
.mt-stamp b { font-size: 13px; color: #137333; }
.mt-stamp span { color: #3C4043; }
.mt-stamp.s-guess, .mt-stamp.s-pilot { border-color: #F9AB00; background: #FEF7E0; } .mt-stamp.s-guess b, .mt-stamp.s-pilot b { color: #B06000; }

.mt-stamp.s-dropped { border-color: #D93025; background: #FCE8E6; } .mt-stamp.s-dropped b { color: #A50E0E; }
.mt-hint { font-size: 12.5px; color: #5F6368; text-align: center; padding: 4px; }
.mt-choices { border-top: 1px solid #E8EAED; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; max-height: 48%; overflow: auto; }
.mt-choices:empty { display: none; }
.mt-ask { font-size: 12px; font-weight: 600; color: #5F6368; }
.mt-opt { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; text-align: left; padding: 10px 12px; border-radius: 10px; border: 1px solid #DADCE0; background: #fff; color: #1F1F1F; font-size: 13.5px; }
.mt-opt:hover { background: #F1F3F4; border-color: #BDC1C6; }
.mt-opt i { grid-row: 1 / 3; width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-style: normal; font-size: 11.5px; font-weight: 700; background: #E8EAED; color: #3C4043; }

.mt-opt.ev i { background: #CEEAD6; color: #137333; }
.mt-ctl2 { display: flex; gap: 8px; padding: 0 12px 10px; }
.mt-ctl2:empty { display: none; }
.mt-done { display: flex; flex-direction: column; gap: 10px; padding: 4px 2px; }
.mt-dk { font-size: 12.5px; font-weight: 600; color: #5F6368; }
.mt-drow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.mt-drow div { padding: 8px; border-radius: 10px; background: #F1F3F4; display: flex; flex-direction: column; }

.mt-bar { flex: none; height: 72px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 20px; color: #E8EAED; }
.mt-bl { display: flex; align-items: center; gap: 10px; font-size: 15px; white-space: nowrap; overflow: hidden; }
.mt-bl b { font-weight: 500; font-variant-numeric: tabular-nums; }
.mt-bl i { width: 1px; height: 16px; background: #5F6368; }
.mt-bc { display: flex; gap: 10px; }
.mt-b { width: 42px; height: 42px; border-radius: 50%; background: #3C4043; display: grid; place-items: center; font-size: 15px; color: #E8EAED; }
.mt-b .gl { width: 20px; height: 20px; display: inline-grid; color: #E8EAED; }

.mt-b.on { background: #8AB4F8; color: #202124; }

/* ------------------------------------------------------------ result, week, final: report pages */
.rs, .wd, .fs2 { background: #F6F7F9 !important; }
.rs-page { max-width: 1040px; margin: 0 auto; padding: 36px 24px 60px; display: flex; flex-direction: column; gap: 16px; }
.rs-page.wide { max-width: 1240px; }
.rs-k { font-size: 13px; font-weight: 600; color: var(--dim); letter-spacing: .02em; }
.rs-page > h1, .wd-head h1 { font: 700 clamp(26px, 3.4vw, 36px)/1.15 'Inter', system-ui, sans-serif !important; letter-spacing: -.02em; }
.rs-card { padding: 20px 22px; border-radius: 18px; background: #fff; border: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
.rs-card h2 { font: 650 17px/1.3 'Inter', system-ui, sans-serif !important; }
.rs-card.y { border-top: 4px solid var(--y); } .rs-card.w { border-top: 4px solid var(--w); }
.rs-sub { font-size: 13.5px; color: var(--dim); }
.rs-tlrow { display: grid; grid-template-columns: 150px 1fr; gap: 12px; align-items: center; }

.rs-tlk.y { color: var(--y); } .rs-tlk.w { color: var(--w); }

.rs-tl { display: flex; height: 34px; border-radius: 8px; overflow: hidden; background: #F1F5F9; }
.rs-tl .seg { display: grid; place-items: center; font-style: normal; font-size: 12px; font-weight: 600; color: #fff; border-right: 2px solid #fff; min-width: 2px; }
.rs-tl .seg span { overflow: hidden; }
.seg.open { background: #E2E8F0; color: transparent; }
.seg.decided { background: #16A34A; } .seg.guess, .seg.pilot { background: #F59E0B; } .seg.agreed { background: #3B82F6; }
.seg.parked, .seg.next, .seg.busy { background: #94A3B8; } .seg.dropped { background: #EF4444; }
.rs-axis { position: relative; height: 18px; }
.rs-axis span { position: absolute; transform: translateX(-50%); font-size: 11.5px; color: var(--dim); }
.rs-legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--dim); }
.rs-legend span { display: inline-flex; align-items: center; gap: 6px; }
.rs-legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.rs-legend .decided i { background: #16A34A; } .rs-legend .guess i { background: #F59E0B; } .rs-legend .agreed i { background: #3B82F6; } .rs-legend .parked i { background: #94A3B8; } .rs-legend .dropped i { background: #EF4444; }
.rs-duel, .wd-board, .wd-probs, .wd-small, .fs2-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.rs-duel th, .rs-duel td, .wd-board th, .wd-board td, .wd-probs th, .wd-probs td, .wd-small th, .wd-small td, .fs2-table th, .fs2-table td { padding: 10px 12px; border-bottom: 1px solid #F1F5F9; text-align: left; vertical-align: middle; }
.rs-duel thead th, .wd-board thead th, .wd-probs thead th, .fs2-table thead th { font-size: 12.5px; font-weight: 600; color: var(--dim); }
thead th.y { color: var(--y) !important; } thead th.w { color: var(--w) !important; }
.rs-duel tbody th, .fs2-table tbody th { font-weight: 500; }
.rs-duel th small { display: block; font-size: 12px; color: var(--dim); font-weight: 400; }
.rs-duel td { font-weight: 600; font-variant-numeric: tabular-nums; }

.lv-t b { color: #fff; font-size: 15px; }
.lv-t p { color: #CBD5E1; font-size: 13.5px; line-height: 1.5; }
.lv-i { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: rgba(34,211,238,.14); }
.lv-i .gl { width: 17px; height: 17px; display: inline-grid; color: #67E8F9; }
.lv-i .gl svg { width: 100%; height: 100%; }

/* THE WORLD
   The title screen, the setup questions, the office scenes and the step cards. Quiet on purpose:
   one dark neutral, one text color, a single white button for the next step, no glows. */

.wx.sc-root { background: #0B0C0F; color: #E8EAED; color-scheme: dark; font: 400 16px/1.5 'Inter', system-ui, sans-serif; }
.wx .sc-screen { --bg: #0B0C0F; --surface: #141519; --line: #26282E; --line2: #3A3D45; --ink: #E8EAED; --dim: #9AA0A6; --faint: #6B7078;
  --cy: #22D3EE; --ind: #6366F1; --px: 'Press Start 2P', 'Courier New', monospace; --disp: 'Space Grotesk', 'Inter', system-ui, sans-serif;
  position: relative; width: 100%; height: 100vh; height: 100dvh; overflow: hidden; margin: 0; padding: 0; color: var(--ink); }
.wx .sc-screen * { text-transform: none; }
:where(.wx .sc-screen) :where(h1, h2, p, dl, dd) { margin: 0; font: inherit; color: inherit; }
.wx .sc-screen button { font: inherit; cursor: pointer; }

.sc-layer { position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: flex-start; padding: 32px; pointer-events: none; }
.sc-layer.dim::before { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(8,9,12,.7) 0%, rgba(8,9,12,.3) 40%, rgba(8,9,12,0) 62%); opacity: 0; transition: opacity .5s; }
.sc-layer.show::before { opacity: 1; }
.sc-layer > .mc { pointer-events: auto; position: relative; }

/* ------------------------------------------------------------ the pixel office */
.px-scene { background: #0B0A14; opacity: 0; transition: opacity .5s ease; }
.px-scene.in { opacity: 1; }
.px-map { position: absolute; inset: 0; }
.px-canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
.px-map::after { content: ''; position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 140px rgba(5,4,14,.55); }
.px-hud { position: absolute; top: 16px; left: 16px; right: 16px; display: flex; align-items: center; gap: 8px; pointer-events: none; }
.px-chip { padding: 7px 12px; border-radius: 8px; background: rgba(11,12,15,.86); border: 1px solid var(--line); font: 500 13px/1 'Inter', sans-serif; color: var(--dim); }
.px-chip b { color: var(--ink); font-weight: 600; }
.px-chip.co { color: var(--ink); }
.wx .sc-screen .px-skip { margin-left: auto; pointer-events: auto; padding: 7px 12px; border-radius: 8px; background: rgba(11,12,15,.86); border: 1px solid var(--line); font: 500 13px/1 'Inter', sans-serif; color: var(--ink); }

/* ------------------------------------------------------------ the step card */
.mc { width: min(520px, 100%); padding: 22px 24px 20px; border-radius: 14px; background: rgba(20,21,25,.97); border: 1px solid var(--line); box-shadow: 0 24px 60px rgba(0,0,0,.45);
  display: flex; flex-direction: column; gap: 14px; animation: mcIn .4s cubic-bezier(.2,.8,.2,1) both; }
@keyframes mcIn { from { opacity: 0; transform: translateY(10px); } }
.mc-steps { display: flex; gap: 4px; }
.mc-steps span { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.mc-steps span::before { content: ''; height: 2px; border-radius: 1px; background: var(--line2); }
.mc-steps span.done::before { background: var(--dim); }
.mc-steps span.on::before { background: var(--ink); }
.mc-steps i { display: none; }
.mc-steps b { font: 500 11px/1.2 'Inter', sans-serif; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mc-steps .on b { color: var(--ink); } .mc-steps .done b { color: var(--dim); }
.mc-k { font: 500 12.5px/1.4 'Inter', sans-serif; color: var(--dim); }
.mc h1 { font: 650 26px/1.2 'Inter', sans-serif; letter-spacing: -.015em; color: #fff; }
.mc-row { display: flex; flex-direction: column; gap: 3px; }
.mc-l { font: 600 11px/1.3 'Inter', sans-serif; letter-spacing: .06em; text-transform: uppercase !important; color: var(--faint); }
.mc-row p:last-child { font-size: 15px; line-height: 1.55; color: #D4D7DC; }
.mc-go { display: flex; align-items: center; gap: 12px; margin-top: 4px; }
.mc-key { font: 500 12px/1 'Inter', sans-serif; color: var(--faint); padding: 4px 7px; border-radius: 5px; border: 1px solid var(--line2); }
.mc-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.mc-stat { padding: 10px 12px; border-radius: 10px; background: rgba(255,255,255,.03); border: 1px solid var(--line); display: flex; flex-direction: column; }
.mc-stat b { font: 650 20px/1.25 'Inter', sans-serif; color: #fff; }
.mc-stat span { font-size: 12px; color: var(--dim); }
.mc-clock { font: 650 56px/1 'Inter', sans-serif; letter-spacing: -.03em; color: #fff; font-variant-numeric: tabular-nums; }

/* buttons: one white button for the next step, quiet outlines for the rest */
.wx .sc-screen .ab { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 20px; border-radius: 10px; border: 1px solid var(--line2); background: transparent; color: var(--ink); font: 600 15px/1 'Inter', sans-serif; transition: background .12s, transform .08s; }
.wx .sc-screen .ab:hover { background: rgba(255,255,255,.06); }
.wx .sc-screen .ab:active { transform: translateY(1px); }
.wx .sc-screen .ab:disabled { opacity: .4; cursor: default; }
.wx .sc-screen .ab.primary { border-color: #fff; background: #fff; color: #0B0C0F; }
.wx .sc-screen .ab.primary:hover { background: #E3E5E8; }
.wx .sc-screen .ab.ghost { background: transparent; }
.wx .sc-screen .ab.small { padding: 8px 12px; font-size: 13px; }
.wx .sc-screen .ab.big { padding: 14px 24px; font-size: 16px; }
.wx .sc-screen .ab:focus-visible, .wx .sc-screen .su-row:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

/* ------------------------------------------------------------ the title screen */
.ti { background: #0B0A14; opacity: 0; transition: opacity .6s ease; }
.ti.in { opacity: 1; }
.ti .px-map::after { background: linear-gradient(90deg, rgba(11,12,15,.97) 0%, rgba(11,12,15,.94) 34%, rgba(11,12,15,.55) 56%, rgba(11,12,15,.18) 100%); box-shadow: none; }
.ti-body { position: absolute; left: 0; top: 0; bottom: 0; width: min(560px, 100%); padding: 0 56px; display: flex; flex-direction: column; justify-content: center; gap: 16px; }
.ti-brand { font: 700 18px/1 'Inter', sans-serif; letter-spacing: -.01em; color: #fff; margin-bottom: 8px; }
.ti-body h1 { font: 650 44px/1.1 'Inter', sans-serif; letter-spacing: -.025em; color: #fff; }
.ti-body p { font-size: 17px; line-height: 1.55; color: var(--dim); max-width: 40ch; }
.ti-body .su-go { margin-top: 12px; }
@media (max-width: 820px) {
  .ti .px-map::after { background: linear-gradient(0deg, rgba(11,12,15,.98) 0%, rgba(11,12,15,.95) 48%, rgba(11,12,15,.35) 75%, rgba(11,12,15,.15) 100%); }
  .ti-body { top: auto; padding: 0 20px 40px; justify-content: flex-end; }
  .ti-body h1 { font-size: 32px; }
}

/* ------------------------------------------------------------ setup: three short questions */
.su { display: flex; flex-direction: column; overflow: auto !important; background: var(--bg); animation: suIn .3s ease both; }
@keyframes suIn { from { opacity: 0; } }
.su-top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; padding: 20px 28px; border-bottom: 1px solid var(--line); }
.su-brand { font: 700 17px/1 'Inter', sans-serif; letter-spacing: -.01em; }
.su-prog { display: flex; flex-direction: column; align-items: center; gap: 7px; font-size: 12.5px; color: var(--dim); }
.su-prog i { display: flex; gap: 4px; }
.su-prog em { width: 44px; height: 3px; border-radius: 2px; background: var(--line2); }
.su-prog em.on { background: var(--ink); }
.wx .sc-screen .su-back { justify-self: end; border: 0; background: none; color: var(--dim); font-size: 14px; padding: 6px 4px; }
.wx .sc-screen .su-back:hover { color: var(--ink); }
.su-body { width: 100%; max-width: 620px; margin: 0 auto; padding: 8vh 24px 64px; display: flex; flex-direction: column; gap: 14px; }
.su-body h1 { font: 650 32px/1.2 'Inter', sans-serif; letter-spacing: -.02em; color: #fff; }
.su-sub { font-size: 16px; line-height: 1.55; color: var(--dim); margin-bottom: 12px; }
.su-list { display: flex; flex-direction: column; gap: 8px; }
.wx .sc-screen .su-row { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 16px 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); transition: border-color .12s, background .12s; }
.wx .sc-screen .su-row:hover, .wx .sc-screen .su-row:focus-visible { border-color: var(--line2); background: #191A1F; }
.su-rt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.su-rt b { font-size: 16px; font-weight: 600; color: #fff; display: flex; align-items: center; gap: 8px; }
.su-rt b small { font-size: 11.5px; font-weight: 600; color: var(--ink); padding: 2px 7px; border-radius: 999px; border: 1px solid var(--line2); }
.su-rt > span { font-size: 14px; color: var(--dim); line-height: 1.45; }
.su-row em { font-style: normal; font-size: 13.5px; color: var(--dim); white-space: nowrap; }
.su-row > i { font-style: normal; color: var(--faint); transition: transform .12s, color .12s; }
.su-row:hover > i { color: var(--ink); transform: translateX(2px); }
.su-card { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
.su-co { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.su-co b { font: 650 22px/1.25 'Inter', sans-serif; color: #fff; }
.wx .sc-screen .su-link { border: 0; background: none; padding: 0; color: var(--dim); font-size: 13.5px; text-decoration: underline; text-underline-offset: 3px; }
.wx .sc-screen .su-link:hover { color: var(--ink); }
.su-card dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 24px; font-size: 14.5px; }
.su-card dt { color: var(--dim); }
.su-card dd { color: var(--ink); }
.su-q { font-size: 15px; font-weight: 600; color: #fff; margin-top: 14px; }
.su-how { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 15px; color: var(--dim); }
.su-how li::marker { color: var(--faint); }
.su-go { display: flex; align-items: center; gap: 12px; margin-top: 10px; }

@media (max-width: 820px) {
  .sc-layer { padding: 12px; align-items: flex-end; justify-content: center; }
  .sc-layer.dim::before { background: linear-gradient(0deg, rgba(8,9,12,.85) 0%, rgba(8,9,12,.45) 55%, rgba(8,9,12,0) 85%); }
  .mc { padding: 18px; gap: 10px; }
  .mc h1 { font-size: 22px; }
  .mc-steps b { display: none; }
  .mc-row p:last-child { font-size: 14.5px; }
  .mc-stat b { font-size: 16px; }
  .mc-stat span { font-size: 11.5px; }
  .su-top { padding: 14px 16px; grid-template-columns: auto 1fr auto; }
  .su-prog em { width: 28px; }
  .su-body { padding: 28px 16px 48px; }
  .su-body h1 { font-size: 26px; }
  .px-hud { top: 10px; left: 10px; right: 10px; }
  .px-chip.co { display: none; }
}

/* ------------------------------------------------------------ Wake at work, between the rounds */
.ww { display: flex; flex-direction: column; background: radial-gradient(ellipse at 50% 48%, #0E2A33 0%, #0B0C0F 62%); }
.ww-top { display: grid; grid-template-columns: 1fr; justify-items: center; gap: 8px; padding: 30px 24px 0; text-align: center; position: relative; }
.ww-k { font: 500 12.5px/1 'Inter', sans-serif; color: var(--dim); letter-spacing: .02em; }
.ww-cap { font: 600 clamp(19px, 2.3vw, 26px)/1.3 var(--disp); color: var(--ink); max-width: 30ch; min-height: 2.6em; }
.ww-cap.in { animation: wwIn .45s ease both; }
@keyframes wwIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.wx .sc-screen .ww-skip { position: absolute; right: 24px; top: 24px; padding: 7px 12px; border-radius: 8px; background: transparent; border: 1px solid var(--line2); font: 500 13px/1 'Inter', sans-serif; color: var(--dim); }
.ww-stage { flex: 1; min-height: 0; position: relative; }
.ww-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.ww-ln { stroke: #22D3EE; stroke-width: 1; opacity: 0; transition: opacity .5s; }
.ww-ln.on { opacity: .28; }
.ww-node rect { fill: #141519; stroke: #2B2E36; transition: fill .4s, stroke .4s; }
.ww-node text { font: 500 12.5px 'Inter', sans-serif; fill: #6B7078; transition: fill .4s; }
.ww-node .ww-sub { font-size: 10px; fill: #4B5058; }
.ww-node { opacity: .35; transition: opacity .5s; }
.ww-node.on { opacity: 1; }
.ww-node.live.on rect { fill: #0F2E36; stroke: #22D3EE; }
.ww-node.live.on text { fill: #E8EAED; }
.ww-node.live.on .ww-sub { fill: #67E8F9; }
.ww-node.far.on { opacity: .55; }
.ww-dot { fill: #67E8F9; }
.ww-core { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 104px; height: 104px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: #0B0C0F; border: 1.5px solid #22D3EE; box-shadow: 0 0 0 8px rgba(34,211,238,.06), 0 0 50px rgba(34,211,238,.25); font: 600 13px/1 'Inter', sans-serif; color: #E8EAED; }
.ww-core.pulse { animation: wwPulse .35s ease-out; }
.ww-core.done { box-shadow: 0 0 0 10px rgba(34,211,238,.1), 0 0 80px rgba(34,211,238,.4); }
@keyframes wwPulse { from { box-shadow: 0 0 0 14px rgba(34,211,238,.16), 0 0 60px rgba(34,211,238,.35); } }
.ww-logo { width: 38px; height: 38px; }
.ww-stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; width: min(980px, calc(100% - 32px)); margin: 0 auto; }
.ww-st { padding: 12px 14px; border-radius: 12px; background: rgba(20,21,25,.9); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; opacity: .35; transition: opacity .4s, border-color .4s; }
.ww-st.on { opacity: 1; }
.ww-st:last-child.on { border-color: #22D3EE; }
.ww-st b { font: 600 clamp(20px, 2.4vw, 28px)/1 var(--disp); font-variant-numeric: tabular-nums; color: var(--ink); }
.ww-st span { font: 500 12px/1.3 'Inter', sans-serif; color: var(--dim); }
.ww-foot { display: flex; justify-content: center; padding: 18px 16px 28px; min-height: 84px; }
@media (max-width: 760px) { .ww-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .ww-stats .ww-st:last-child { grid-column: 1 / -1; } }
.mc-wake { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: rgba(34,211,238,.08); border: 1px solid rgba(34,211,238,.28); }
.mc-wake .mc-l { color: #67E8F9; }
.mc-wake p:last-child { font-size: 14px; line-height: 1.5; color: #CFFAFE; }
.wx .sc-screen .mc-wk { width: 22px; height: 22px; flex: none; margin-top: 2px; }

/* ------------------------------------------------------------ the intro (about 30 seconds) */
.it { display: flex; flex-direction: column; background: radial-gradient(ellipse at 50% 40%, #13202B 0%, #0B0C0F 65%); }
.it-stage { position: relative; flex: 1; min-height: 0; }
.it-stage > div { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; transition: opacity .7s ease; pointer-events: none; }
.it[data-scene="open"] .it-open, .it[data-scene="wall"] .it-board, .it[data-scene="dig"] .it-board, .it[data-scene="wake"] .it-board, .it[data-scene="meet"] .it-meet, .it[data-scene="end"] .it-end { opacity: 1; }
.it-open p { font: 500 16px/1.4 'Inter', sans-serif; color: var(--dim); text-align: center; }
.it-open .it-clock { font: 700 clamp(64px, 11vw, 140px)/1 var(--disp); letter-spacing: -.03em; color: var(--ink); transform: translateY(8px); opacity: 0; transition: all .9s ease .2s; }
.it.go .it-open .it-clock { transform: none; opacity: 1; }
.it-open .it-sub { max-width: 36ch; margin-top: 18px; font-size: 18px; color: #C9CDD6; opacity: 0; transition: opacity .8s ease 1.4s; }
.it.go .it-open .it-sub { opacity: 1; }
.it-board { padding: 72px 24px 12px; }
.it-wall { position: relative; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; width: min(920px, 92vw); }
.it-tile { height: clamp(44px, 8vh, 72px); border-radius: 6px; background: #161A22; border: 1px solid #262B36; padding: 6px; display: flex; flex-direction: column; gap: 4px; opacity: 0; transform: scale(.9); transition: opacity .35s, transform .9s cubic-bezier(.6,.05,.3,1), border-color .2s, background .2s; }
.it-tile.on { opacity: 1; transform: none; }
.it-tile.gone { opacity: 0; }
.it-tile.hot { border-color: #FFD23F; background: #2A2614; }
.it-tl { display: block; width: 60%; height: 4px; border-radius: 2px; background: #333A48; }
.it-bars { flex: 1; display: flex; align-items: flex-end; gap: 3px; }
.it-bars i { flex: 1; border-radius: 1px; opacity: .8; }
.it-fig { font: 600 clamp(11px, 1.3vw, 15px)/1 'Inter', sans-serif; color: #C9CDD6; margin-top: auto; }
.it-cur { position: absolute; left: 0; top: 0; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; border: 2px solid #FFD23F; opacity: 0; transition: transform .3s ease, opacity .3s; }
.it[data-scene="dig"] .it-cur { opacity: 1; }
.it-board { position: absolute; }
.it-counts { position: absolute; top: 24px; left: 0; right: 0; display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; }
.it-counts span { font: 500 12.5px/1 'Inter', sans-serif; color: #C9CDD6; padding: 7px 10px; border-radius: 999px; border: 1px solid #2B2E36; background: rgba(20,21,25,.9); }
.it[data-scene="wake"] .it-counts { opacity: 0; transition: opacity .4s; }
.it-mini { position: absolute; top: 24px; right: 24px; font: 600 14px/1 'Inter', sans-serif; color: #FFD23F; opacity: 0; transition: opacity .3s; }
.it[data-scene="dig"] .it-mini { opacity: 1; }
.it-core { position: absolute; left: 50%; top: 50%; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: #0B0C0F; border: 1.5px solid #22D3EE; box-shadow: 0 0 60px rgba(34,211,238,.35); font: 600 13px/1 'Inter', sans-serif; color: var(--ink); opacity: 0; transform: scale(.6); transition: opacity .5s, transform .6s, top .8s ease; }
.it[data-scene="wake"] .it-core { opacity: 1; transform: none; }
.it.cards .it-core { top: 16%; transform: scale(.7); }
.it-logo { width: 40px; height: 40px; }
.it-cards { position: absolute; left: 50%; top: 30%; width: min(640px, 92vw); transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; }
.it-cards li { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 12px; background: #F8FAFC; color: #0F172A; opacity: 0; transform: translateY(14px); transition: opacity .45s, transform .45s; }
.it.cards .it-cards li { opacity: 1; transform: none; }
.it-cards em { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: #0891B2; color: #fff; font: 700 12px/1 'Inter', sans-serif; font-style: normal; }
.it-cards div { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.it-cards small { font: 500 11.5px/1 'Inter', sans-serif; color: #64748B; }
.it-cards b { font: 600 14.5px/1.3 'Inter', sans-serif; }
.it-who { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: #6366F1; color: #fff; font: 600 11px/1 'Inter', sans-serif; }
.it-meet { gap: 10px; padding: 0 24px; }
.it-row { width: min(680px, 92vw); display: grid; grid-template-columns: 120px 1fr auto; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; background: #141519; border: 1px solid #26282E; opacity: 0; transform: translateX(-16px); transition: opacity .45s, transform .45s; }
.it[data-scene="meet"] .it-row { opacity: 1; transform: none; }
.it-row span { font: 500 12.5px/1.2 'Inter', sans-serif; color: var(--dim); }
.it-row b { font: 500 14px/1.35 'Inter', sans-serif; color: var(--ink); }
.it-row em { font: 700 12px/1 'Inter', sans-serif; font-style: normal; color: #0B3B1E; background: #81C995; padding: 6px 9px; border-radius: 6px; }
.it-stat { margin-top: 8px; font: 500 15px/1.4 'Inter', sans-serif; color: #C9CDD6; opacity: 0; transition: opacity .5s 2s; }
.it[data-scene="meet"] .it-stat { opacity: 1; }
.it-stat b { color: #fff; }
.it-end { gap: 18px; text-align: center; }
.it-end h1 { display: flex; flex-direction: column; font: 700 clamp(34px, 6vw, 72px)/1.08 var(--disp); letter-spacing: -.02em; }
.it-end h1 span { opacity: 0; transform: translateY(10px); transition: opacity .6s, transform .6s; }
.it[data-scene="end"] .it-end h1 span { opacity: 1; transform: none; }
.it-end h1 span:nth-child(2) { transition-delay: .6s; } .it-end h1 span:nth-child(3) { transition-delay: 1.2s; }
.it-end p { font: 500 18px/1.4 'Inter', sans-serif; color: #C9CDD6; opacity: 0; transition: opacity .6s 2s; }
