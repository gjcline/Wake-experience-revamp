<title>The Wake Experience</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Press+Start+2P&family=VT323&display=swap">
<style>
/* THE WAKE EXPERIENCE
   Layout concept: one arcade cabinet from coin to report. Pixel type marks what you do and
   where you are; long reading is set in a highly legible sans on dark panels.
   Yellow is you and your attention. Cyan is Wake. Pink is action. Violet is the room. */
html, body { height: 100%; }
body { margin: 0; background: #07060F; }
.wx {
  --a-bg: #07060F; --a-panel: #110E22; --a-panel2: #18142F; --a-line: #2C2650; --a-ink: #F4F1DE; --a-dim: #ABA7C8;
  --a-yellow: #FFD23F; --a-cyan: #39E5E0; --a-pink: #FF4F8B; --a-violet: #5B4C99;
  --acc: var(--a-yellow); --hi: #FFD23F; --hi-ink: #07060F; --hi-soft: rgba(255, 210, 63, .14);
  --px: 'Press Start 2P', 'Courier New', monospace; --term: 'VT323', 'Courier New', monospace;
  --read: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, -apple-system, sans-serif;
  min-height: 100%; background: var(--a-bg); color: var(--a-ink); font: 400 18px/1.55 var(--read); color-scheme: dark;
  -webkit-font-smoothing: antialiased;
}
.wx.wake { --acc: var(--a-cyan); }
.wx *, .wx *::before, .wx *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
.wx h1, .wx h2, .wx h3, .wx h4, .wx p, .wx ul, .wx ol, .wx blockquote, .wx dl { margin: 0; }
.wx ul, .wx ol { padding: 0; list-style: none; }
:where(.wx) button { font: inherit; color: inherit; cursor: pointer; }
.wx :focus-visible { outline: 3px solid var(--a-cyan); outline-offset: 3px; }

/* type */
.screen h1 { font: 400 clamp(17px, 2.2vw, 24px)/1.45 var(--px); color: var(--acc); text-wrap: balance; letter-spacing: .01em; }
.screen h2 { font: 400 clamp(13px, 1.5vw, 16px)/1.5 var(--px); color: var(--a-ink); text-wrap: balance; }
.lede { font-size: 20px; line-height: 1.5; color: var(--a-ink); max-width: 38em; }
.quiet { color: var(--a-dim); font-size: 16px; }
.stamp { font: 400 11px/1.6 var(--px); color: var(--a-dim); letter-spacing: .06em; }
.stamp b { color: var(--a-yellow); font-weight: 400; }

.screen { max-width: 1180px; margin: 0 auto; padding-block: 64px 56px; padding-inline: 20px; display: flex; flex-direction: column; gap: 22px; animation: boot .35s steps(4) backwards; }
@keyframes boot { from { clip-path: inset(0 0 100% 0); } }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 18px; }
.reveal > * { opacity: 0; transform: translateY(6px); transition: opacity .4s steps(4), transform .4s steps(4); }
.reveal > .in { opacity: 1; transform: none; }

/* controls: one button family, arcade styled */
.btn { font: 400 12px/1 var(--px); letter-spacing: .05em; padding: 15px 20px 14px; color: var(--a-ink); background: transparent; border: 0;
  box-shadow: inset 0 0 0 3px var(--a-ink); transition: transform .08s steps(2), background-color .1s; }
.btn:hover { background: rgba(244, 241, 222, .08); }
.btn:active { transform: translate(2px, 2px); }
.btn.primary { color: var(--a-bg); background: var(--acc); box-shadow: inset 0 0 0 3px var(--acc), 5px 5px 0 var(--a-pink); }
.btn.primary:hover { filter: brightness(1.1); }
.btn:disabled { opacity: .4; cursor: default; transform: none; filter: none; }
.link { background: none; border: 0; padding: 6px 0; color: var(--a-dim); text-decoration: underline; text-underline-offset: 4px; font-size: 16px; }
.link:hover { color: var(--a-ink); }
.link.back { font: 400 11px/1 var(--px); text-decoration: none; color: var(--a-ink); padding: 10px 0; }
.chip { font: 400 10px/1 var(--px); letter-spacing: .04em; padding: 10px 13px 9px; color: var(--a-ink); background: var(--a-panel); border: 0; box-shadow: inset 0 0 0 2px var(--a-line); display: inline-flex; align-items: center; gap: 8px; }
.chip:hover { box-shadow: inset 0 0 0 2px var(--a-ink); }
.chip.on { background: var(--acc); color: var(--a-bg); box-shadow: inset 0 0 0 2px var(--acc); }
.chip i, .tag i { font: 400 9px/1 var(--px); font-style: normal; background: var(--a-pink); color: var(--a-ink); min-width: 18px; height: 18px; padding: 0 4px; display: inline-grid; place-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.option { position: relative; text-align: left; padding: 16px 20px 16px 42px; background: var(--a-panel); border: 0; box-shadow: inset 0 0 0 3px var(--a-line); font-size: 18px; line-height: 1.4; transition: box-shadow .1s; }
.option::before { content: '▶'; position: absolute; left: 16px; top: 18px; font: 400 11px/1 var(--px); color: var(--a-line); }
.option:hover, .option:focus-visible { box-shadow: inset 0 0 0 3px var(--acc); outline: none; }
.option:hover::before, .option:focus-visible::before { color: var(--acc); animation: blink 1s steps(1) infinite; }
.options { display: flex; flex-direction: column; gap: 10px; max-width: 48em; width: 100%; }
@keyframes blink { 50% { opacity: 0; } }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.card { position: relative; text-align: left; padding: 18px; background: var(--a-panel); border: 0; box-shadow: inset 0 0 0 3px var(--a-line); display: flex; flex-direction: column; gap: 8px; min-width: 0; transition: transform .1s steps(2); }
.card strong { font-size: 18px; line-height: 1.3; font-weight: 700; }
.card span { color: var(--a-dim); font-size: 15px; }
.card.pickable:hover { box-shadow: inset 0 0 0 3px var(--a-ink); transform: translateY(-2px); }
.card.picked { box-shadow: inset 0 0 0 3px var(--a-yellow), 0 0 0 3px var(--a-bg), 0 0 0 6px var(--a-pink); }
.card .num { position: absolute; top: -12px; right: -10px; width: 30px; height: 30px; background: var(--a-yellow); color: var(--a-bg); font: 400 12px/30px var(--px); font-style: normal; text-align: center; }
.avwrap { display: inline-flex; flex: none; }
.av { display: block; image-rendering: pixelated; }
.from { display: flex; align-items: center; gap: 12px; }
.from > div { display: flex; flex-direction: column; min-width: 0; }
.from strong { font-weight: 700; }
.from span { color: var(--a-dim); font-size: 15px; }
.wx textarea, .wx input[type=text] { width: 100%; max-width: 48em; padding: 14px 16px; border: 0; box-shadow: inset 0 0 0 3px var(--a-line); background: var(--a-panel); color: var(--a-ink); font: inherit; resize: vertical; }
.wx textarea:focus, .wx input[type=text]:focus { box-shadow: inset 0 0 0 3px var(--acc); outline: none; }

/* the pixel face reads best in capitals */
.screen h1, .screen h2, .btn, .chip, .link.back, .when span, .tag, .panel-head h2, .sheet h3, .sec h4, .flag, .item em, .pinbtn, .related, .seat, .bubble strong,
.ask, .stages, .ranklabels span, .place, .part h3, .cmp-row h3, .tally-item span, .paper h3, .rank, .reader .empty, .toast, .option::before, .pair p::before { text-transform: uppercase; }
.finding .f-head h1 { text-transform: none; }

/* office */
.office, .meeting { max-width: 1280px; gap: 14px; padding-block: 58px 28px; }
.bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px 16px; }
.when { display: flex; align-items: baseline; gap: 14px; font: 400 10px/1 var(--px); color: var(--a-dim); letter-spacing: .06em; }
.when .clock { font: 400 34px/1 var(--term); color: var(--a-yellow); min-width: 4.6em; letter-spacing: 0; }
.clock.tock { animation: tock .5s steps(3); }
@keyframes tock { 40% { color: var(--a-pink); } }
.when .co { font: 400 16px/1 var(--read); letter-spacing: 0; color: var(--a-dim); }
.bar-right { display: flex; gap: 8px; }
.chip.go { box-shadow: inset 0 0 0 2px var(--a-ink); }
.chip.go.pulse { background: var(--a-yellow); color: var(--a-bg); animation: blink 1.2s steps(1) infinite; }
.stage { position: relative; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.prompt { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
.prompt h1 { font-size: clamp(14px, 1.7vw, 19px); }
.prompt p { color: var(--a-dim); font-size: 17px; }
.scene { position: relative; }
.scene-wrap { aspect-ratio: 240 / 124; max-width: 100%; overflow: hidden; box-shadow: 0 0 0 4px var(--a-line), 0 0 0 8px var(--a-bg), 0 0 0 11px var(--a-violet); }
.desk-art { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
.spots { position: absolute; inset: 0; }
.spot { position: absolute; border: 0; background: transparent; padding: 0; transition: background-color .1s; }
.spot:hover, .spot:focus-visible { background: rgba(255, 210, 63, .12); box-shadow: inset 0 0 0 3px var(--a-yellow); outline: none; }
.tag { position: absolute; top: -14px; left: 50%; transform: translateX(-50%); display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; padding: 8px 10px 7px; background: var(--a-bg); color: var(--a-ink); font: 400 10px/1 var(--px); letter-spacing: .04em; box-shadow: inset 0 0 0 2px var(--a-ink); }
.spot:hover .tag { background: var(--a-yellow); color: var(--a-bg); box-shadow: inset 0 0 0 2px var(--a-yellow); }
.panel { position: absolute; inset: 0; z-index: 3; background: var(--a-panel); box-shadow: inset 0 0 0 3px var(--a-line), 0 0 0 4px var(--a-bg), 0 0 0 7px var(--a-violet); display: flex; flex-direction: column; overflow: hidden; animation: boot .25s steps(3) both; }
.panel-head { display: flex; align-items: center; gap: 22px; padding: 12px 22px 8px; }
.panel-head h2 { color: var(--a-yellow); }
.panel-body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(240px, 320px) minmax(0, 1fr); }
.panel-body.single { grid-template-columns: minmax(0, 1fr); }
.panel-body.single .list { display: none; }
.list { overflow: auto; padding: 6px 12px 20px; display: flex; flex-direction: column; gap: 4px; }
.item { display: flex; align-items: center; gap: 12px; text-align: left; padding: 10px 12px; border: 0; background: transparent; min-width: 0; }
.item:hover, .item.on { background: var(--a-panel2); box-shadow: inset 3px 0 0 var(--a-yellow); }
.item-text { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.item strong { font-weight: 700; font-size: 16px; line-height: 1.3; }
.item-text span { color: var(--a-dim); font-size: 14px; }
.item.read strong { font-weight: 400; color: var(--a-dim); }
.item em { align-self: flex-start; margin-top: 4px; font: 400 8px/1.4 var(--px); font-style: normal; background: var(--a-pink); color: var(--a-ink); padding: 4px 6px; }
.reader { overflow: auto; padding: 14px 30px 30px; display: flex; flex-direction: column; gap: 18px; min-width: 0; background: var(--a-panel2); }
.reader .empty { margin: auto; font: 400 11px/1.6 var(--px); }
.doc { display: flex; flex-direction: column; gap: 14px; max-width: 44em; }
.doc h3 { font-size: 24px; line-height: 1.25; font-weight: 700; }
.doc .body { display: flex; flex-direction: column; gap: 12px; font-size: 19px; line-height: 1.6; }
.doc.message .body p { background: var(--a-panel); padding: 12px 16px; box-shadow: inset 0 0 0 2px var(--a-line); width: fit-content; max-width: 34em; }
.doc.note .body { font: 400 30px/1.15 var(--term); background: var(--a-yellow); color: var(--a-bg); padding: 26px; max-width: 18em; box-shadow: 6px 6px 0 var(--a-pink); }
.flag { font: 400 9px/1.4 var(--px); background: var(--a-pink); padding: 6px 8px; width: fit-content; }
.pinbtn { align-self: flex-start; font: 400 10px/1 var(--px); letter-spacing: .04em; padding: 12px 14px 11px; border: 0; background: transparent; box-shadow: inset 0 0 0 2px var(--a-dim); color: var(--a-ink); }
.pinbtn:hover { box-shadow: inset 0 0 0 2px var(--a-yellow); }
.pinbtn.pinned { background: var(--a-yellow); color: var(--a-bg); box-shadow: inset 0 0 0 2px var(--a-yellow); }
.sheet h3 { font: 400 16px/1.5 var(--px); color: var(--a-yellow); }
.sheet .intro { color: var(--a-dim); font-size: 16px; }
.mgr { display: flex; gap: 14px; align-items: flex-start; background: var(--a-panel); padding: 14px 16px; box-shadow: inset 0 0 0 2px var(--a-line); }
.mgr p { font-size: 18px; line-height: 1.5; }
.mgr span { color: var(--a-dim); font-size: 14px; }
.sec { display: flex; flex-direction: column; gap: 2px; }
.sec h4 { font: 400 10px/1.6 var(--px); color: var(--a-cyan); padding: 12px 12px 6px; letter-spacing: .04em; }
.line { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, auto); align-items: baseline; gap: 4px 18px; text-align: left; padding: 8px 12px; border: 0; background: transparent; font-size: 17px; line-height: 1.35; }
.line:nth-child(odd) { background: rgba(255, 255, 255, .025); }
.line:hover { background: var(--hi-soft); }
.line.pinned { background: var(--a-yellow); color: var(--a-bg); }
.line .v { font: 400 24px/1 var(--term); white-space: nowrap; }
.line .d { color: var(--a-dim); font-size: 15px; text-align: right; min-width: 6.5em; }
.line.pinned .d { color: var(--a-bg); }
.related { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--a-dim); font: 400 9px/1 var(--px); padding-top: 6px; }
.mobile-only { display: none; }
.notes { position: absolute; top: 0; right: 0; z-index: 4; width: min(380px, 100%); max-height: 100%; overflow: auto; background: var(--a-panel2); padding: 18px 20px; box-shadow: inset 0 0 0 3px var(--a-yellow); display: flex; flex-direction: column; gap: 12px; }
.notes-head { display: flex; justify-content: space-between; align-items: baseline; }
.notes h2 { color: var(--a-yellow); }
.notes li { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; padding: 8px 10px; background: var(--hi-soft); margin-bottom: 6px; font-size: 16px; }
.overlay { position: fixed; inset: 0; z-index: 20; background: rgba(4, 3, 10, .78); display: grid; place-items: center; padding: 16px; overflow: auto; }
.dialog { background: var(--a-panel); padding: 30px; width: min(680px, 100%); display: flex; flex-direction: column; gap: 16px; box-shadow: inset 0 0 0 3px var(--a-ink), 0 0 0 4px var(--a-bg), 0 0 0 7px var(--a-violet); animation: boot .3s steps(4) both; }
.dialog h2 { color: var(--a-yellow); }
.people { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.person { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 8px; border: 0; background: var(--a-panel2); box-shadow: inset 0 0 0 2px var(--a-line); }
.person:hover { box-shadow: inset 0 0 0 2px var(--a-yellow); }
.person strong { font-size: 15px; font-weight: 700; }
.person span { font-size: 13px; color: var(--a-dim); }
.said { font: 400 26px/1.2 var(--term); }
.reveal .reveal-item, .dialog .reveal { display: flex; flex-direction: column; gap: 14px; }
.dialog .reveal .row { flex-direction: row; }
.toasts { position: fixed; left: 20px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 30; display: flex; flex-direction: column; gap: 8px; }
.toast { display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 8px; border: 0; background: var(--a-bg); color: var(--a-ink); font: 400 9px/1.4 var(--px); box-shadow: inset 0 0 0 2px var(--a-pink); animation: boot .3s steps(3) both; }

/* meeting */
.room { display: flex; flex-direction: column; align-items: center; gap: 0; }
.seats { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 18px; }
.seat { display: flex; flex-direction: column; align-items: center; gap: 4px; font: 400 8px/1 var(--px); color: var(--a-dim); transition: transform .15s steps(2); }
.seat.speaking { color: var(--a-yellow); transform: translateY(-4px); }
.seat .av { box-shadow: 0 0 0 3px var(--a-line); }
.seat.speaking .av { box-shadow: 0 0 0 3px var(--a-yellow); }
.tabletop { width: min(720px, 100%); height: 14px; background: #8B5A2B; box-shadow: 0 5px 0 #6B4220; margin-top: 10px; }
.bubble { margin-top: 24px; background: var(--a-panel); padding: 14px 20px; max-width: 44em; display: flex; flex-direction: column; gap: 6px; font-size: 19px; line-height: 1.45; box-shadow: inset 0 0 0 3px var(--a-ink); }
.bubble strong { font: 400 10px/1 var(--px); color: var(--a-yellow); }
.bubble.pop { animation: boot .3s steps(3) both; }
.step { display: flex; flex-direction: column; gap: 18px; max-width: 980px; margin: 0 auto; width: 100%; animation: boot .3s steps(3) both; }
.issues { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.alloc-row { display: grid; grid-template-columns: minmax(0, 250px) minmax(0, 1fr); gap: 12px 20px; align-items: center; }

/* week */
.week, .glimpse { max-width: 820px; }
.timeline { display: flex; flex-direction: column; gap: 12px; }
.weekday { margin-top: 18px; color: var(--a-yellow) !important; }
.outcome { background: var(--a-panel); padding: 18px 22px; display: flex; flex-direction: column; gap: 8px; box-shadow: inset 0 0 0 3px var(--a-line); }
.outcome strong { font-weight: 700; font-size: 18px; }
.outcome p { font-size: 18px; line-height: 1.6; }
.outcome .quiet { font-size: 15px; }
.outcome.faint { background: transparent; box-shadow: none; padding: 4px 0; }
.outcome.faint p { color: var(--a-dim); font-size: 17px; }
.ask { font: 400 11px/1.6 var(--px); color: var(--a-pink); margin-top: 8px; }
.chosen { font-weight: 700; background: var(--hi-soft); padding: 10px 16px; width: fit-content; box-shadow: inset 0 0 0 2px var(--a-yellow); }

/* walk scenes reuse the arrival map; at night the building goes dark */
.map-holder.night .map-canvas { animation: night 2.6s steps(10) both; }
@keyframes night { to { filter: brightness(.38) saturate(.6) hue-rotate(15deg); } }

/* wake: processing */
.processing { gap: 12px; padding-block: 56px 32px; }
.field-wrap { position: relative; height: clamp(280px, 52vh, 520px); }
.field { position: absolute; inset: 0; width: 100%; height: 100%; }
.ranklabels span { position: absolute; transform: translateY(-9px); font: 400 10px/1.4 var(--px); white-space: pre; color: var(--a-ink); }
.caption { display: flex; flex-direction: column; gap: 16px; }
.stages { display: flex; flex-wrap: wrap; gap: 6px 16px; font: 400 9px/1.6 var(--px); color: var(--a-line); }
.stages li.done { color: var(--a-dim); }
.stages li.on { color: var(--a-cyan); }
.cap { font-size: 22px; line-height: 1.4; min-height: 4.4em; max-width: 34em; }
.cap b { font: 400 clamp(28px, 4.5vw, 46px)/1 var(--px); color: var(--a-cyan); margin-right: 10px; }
.cap em { display: block; font-style: normal; color: var(--a-dim); font-size: 18px; margin-top: 8px; }

/* wake: findings */
.finding { max-width: 960px; gap: 4px; padding-block: 56px 64px; }
.f-head { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 24px; align-items: start; margin-bottom: 16px; }
.rank { font: 400 clamp(26px, 4vw, 40px)/1 var(--px); color: var(--a-cyan); padding-top: 4px; }
.place { font: 400 10px/1.6 var(--px); color: var(--a-dim); margin-bottom: 10px; letter-spacing: .06em; }
.finding .f-head h1 { font: 700 clamp(24px, 3vw, 32px)/1.25 var(--read); color: var(--a-ink); letter-spacing: 0; }
.part { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 8px 24px; padding-block: 14px; }
.part h3 { font: 400 9px/1.7 var(--px); color: var(--a-cyan); padding-top: 4px; letter-spacing: .04em; }
.part p { font-size: 19px; line-height: 1.6; max-width: 38em; }
.part > div { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; min-width: 0; }
.ev-sum { display: flex; flex-direction: column; gap: 8px; }
.dots { display: flex; flex-wrap: wrap; gap: 6px; }
.dots i { width: 12px; height: 12px; background: transparent; box-shadow: inset 0 0 0 2px var(--a-cyan); }
.dots i.seen { background: var(--a-yellow); box-shadow: none; }
.evidence { display: flex; flex-direction: column; gap: 2px; width: 100%; }
.evidence li { display: grid; grid-template-columns: 12px minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1fr); gap: 2px 14px; align-items: baseline; font-size: 16px; line-height: 1.4; padding: 6px 0; }
.evidence li::before { content: ''; width: 10px; height: 10px; box-shadow: inset 0 0 0 2px var(--a-cyan); align-self: center; }
.evidence li.seen::before, .evidence li.pinned::before { background: var(--a-yellow); box-shadow: none; }
.evidence .v { font: 400 21px/1.1 var(--term); }
.evidence .w { color: var(--a-dim); font-size: 14px; }
.evidence li.seen .w, .evidence li.pinned .w { color: var(--a-yellow); }
.part.action { background: var(--a-panel); padding: 20px 22px; margin-top: 10px; box-shadow: inset 0 0 0 3px var(--a-cyan); grid-template-columns: 146px minmax(0, 1fr); }
.part.action p { font-size: 21px; font-weight: 700; line-height: 1.5; }
.foot { margin-top: 22px; }
.react { display: flex; flex-direction: column; gap: 12px; width: 100%; }

/* wake: glimpse */
.beats { display: flex; flex-direction: column; gap: 22px; }
.beats li { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 20px; opacity: .25; transition: opacity .4s steps(3); }
.beats li.done { opacity: .55; }
.beats li.on { opacity: 1; }
.beats b { font: 400 30px/1.1 var(--term); color: var(--a-cyan); font-weight: 400; }
.beats strong { font-size: 21px; font-weight: 700; display: block; line-height: 1.35; }
.beats p { color: var(--a-dim); font-size: 18px; margin-top: 4px; }
.progress { flex: 1; height: 6px; background: var(--a-line); overflow: hidden; min-width: 80px; }
.progress i { display: block; height: 100%; width: 0; background: var(--a-cyan); }

/* wake: comparison */
.compare { gap: 26px; }
.cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; align-items: start; }
.col { padding: 24px; display: flex; flex-direction: column; gap: 18px; background: var(--a-panel); min-width: 0; }
.col.you { box-shadow: inset 0 0 0 3px var(--a-yellow); }
.col.wk { box-shadow: inset 0 0 0 3px var(--a-cyan); }
.col.you h2 { color: var(--a-yellow); }
.col.wk h2 { color: var(--a-cyan); }
.cmp-row { display: flex; flex-direction: column; gap: 6px; }
.cmp-row h3 { font: 400 9px/1.6 var(--px); color: var(--a-dim); letter-spacing: .04em; }
.cmp-row p, .cmp-row li { font-size: 17px; line-height: 1.55; }
.cmp-row ol { counter-reset: n; display: flex; flex-direction: column; gap: 6px; }
.cmp-row li { counter-increment: n; display: grid; grid-template-columns: 1.6em minmax(0, 1fr); }
.cmp-row li::before { content: counter(n); font: 400 20px/1.2 var(--term); color: var(--a-dim); }
.tally { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.tally-item { display: flex; flex-direction: column; gap: 10px; padding: 18px; background: var(--a-panel); color: inherit; text-decoration: none; min-width: 0; box-shadow: inset 0 0 0 3px var(--a-line); }
.tally-item:hover { box-shadow: inset 0 0 0 3px var(--a-ink); }
.tally-item b { font: 400 34px/1 var(--px); color: var(--a-cyan); }
.tally-item.missed b, .tally-item.reprioritized b { color: var(--a-yellow); }
.tally-item.none { opacity: .4; }
.tally-item span { font: 400 9px/1.4 var(--px); overflow-wrap: anywhere; }
.cat { display: flex; flex-direction: column; gap: 12px; scroll-margin-top: 20px; }
.cat-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; margin-top: 14px; }
.cat-head h2 { color: var(--a-cyan); }
.cat.missed .cat-head h2, .cat.reprioritized .cat-head h2 { color: var(--a-yellow); }
.cat-head p { color: var(--a-dim); font-size: 17px; }
.cmp-item { background: var(--a-panel); padding: 20px 22px; display: flex; flex-direction: column; gap: 12px; box-shadow: inset 0 0 0 3px var(--a-line); }
.cmp-item h3 { font-size: 20px; line-height: 1.3; font-weight: 700; }
.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 28px; }
.pair p { font-size: 17px; line-height: 1.6; }
.pair p::before { display: block; font: 400 9px/1 var(--px); margin-bottom: 8px; }
.pair .y::before { content: 'YOU'; color: var(--a-yellow); }
.pair .w::before { content: 'WAKE'; color: var(--a-cyan); }

/* complete + report */
.complete { max-width: 920px; gap: 30px; }
.done-copy { display: flex; flex-direction: column; gap: 8px; font-size: 20px; }
.done-copy h1 { margin-bottom: 12px; color: var(--a-yellow); }
.done-copy .lede { color: var(--a-cyan); margin-top: 8px; }
.report { display: flex; flex-direction: column; gap: 14px; }
.report-bar { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: center; }
.report-bar .btn { padding: 11px 14px 10px; font-size: 10px; }
.paper { background: var(--a-panel); padding: clamp(22px, 5vw, 48px); display: flex; flex-direction: column; gap: 24px; box-shadow: inset 0 0 0 3px var(--a-line); }
.paper > h2 { color: var(--a-yellow); }
.paper .meta { color: var(--a-dim); font-size: 15px; margin-top: -14px; }
.paper section { display: flex; flex-direction: column; gap: 10px; }
.paper h3 { font: 400 11px/1.6 var(--px); color: var(--a-cyan); letter-spacing: .04em; }
.paper h4 { font-size: 17px; font-weight: 700; margin-top: 8px; }
.paper p, .paper li { font-size: 18px; line-height: 1.65; max-width: 44em; }
.paper ul, .paper ol { padding-left: 1.3em; display: flex; flex-direction: column; gap: 8px; }
.paper ul { list-style: square; }
.paper ol { list-style: decimal; }
.paper li::marker { color: var(--a-dim); }
.r-pair { display: flex; flex-direction: column; gap: 10px; padding: 16px 18px; background: var(--a-panel2); }
.r-pair > strong { font-size: 18px; }
.copybox { font: 14px/1.4 var(--read); max-width: none !important; }
.end { justify-content: space-between; }

@media (max-width: 760px) {
  .wx { font-size: 17px; }
  .screen { padding-inline: 16px; padding-top: 62px; }
  .spots { position: static; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 18px; }
  .spot { position: static; width: auto !important; height: auto !important; }
  .spot:hover { background: transparent; box-shadow: none; }
  .tag { position: static; transform: none; display: flex; justify-content: space-between; white-space: normal; text-align: left; padding: 14px; }
  .panel { position: fixed; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .panel-body { grid-template-columns: minmax(0, 1fr); }
  .panel-body .reader { display: none; padding-inline: 16px; }
  .panel-body.reading .reader, .panel-body.single .reader { display: flex; }
  .panel-body.reading .list { display: none; }
  .mobile-only { display: inline-block; align-self: flex-start; }
  .single .mobile-only { display: none; }
  .line { grid-template-columns: minmax(0, 1fr) auto; }
  .line .l { grid-column: 1 / -1; }
  .line .d { text-align: right; min-width: 0; }
  .notes { position: fixed; inset: auto 0 0 0; width: auto; max-height: 70%; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); }
  .dialog { padding: 22px; }
  .alloc-row, .part, .part.action, .cols, .pair { grid-template-columns: minmax(0, 1fr); }
  .f-head { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .evidence li { grid-template-columns: 12px minmax(0, 1fr); }
  .evidence .v, .evidence .w { grid-column: 2; }
  .tally { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .beats li { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .seat .av { width: 40px; height: 40px; }
  .seats { gap: 6px 10px; }
  .when .co { display: none; }
  .bar-right { width: 100%; }
  .bar-right .chip { flex: 1; justify-content: center; }
}
@media (prefers-reduced-motion: reduce) {
  .wx *, .wx *::before, .wx *::after { animation: none !important; transition: none !important; }
  .reveal > * { opacity: 1; transform: none; }
}
@media print {
  .wx { background: #fff; color: #111; }
  .screen.complete > *:not(.report), .report-bar, .a-mute { display: none !important; }
  .paper { background: #fff; box-shadow: none; padding: 0; }
  .paper p, .paper li { color: #111; }
}

/* ================================================================ TWO ROUNDS */
.round-tag { font: 400 9px/1 var(--px); letter-spacing: .06em; padding: 7px 8px 6px; background: var(--a-yellow); color: var(--a-bg); align-self: center; }
.round-tag.cyan { background: var(--a-cyan); }
.bar-right .chip { white-space: nowrap; }
.banner { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; padding: 12px 16px; background: var(--a-panel); box-shadow: inset 0 0 0 3px var(--a-pink); animation: boot .3s steps(3) both; }
.banner b { font: 400 11px/1.4 var(--px); color: var(--a-pink); }
.round1 { padding-bottom: 110px; }
.panel-head .sys { color: var(--a-dim); font-size: 14px; }

/* findings tray */
.tray { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px;
  padding: 12px 20px calc(12px + env(safe-area-inset-bottom, 0px)); background: rgba(9, 8, 20, .97); box-shadow: 0 -3px 0 var(--a-line), 0 -6px 0 var(--a-bg), 0 -9px 0 var(--a-violet); }
.tray-open { display: flex; align-items: center; gap: 14px; background: none; border: 0; padding: 6px 4px; }
.tray-open b { font: 400 11px/1 var(--px); color: var(--a-yellow); }
.tray-open .tcount { font: 400 26px/1 var(--term); color: var(--a-ink); }
.tray-open .tcount.ok { color: var(--a-yellow); }
.slots { display: flex; gap: 6px; }
.slots i { width: 16px; height: 16px; box-shadow: inset 0 0 0 2px var(--a-line); }
.slots i.need { box-shadow: inset 0 0 0 2px var(--a-dim); }
.slots i.on { background: var(--a-yellow); box-shadow: none; }

/* flag badges on report lines */
.line { position: relative; }
.line .fnum, .finding-row .fnum { position: absolute; left: -10px; top: 50%; transform: translateY(-50%); width: 22px; height: 22px; background: var(--a-pink); color: var(--a-ink); font: 400 10px/22px var(--px); font-style: normal; text-align: center; }
.finding-row .fnum { position: static; transform: none; flex: none; background: var(--a-yellow); color: var(--a-bg); width: 28px; height: 28px; line-height: 28px; }
.pinbtn { font-size: 11px; }

/* composer */
.composer { width: min(720px, 100%); }
.flagged { display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; background: var(--a-panel2); box-shadow: inset 4px 0 0 var(--a-yellow); }
.flagged strong { font-size: 19px; line-height: 1.35; }
.flagged span { color: var(--a-dim); font-size: 16px; }
.composer label, .composer .label { font: 400 11px/1.6 var(--px); color: var(--a-yellow); text-transform: uppercase; }
.composer .label .quiet { font: 400 14px/1 var(--read); text-transform: none; margin-left: 6px; }
.owner-pick { max-height: 132px; overflow: auto; }
.person-chip { padding: 5px 9px 5px 5px; font-size: 9px; }
.person-chip .av { width: 20px; height: 20px; }
.shake { animation: shake .3s steps(4); }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.finding-list { display: flex; flex-direction: column; gap: 12px; max-height: 52vh; overflow: auto; }
.finding-row { display: flex; gap: 14px; align-items: flex-start; padding: 14px; background: var(--a-panel2); }
.finding-row > div:nth-child(2) { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.finding-row strong { font-size: 16px; }
.finding-row p { font-size: 17px; }
.row-tools { display: flex; gap: 6px; flex-wrap: wrap; }
.row-tools .chip { padding: 8px 9px 7px; }
.mini-rules { display: flex; flex-direction: column; gap: 10px; }
.mini-rules li { padding-left: 22px; position: relative; font-size: 18px; }
.mini-rules li::before { content: '▶'; position: absolute; left: 0; top: 5px; font: 400 9px/1 var(--px); color: var(--a-yellow); }
.toast.note { box-shadow: inset 0 0 0 2px var(--a-yellow); font: 400 15px/1.4 var(--read); text-transform: none; max-width: 360px; padding: 10px 14px; }

/* the guide */
.coach-ring { position: fixed; z-index: 90; pointer-events: none; box-shadow: 0 0 0 3px var(--a-yellow, #FFD23F), 0 0 0 9999px rgba(4, 3, 10, .45); animation: ringpulse 1.2s steps(2) infinite; transition: all .15s; }
@keyframes ringpulse { 50% { box-shadow: 0 0 0 5px #FF4F8B, 0 0 0 9999px rgba(4, 3, 10, .45); } }
.coach .btn { pointer-events: auto; }
.coach-ring, .coach { box-sizing: border-box; }
.coach { pointer-events: none; position: fixed; z-index: 91; background: #110E22; color: #F4F1DE; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start;
  box-shadow: inset 0 0 0 3px #FFD23F, 6px 6px 0 #FF4F8B; font: 400 17px/1.45 'Atkinson Hyperlegible', system-ui, sans-serif; }
.coach b { font: 400 10px/1 'Press Start 2P', monospace; color: #FFD23F; letter-spacing: .06em; }
.coach .btn.small, .btn.small { padding: 11px 14px 10px; font-size: 10px; }
.coach-wait { font: 400 9px/1.4 'Press Start 2P', monospace; color: #FF4F8B; text-transform: uppercase; animation: blink 1.1s steps(1) infinite; }
.coach .btn.primary { color: #07060F; background: #FFD23F; box-shadow: inset 0 0 0 3px #FFD23F, 4px 4px 0 #FF4F8B; font: 400 10px/1 'Press Start 2P', monospace; border: 0; }

/* rewind */
.rewind { min-height: 80vh; justify-content: center; align-items: flex-start; }
.big-clock { font: 400 clamp(64px, 12vw, 120px)/1 var(--term); color: var(--acc); }
.rewind-copy { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.screen h1.cyan { color: var(--a-cyan); }
.vhs { animation: vhs .12s steps(2) infinite; }
@keyframes vhs { 50% { transform: translateX(3px); filter: hue-rotate(40deg) contrast(1.3); } }

/* round 2: scan */
.scan { gap: 18px; }
.scan-grid { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 22px; align-items: center; }
.scan .field-wrap { height: clamp(260px, 50vh, 460px); }
.syslist { display: flex; flex-direction: column; gap: 8px; }
.syslist li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 12px; background: var(--a-panel); box-shadow: inset 0 0 0 2px var(--a-line); color: var(--a-dim); font-size: 16px; }
.syslist li b { font: 400 22px/1 var(--term); }
.syslist li.on { color: var(--a-ink); box-shadow: inset 0 0 0 2px var(--a-cyan); }
.syslist li.on b { color: var(--a-cyan); }

/* round 2: console */
.wake-console { max-width: 1280px; gap: 18px; padding-bottom: 110px; }
.console-head { display: flex; flex-direction: column; gap: 8px; }
.console-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
.wcards { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.wcard { background: var(--a-panel); padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; box-shadow: inset 0 0 0 3px var(--a-line); transition: box-shadow .2s; }
.wcard.urgent { box-shadow: inset 0 0 0 3px var(--a-pink); }
.wcard.assigned { box-shadow: inset 0 0 0 3px var(--a-cyan); padding-block: 14px; }
.wcard.glow, .filtered.glow { animation: glow 1.4s steps(6); }
@keyframes glow { 0%, 60% { box-shadow: inset 0 0 0 4px var(--a-yellow), 0 0 0 6px rgba(255, 210, 63, .25); } }
.wc-top { display: flex; align-items: center; gap: 12px; }
.wc-top .rank { font: 400 18px/1 var(--px); color: var(--a-cyan); padding-top: 0; }
.wc-top .place { font: 400 9px/1.4 var(--px); color: var(--a-dim); flex: 1; }
.wcard h3 { font-size: 21px; line-height: 1.3; font-weight: 700; }
.why { font-size: 17px; line-height: 1.55; color: var(--a-ink); }
.ev { display: flex; flex-wrap: wrap; gap: 8px; }
.ev li { display: flex; flex-direction: column; gap: 3px; padding: 8px 10px; background: var(--a-panel2); box-shadow: inset 0 0 0 2px var(--a-line); font-size: 14px; line-height: 1.35; max-width: 100%; }
.ev li.seen, .ev li.flagged { box-shadow: inset 0 0 0 2px var(--a-yellow); }
.ev .sysname { font: 400 8px/1.4 var(--px); color: var(--a-cyan); text-transform: uppercase; }
.sharp { display: flex; flex-direction: column; gap: 6px; }
.sharp li { font-size: 15px; padding: 8px 10px; background: rgba(57, 229, 224, .08); box-shadow: inset 3px 0 0 var(--a-cyan); }
.sharp b { font: 400 9px/1 var(--px); color: var(--a-cyan); }
.do { display: flex; gap: 12px; align-items: baseline; }
.do .lbl { font: 400 10px/1 var(--px); color: var(--a-bg); background: var(--a-cyan); padding: 6px 7px 5px; }
.do p { font-size: 18px; font-weight: 700; }
.wc-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.owners { display: flex; flex-wrap: wrap; gap: 10px; }
.owner { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; }
.stampd { font: 400 10px/1 var(--px); color: var(--a-cyan); }
.check { color: var(--a-dim); font-size: 15px; }
.side { display: flex; flex-direction: column; gap: 16px; position: sticky; top: 16px; }
.side section { background: var(--a-panel); padding: 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: inset 0 0 0 3px var(--a-line); }
.side h2 { color: var(--a-yellow); }
.phone-list { display: flex; flex-direction: column; gap: 10px; }
.phone-list li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 10px; align-items: start; padding: 10px; background: var(--a-panel2); }
.phone-list li > :last-child { grid-column: 1 / -1; justify-self: start; }
.phone-list li.done { opacity: .6; }
.phone-list strong { font-size: 14px; }
.phone-list p { font-size: 15px; line-height: 1.4; }
.filtered ul { display: flex; flex-direction: column; gap: 8px; }
.filtered li { display: flex; flex-direction: column; gap: 2px; font-size: 14px; color: var(--a-dim); }
.filtered li strong { color: var(--a-ink); font-weight: 700; text-decoration: line-through; text-decoration-color: var(--a-pink); }
.filtered li.note-in { color: var(--a-cyan); }
.lockbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; display: flex; justify-content: flex-end; align-items: center; gap: 16px; padding: 12px 20px calc(12px + env(safe-area-inset-bottom, 0px)); background: rgba(9, 8, 20, .97); box-shadow: 0 -3px 0 var(--a-line), 0 -6px 0 var(--a-bg), 0 -9px 0 var(--a-cyan); }
.flyer { position: fixed; z-index: 95; padding: 10px; background: var(--a-cyan, #39E5E0); color: #07060F; font: 400 10px/1 'Press Start 2P', monospace; transition: transform .6s steps(8), opacity .6s steps(8); pointer-events: none; }

/* the meeting */
.meeting { gap: 18px; }
.meet-head { display: flex; flex-direction: column; gap: 8px; }
.board { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.tile { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px 8px; background: var(--a-panel); box-shadow: inset 0 0 0 2px var(--a-line); text-align: center; min-width: 0; }
.tile b { font: 400 9px/1.3 var(--px); }
.tile .ttl { font-size: 12px; color: var(--a-dim); line-height: 1.2; overflow-wrap: anywhere; }
.tile.hit.you { box-shadow: inset 0 0 0 2px var(--a-yellow); animation: pop .4s steps(3); }
.tile.hit.wake { box-shadow: inset 0 0 0 2px var(--a-cyan); animation: pop .4s steps(3); }
.tile.nobody { opacity: .85; }
.avwrap.q { width: 40px; height: 40px; display: grid; place-items: center; background: var(--a-panel2); font: 400 18px/1 var(--px); color: var(--a-pink); }
.cnt { position: absolute; top: 4px; right: 4px; display: flex; gap: 3px; }
.cnt i { font: 400 9px/18px var(--px); font-style: normal; min-width: 18px; height: 18px; text-align: center; }
.cnt i.y { background: var(--a-yellow); color: var(--a-bg); }
.cnt i.w { background: var(--a-cyan); color: var(--a-bg); }
@keyframes pop { 50% { transform: scale(1.08); } }
.meet-stage { display: flex; flex-direction: column; gap: 16px; }
.deliver { background: var(--a-panel); padding: 20px 22px; display: flex; flex-direction: column; gap: 12px; box-shadow: inset 0 0 0 3px var(--a-yellow); animation: boot .3s steps(3) both; }
.deliver.wk { box-shadow: inset 0 0 0 3px var(--a-cyan); }
.dl-top { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.dl-top .rank { font: 400 14px/1 var(--px); color: var(--acc); padding: 0; }
.dl-top strong { font-size: 19px; }
.said-you { display: flex; gap: 12px; align-items: flex-start; }
.said-you p { font: 400 28px/1.15 var(--term); color: var(--a-yellow); }
.reacts { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.react-line { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; background: var(--a-panel2); animation: boot .3s steps(3) both; max-width: 46em; }
.react-line b { font: 400 9px/1.6 var(--px); color: var(--a-dim); }
.react-line p { font-size: 17px; line-height: 1.45; }
.status { display: inline-block; font: 400 9px/1 var(--px); padding: 7px 8px 6px; letter-spacing: .04em; white-space: nowrap; }
.s-handed { background: var(--a-cyan); color: var(--a-bg); }
.s-questions { background: var(--a-yellow); color: var(--a-bg); }
.s-pushback { background: var(--a-pink); color: var(--a-ink); }
.s-explained, .s-offTarget { background: var(--a-line); color: var(--a-ink); }
.summary { display: flex; flex-direction: column; gap: 14px; align-items: flex-start; padding: 20px 22px; background: var(--a-panel); box-shadow: inset 0 0 0 3px var(--a-line); }
.tally-line { display: flex; flex-wrap: wrap; gap: 8px; }
.deliver .status { align-self: flex-start; }
.done-list { display: flex; flex-direction: column; gap: 6px; }
.done-list li { display: flex; gap: 10px; align-items: baseline; font-size: 16px; line-height: 1.45; padding: 8px 12px; background: var(--a-panel); }
.done-list b { white-space: nowrap; }
.wgw { display: flex; flex-direction: column; gap: 6px; }
.wgw-row { display: grid; grid-template-columns: 200px minmax(0, 1fr) minmax(0, 1fr); gap: 8px 18px; padding: 12px 14px; background: var(--a-panel); align-items: start; }
.wgw-row.head { background: none; padding-block: 0; }
.wgw-row.head .y { font: 400 10px/1.4 var(--px); color: var(--a-yellow); }
.wgw-row.head .w { font: 400 10px/1.4 var(--px); color: var(--a-cyan); }
.who { display: flex; align-items: center; gap: 10px; }
.who b { font-size: 15px; }
.cellw { display: flex; flex-direction: column; gap: 6px; }
.cellw p { font-size: 16px; line-height: 1.45; }
.cellw .status { margin-left: 4px; vertical-align: middle; }

/* the week */
.week { max-width: 1100px; }
.days { display: flex; gap: 8px; }
.days span { font: 400 10px/1 var(--px); padding: 9px 12px 8px; background: var(--a-panel); color: var(--a-line); }
.days span.on { color: var(--a-bg); background: var(--a-cyan); }

=[{id:"eml_flash",kind:"email",from:"dev",when:"6:52 AM",title:"Flash numbers are in",cost:4,cat:"finance",volume:1,signals:["note.mix"],body:["Flash is in the reports folder.","Headlines: Riverside labor is over again, fifth week running. Ashford had a huge week. Kingsley was soft. {Materials} cost is up again, looks like mix to me.","I have Riverside labor on the agenda for ten."]},{id:"eml_hire",kind:"email",from:"derek",when:"Sun 9:14 PM",title:"Need two more people at Riverside",cost:4,cat:"labor",volume:1,signals:["msg.hire.L4"],body:["I know labor looks high on paper. The reality on the floor is we are drowning every afternoon and I am paying overtime to get through it.","I need approval for two more {frontlines}. I have candidates ready. Can we get this done this week?"]},{id:"eml_angry",kind:"email",from:"aiko",when:"Fri 4:40 PM",title:"Fwd: Worst experience I have ever had",cost:4,cat:"customer",volume:1,signals:["eml.angry.L3"],flag:"Copied to the CEO",body:["Forwarding so you have it. This {customer} copied Helen and posted online.",'"I waited, I was ignored, and nobody apologized. I have been coming to Kingsley for six years and I am done."',"We refunded the full amount Friday and I called personally. They were calmer by the end. Flagging because Helen asked about it."]},{id:"eml_promo",kind:"email",from:"colin",when:"Fri 3:02 PM",title:"Intro offer is crushing it at Harbor Street",cost:4,cat:"customer",volume:1,signals:["mkt.promo.L1"],body:["212 new {customers} at Harbor Street in four weeks. That is a record for any {unit} we have.","Revenue there is up 6% and Grace is thrilled. I would like to roll this out to the other five. Can I get ten minutes this week?"]},{id:"eml_hr",kind:"email",from:"renee",when:"Fri 5:30 PM",title:"People changes this week",cost:4,cat:"people",volume:1,signals:["hr.exits.L6"],body:["Short list this week. Full detail is in the People report.","One more resignation at Tanner Creek. That makes three there in five weeks, all people we hired this quarter. I have asked Eli for exit notes."]},{id:"eml_bank",kind:"email",from:"dev",when:"Thu 11:00 AM",title:"Insurance premium went out",cost:3,cat:"finance",volume:1,signals:["eml.bank"],body:["FYI, the annual insurance premium of $201k was paid today as scheduled. Cash will look light on Monday's flash. Nothing unusual."]},{id:"eml_it",kind:"email",from:"it",when:"Thu 9:15 AM",title:"Password policy changes Friday",cost:2,cat:"general",volume:1,signals:["eml.it"],body:["Starting Friday, passwords must be 14 characters and will expire every 180 days. You will be prompted at your next sign in."]},{id:"eml_party",kind:"email",from:"renee",when:"Wed 2:20 PM",title:"Holiday party: vote on a venue",cost:2,cat:"general",volume:1,signals:["eml.party"],body:["Three options this year. Please vote by Wednesday so we can book."]},{id:"eml_quote",kind:"email",from:"vendor",when:"19 days ago",title:"Quote: replacement {equipment}, Old Mill",cost:5,cat:"maintenance",volume:1,signals:["eml.quote.L2"],body:["As discussed with Marcus, the {equipment} at Old Mill is past its rated life and the faults we keep repairing will keep coming back.","Replacement installed: $38,400. Lead time is three weeks from approval. This quote is good for 30 days.","Let me know how you would like to proceed."]},{id:"eml_price",kind:"email",from:"calder",when:"Six weeks ago",title:"Updated price list attached",cost:5,cat:"purchasing",volume:1,signals:["eml.price"],body:["Please find our updated price list attached, effective immediately across all delivery points.","We appreciate your continued business."]},{id:"msg_noor",kind:"message",from:"noor",when:"Sat 6:31 PM",title:"Noor Haddad",cost:3,cat:"operations",volume:1,signals:["msg.record.L5"],body:["Record week at Ashford!! Biggest since we opened.","Team is wiped but proud. Just wanted you to hear it from me first."]},{id:"msg_marcus",kind:"message",from:"marcus",when:"Fri 2:12 PM",title:"Marcus Bell",cost:3,cat:"operations",volume:1,signals:["msg.overflow.L2"],body:["{Equipment} is down again. Sent this afternoon's work over to Noor at Ashford.","Tech says it will be back up Monday."]},{id:"msg_eli",kind:"message",from:"eli",when:"Fri 7:48 PM",title:"Eli Brooks",cost:3,cat:"people",volume:1,signals:["msg.sat.L6"],body:["Schedule is tight again. I am covering Saturday myself.","Will get next week posted as soon as I can."]},{id:"msg_grace",kind:"message",from:"grace",when:"Fri 5:05 PM",title:"Grace Lindqvist",cost:3,cat:"people",volume:1,signals:["msg.desk.L1"],body:["Another full week here. The offer is really working.","Desk is still short since Dana left but we are managing. Any news on the replacement?"]},{id:"msg_aiko",kind:"message",from:"aiko",when:"Sat 9:20 AM",title:"Aiko Tanaka",cost:3,cat:"operations",volume:1,signals:["msg.closure.L3"],body:["Back to normal after Tuesday's closure. Water main work is finished on our street.","Numbers will look light for the week. Per day we were fine."]},{id:"rep_fin",kind:"report",from:"dev",when:"Mon 6:10 AM",title:"Weekly flash",sub:"Revenue, labor, {materials}, cash",cost:16,cat:"finance",volume:318,intro:"Last week against the eight week average.",sections:[{title:"Revenue",lines:["fin.rev.L1","fin.rev.L2","fin.rev.L3","fin.rev.L4","fin.rev.L5","fin.rev.L6"]},{title:"Labor",lines:["fin.labor.L1","fin.labor.L2","fin.labor.L3","fin.labor.L4","fin.labor.L5","fin.labor.L6"]},{title:"{Materials} and other costs",lines:["fin.mat.all","fin.ticket.L1","fin.util.all","fin.uniform"]},{title:"Cash",lines:["fin.cash"]}]},{id:"rep_labor",kind:"report",from:"marisol",when:"Mon 6:10 AM",title:"Labor and scheduling",sub:"Hours, overtime, how the time was used",cost:16,cat:"labor",volume:1486,intro:"Last week against the eight week norm.",sections:[{title:"Overtime",lines:["pay.ot.L1","pay.ot.L2","pay.ot.L3","pay.ot.L4","pay.ot.L5","pay.ot.L6"]},{title:"How paid hours were used",lines:["lab.util.co","lab.util.L2","lab.util.L4","lab.util.L5"]},{title:"Sched  is usually 88%."]},{id:"msg_colin_social",kind:"message",from:"colin",when:"",title:"Colin Hart",cost:0,cat:"general",volume:1,signals:["ping.social"],arrives:!0,body:["Can I post the Harbor Street numbers on LinkedIn? Huge month!"]},{id:"eml_lunch",kind:"email",from:"renee",when:"",title:"Uniform vendor lunch Wednesday",cost:0,cat:"general",volume:1,signals:["ping.lunch"],arrives:!0,body:["Confirming lunch with the uniform vendor Wednesday at noon. Let me know if you want to join."]},{id:"msg_renee_pto",kind:"message",from:"renee",when:"",title:"Renee Whitlock",cost:0,cat:"general",volume:1,signals:["ping.pto"],arrives:!0,body:["Approving three time-off requests for next week unless you object."]},{id:"msg_tom",kind:"message",from:"tom",when:"",title:"Tom Okafor",cost:0,cat:"general",volume:1,signals:["ping.tom"],arrives:!0,body:["Heading out to Kingsley this afternoon unless you need me somewhere else."]},{id:"eml_quote2",kind:"email",from:"vendor",when:"",title:"Following up: Old Mill quote expires in 11 days",cost:3,cat:"maintenance",volume:1,signals:["eml.quote.L2"],arrives:!0,body:["Following up on the replacement quote I sent 19 days ago for the {equipment} at Old Mill.","$38,400 installed, three weeks from approval. The quote expires in 11 days."]}],Ve=[{id:"ev.marcus2",when:{at:505},add:"msg_marcus2",toast:"Marcus Bell sent a message"},{id:"ev.social",when:{at:492},add:"msg_colin_social",toast:"Colin Hart sent a message"},{id:"ev.lunch",when:{at:521},add:"eml_lunch",toast:"New email from Renee Whitlock"},{id:"ev.pto",when:{at:558},add:"msg_renee_pto",toast:"Renee Whitlock sent a message"},{id:"ev.tom",when:{at:576},add:"msg_tom",toast:"Tom Okafor sent a message"},{id:"ev.agenda",when:{at:545},add:"msg_dev",toast:"Dev Anand sent a message"},{id:"ev.util",when:{seenOf:["fin.labor.L4","pay.ot.L4","msg.hire.L4"],count:2,delay:6},add:"msg_marisol",toast:"Marisol Vega sent a message"},{id:"ev.cx",when:{seenOf:["cx.sat.L1","cx.repeat.co","cx.repeat.L1","cx.new.L1","mkt.promo.L1"],count:2,delay:8},add:"msg_colin",toast:"Colin Hart sent a message"},{id:"ev.quote",when:{seenOf:["mnt.wo.L2","mnt.down.L2","msg.overflow.L2","mnt.today.L2"],count:1,delay:10},add:"eml_quote2",toast:"New email from Hale Equipment"}],Xe=[{id:"F1",loc:"L4",urgency:.9,impact:.85,title:"Riverside has a scheduling problem that looks like a labor problem.",short:"the hours are in the wrong half of the day",finding:"Riverside is paying for more hours and getting less done with them. Labor is 34.1% of revenue, up 4.1 points in five weeks, on flat volume.",connection:"Five weeks ago the schedule template moved {lead} coverage to the morning. Over the same period the work moved to the afternoon, and 58% of {visits} now arrive after 1 PM. Payroll, scheduling, throughput, waiting, reviews, and return visits all bend in the same week.",interpretation:"The hours are in the wrong half of the day. Mornings are overstaffed and idle. Afternoons run long and spill into overtime. {Customers} feel it first: the {waitLabel} has doubled and seven points fewer of them are coming back. Cutting hours would deepen the afternoon shortage. Two more hires would add cost to a schedule that already has enough people in it.",action:"Move {lead} coverage back to match the afternoon peak this week. Hold the hire request. Recheck the wait and overtime in ten days.",core:["fin.labor.L4","lab.util.L4","sch.template.L4","ops.wait.L4"],evidence:["fin.labor.L4","fin.rev.L4","pay.ot.L4","lab.util.L4","sch.template.L4","ops.demand.L4","ops.thru.L4","ops.wait.L4","cx.sat.L4","cx.reviews.L4","cx.repeat.L4","msg.hire.L4"],rootConcepts:["scheduling","inefficiency","capacity"],whyFirst:"Labor cost is the last thing to move here. The schedule moved first, and reducing hours would make the afternoons worse."},{id:"F2",loc:"L2",urgency:.85,impact:.75,title:"Old Mill's {equipment} is failing, and Ashford's record week is the evidence.",short:"one failing unit is costing two {units}",finding:"The {equipment} at Old Mill has been repaired three times in six weeks and was down 19 hours in the last two. Each repair was closed as fixed.",connection:"Old Mill's revenue is down 5.8%. Ashford's is up 9.4%. Those are largely the same {visits}. Marcus has been sending work across town, and Ashford has covered it with 54 hours of overtime.",interpretation:"One failing unit is quietly costing two {units}. Old Mill loses capacity. Ashford's best week on paper is a team running past its limit: the wait there is up and two people have asked about transfers. The replacement quote has sat unanswered for 19 days and carries a three week lead time.",action:"Approve the $38,400 replacement today. Until it arrives, route Old Mill's overflow on a plan and cap Ashford's overtime.",core:["mnt.wo.L2","mnt.down.L2","eml.quote.L2","fin.rev.L5"],evidence:["mnt.wo.L2","mnt.down.L2","mnt.age.L2","eml.quote.L2","fin.rev.L2","lab.util.L2","ops.thru.L2","msg.overflow.L2","fin.rev.L5","msg.record.L5","pay.ot.L5","lab.util.L5","ops.wait.L5","hr.transfer.L5"],rootConcepts:["equipment","capacity"],whyFirst:"Every week without a decision adds another week to a three week lead time, and Ashford is paying for it in overtime."},{id:"F4",loc:null,urgency:.6,impact:.7,title:"{supplier} has been billing above contract for six weeks.",short:"a billing variance spread thin across all six {units}",finding:"{Materials} cost is up 1.2 points across the company. It has been explained as mix.",connection:"Mix accounts for 0.2 of the 1.2 points. Invoice prices on the top 40 items rose 6.8% the same week {supplier} sent an updated price list. The contract locks rates through March 31.",interpretation:"This is a billing variance, spread thinly enough across six {units} that no single manager would notice it. $11,900 has been paid above contract so far. At this rate it is about $103,000 a year.",action:"Dispute the invoices back to the effective date and recover the overage. Hold {supplier} to the contract price li
